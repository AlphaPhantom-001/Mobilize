    async function getSyncSettings() {
      const syncUrl = (await dbGet('settings', 'syncUrl'))?.value || '';
      const sheetId = (await dbGet('settings', 'sheetId'))?.value || DEFAULT_SHEET_ID;
      const folderId = (await dbGet('settings', 'folderId'))?.value || DEFAULT_FOLDER_ID;
      return { syncUrl, sheetId, folderId };
    }

    // Canvas Downscaler: max 800px wide, JPEG 0.6
    async function prepareImageBase64(blob) {
      if (!blob) return '';
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          const maxW = 800;
          let w = img.width;
          let h = img.height;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
          resolve(dataUrl);
        };
        img.onerror = () => resolve('');
        img.src = URL.createObjectURL(blob);
      });
    }

    async function sendRowSyncRequest(row, imageBase64, settings) {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000); // 20s timeout

      const fd = new FormData();
      fd.append('action', 'addRow');
      fd.append('sheetId', settings.sheetId);
      fd.append('folderId', settings.folderId);
      fd.append('sn', row.sn || '');
      fd.append('name', row.name || '');
      fd.append('portfolio', row.portfolio || '');
      fd.append('lga', row.lga || '');
      fd.append('lgaCode', row.lgaCode || '');
      fd.append('ward', row.ward || '');
      fd.append('wardCode', row.wardCode || '');
      fd.append('pu', row.pu || '');
      fd.append('puCode', row.puCode || '');
      fd.append('contact', row.contact || '');
      fd.append('contact2', row.contact2 || '');
      fd.append('imageData', imageBase64 || '');
      fd.append('fileName', imageBase64 ? `row_${row.id}_${row.sn || '0'}.jpg` : '');

      try {
        const resp = await fetch(settings.syncUrl, {
          method: 'POST',
          body: fd,
          signal: controller.signal
        });
        clearTimeout(timeoutId);
        if (!resp.ok) {
          throw new Error(`HTTP ${resp.status}`);
        }
        const data = await resp.json();
        return data;
      } catch (err) {
        clearTimeout(timeoutId);
        throw err;
      }
    }

    async function syncSingleRow(id) {
      const settings = await getSyncSettings();
      if (!settings.syncUrl) {
        toast("Please configure your Google Apps Script Sync URL in Settings first.", "warning");
        openModal('settings');
        return;
      }

      const row = await dbGet('rows', id);
      if (!row) return;

      toast("Syncing row...", "info", 1500);
      const imgRec = await dbGet('images', id);
      const base64 = imgRec ? await prepareImageBase64(imgRec.blob) : '';

      try {
        const res = await sendRowSyncRequest(row, base64, settings);
        if (res && res.result === 'success') {
          row.sync = 'synced';
          row.syncedAt = new Date().toISOString();
          if (res.imageUrl) row.imageUrl = res.imageUrl;
          await dbPut('rows', row);
          toast("Row synced successfully to Google Sheets & Drive!", "success");
        } else {
          row.sync = 'error';
          await dbPut('rows', row);
          toast(`Sync error: ${res?.message || 'Server error'}`, "error");
        }
      } catch (err) {
        row.sync = 'error';
        await dbPut('rows', row);
        toast(`Sync failed: ${err.message}`, "error");
      }
      R();
    }

    async function startSyncPending() {
      if (S.syncRunning) return;
      const settings = await getSyncSettings();
      if (!settings.syncUrl) {
        toast("Please configure your Google Apps Script Sync URL in Settings first.", "warning");
        openModal('settings');
        return;
      }

      const allRows = await dbAll('rows');
      const pendingRows = allRows.filter(r => r.sync === 'pending' || r.sync === 'error' || !r.sync);

      if (pendingRows.length === 0) {
        toast("No pending rows to sync.", "info");
        return;
      }

      // Warning if > 200 rows
      if (pendingRows.length > 200) {
        const mins = Math.ceil(pendingRows.length / 50);
        alert(`You have ${pendingRows.length} unsynced rows. Syncing will take about ${mins} minutes. Keep this tab open and connected.`);
      }

      S.syncRunning = true;
      S.syncProgress = { current: 0, total: pendingRows.length };
      R();

      const backoffDelays = [5000, 15000, 45000];

      for (let i = 0; i < pendingRows.length; i++) {
        const row = pendingRows[i];
        S.syncProgress.current = i + 1;
        toast(`Syncing ${i + 1} of ${pendingRows.length}…`, "info", 2000);

        const imgRec = await dbGet('images', row.id);
        const base64 = imgRec ? await prepareImageBase64(imgRec.blob) : '';

        let attempt = 0;
        let success = false;

        while (attempt <= 3 && !success) {
          try {
            const res = await sendRowSyncRequest(row, base64, settings);
            if (res && res.result === 'success') {
              row.sync = 'synced';
              row.syncedAt = new Date().toISOString();
              if (res.imageUrl) row.imageUrl = res.imageUrl;
              await dbPut('rows', row);
              success = true;
            } else {
              throw new Error(res?.message || "Sync returned error");
            }
          } catch (err) {
            attempt++;
            if (attempt <= 3) {
              const waitMs = backoffDelays[attempt - 1];
              toast(`Row #${row.sn || row.id} rate limited/error. Backing off ${waitMs / 1000}s...`, "warning", waitMs);
              await new Promise(r => setTimeout(r, waitMs));
            } else {
              row.sync = 'error';
              await dbPut('rows', row);
            }
          }
        }

        // Fixed 1200ms delay between each row request to protect concurrency quota
        await new Promise(resolve => setTimeout(resolve, 1200));
      }

      S.syncRunning = false;
      toast(`All synced ✓ (${pendingRows.length} rows processed)`, "success", 4000);
      R();
    }

    // ─────────────────────────────────────────────────────────────────
    // ─────────────────────────────────────────────────────────────────
    // MULTI-FORMAT FILE DISPATCHER & PARSERS (SHARED BY CARDS & LOCATIONS)
    // ─────────────────────────────────────────────────────────────────
    async function handleFile(evt, tab) {
      const file = evt.target.files[0];
      if (!file) return;
      const name = file.name.toLowerCase();
      evt.target.value = ''; // Reset so the same file can be selected again
      if (name.endsWith(".doc")) {
        S.msg = "Old .doc files are not supported. Save as .docx or PDF first.";
        toast(S.msg, "error", 5000);
        R();
        return;
      }
      if (name.endsWith(".pdf"))   return parseFile(file, tab, "pdf");
      if (/\.(jpg|jpeg|png)$/.test(name))
                                    return parseFile(file, tab, "image");
      if (name.endsWith(".csv"))   return parseFile(file, tab, "csv");
      if (name.endsWith(".xlsx"))  return parseFile(file, tab, "xlsx");
      if (name.endsWith(".docx"))  return parseFile(file, tab, "docx");
      S.msg = "Unrecognised file type: " + name;
      toast(S.msg, "error", 5000);
      R();
    }

    async function parseFile(file, tab, kind) {
      toast(`Parsing ${file.name}...`, "info", 3000);
      try {
        if (tab === "cards") {
          if (kind === "pdf") {
            await processPvcPdfFile(file);
          } else if (kind === "image") {
            await processPvcImageFile(file);
          } else if (kind === "csv") {
            await parseCardsCsv(file);
          } else if (kind === "xlsx") {
            await parseCardsExcel(file);
          } else if (kind === "docx") {
            await parseCardsDocx(file);
          }
          S.cardView = 'table';
          R();
        } else if (tab === "locations") {
          let items = [];
          let unreadablePages = [];
          if (kind === "pdf") {
            const res = await parseLocationPdf(file);
            items = res.items;
            unreadablePages = res.unreadablePages;
          } else if (kind === "image") {
            items = await parseLocationImage(file);
          } else if (kind === "csv") {
            items = await parseLocationCsv(file);
          } else if (kind === "xlsx") {
            items = await parseLocationExcel(file);
          } else if (kind === "docx") {
            items = await parseLocationDocx(file);
          }

          if (!items || items.length === 0) {
            S.msg = "No valid location rows could be extracted from " + file.name;
            toast(S.msg, "error", 5000);
            R();
            return;
          }

          // Open Import Preview modal before writing to registry
          S.importPreview = {
            fileName: file.name,
            items: items,
            unreadablePages: unreadablePages,
            fileRef: file
          };
          openModal('loc-preview');
        }
      } catch (err) {
        console.error("parseFile error:", err);
        S.msg = `Error reading ${file.name}: ${err.message}`;
        toast(S.msg, "error", 5000);
        R();
      }
    }

    // Helper: case-insensitive column matcher
    function getNormCol(obj, aliases) {
      if (!obj) return '';
      const keys = Object.keys(obj);
      for (const alias of aliases) {
        const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
        const foundKey = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanAlias);
        if (foundKey && obj[foundKey] !== undefined && String(obj[foundKey]).trim() !== '') {
          return String(obj[foundKey]).trim();
        }
      }
      return '';
    }

    // Cards CSV Parser
    async function parseCardsCsv(file) {
      const text = await file.text();
      const wb = XLSX.read(text, { type: 'string' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      await processCardDataRows(rawRows);
    }

    // Cards Excel Parser (SheetJS)
    async function parseCardsExcel(file) {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: 'array' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
      await processCardDataRows(rawRows);
    }

    // Cards Word Table Parser (JSZip -> word/document.xml)
    async function parseCardsDocx(file) {
      const zip = await JSZip.loadAsync(file);
      const docXml = await zip.file("word/document.xml").async("text");
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(docXml, "application/xml");
      const trs = Array.from(xmlDoc.getElementsByTagName("w:tr"));

      if (trs.length > 1) {
        const headers = Array.from(trs[0].getElementsByTagName("w:tc")).map(tc => {
          return Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim();
        });
        const rawRows = [];
        for (let i = 1; i < trs.length; i++) {
          const cells = Array.from(trs[i].getElementsByTagName("w:tc")).map(tc => {
            return Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim();
          });
          const rowObj = {};
          headers.forEach((h, hIdx) => {
            rowObj[h] = cells[hIdx] || '';
          });
          rawRows.push(rowObj);
        }
        await processCardDataRows(rawRows);
      } else {
        const textOnly = docXml.replace(/<w:p[^>]*>/g, '\n').replace(/<[^>]+>/g, ' ');
        const codeMatches = Array.from(textOnly.matchAll(/CODE[:\s]+(\d{2})-(\d{2})-(\d{2})-(\d{1,3})/gi));
        const captionMatches = Array.from(textOnly.matchAll(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/g));
        const phoneMatches = Array.from(textOnly.matchAll(/(0\d{10})/g));
        const count = Math.max(codeMatches.length, captionMatches.length, phoneMatches.length, 1);
        const rawRows = [];
        for (let i = 0; i < count; i++) {
          rawRows.push({
            name: captionMatches[i] ? captionMatches[i][2].trim().toUpperCase() : '',
            lga: captionMatches[i] ? captionMatches[i][3].trim().toUpperCase() : '',
            lgaCode: codeMatches[i] ? codeMatches[i][2] : '',
            wardCode: codeMatches[i] ? codeMatches[i][3] : '',
            puCode: codeMatches[i] ? codeMatches[i][4].padStart(3, '0') : '',
            contact: phoneMatches[i] ? phoneMatches[i][1] : ''
          });
        }
        await processCardDataRows(rawRows);
      }
    }

    async function processCardDataRows(rawRows) {
      const registry = await dbAll('registry');
      const existingRows = await dbAll('rows');
      let currentSn = existingRows.length;
      let added = 0;

      for (const r of rawRows) {
        const name = getNormCol(r, ['name', 'fullname', 'full name', 'voter name']);
        const portfolio = getNormCol(r, ['portfolio', 'mda', 'role', 'position']);
        let lga = getNormCol(r, ['lga', 'lganame', 'local government']);
        let lgaCode = getNormCol(r, ['lgacode', 'lga code', 'code']);
        let ward = getNormCol(r, ['ward', 'wardname']);
        let wardCode = getNormCol(r, ['wardcode', 'ward code']);
        let pu = getNormCol(r, ['pu', 'puname', 'polling unit', 'pollingunit']);
        let puCode = getNormCol(r, ['pucode', 'pu code']);
        const contact = getNormCol(r, ['contact', 'phone', 'phonenumber', 'phone number', 'mobile']);
        const contact2 = getNormCol(r, ['2ndcontact', '2nd contact', 'second contact', 'contact2', 'alternate phone']);

        if (!name && !contact && !lgaCode && !lga) continue;

        currentSn++;
        const flags = [];

        // Location Resolution against registry
        let matched = false;
        if (lgaCode) {
          const matchReg = registry.find(reg => 
            String(reg.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0') &&
            (wardCode ? String(reg.wardCode).padStart(2, '0') === String(wardCode).padStart(2, '0') : true) &&
            (puCode && reg.puCode ? String(reg.puCode).padStart(3, '0') === String(puCode).padStart(3, '0') : true)
          ) || registry.find(reg => 
            String(reg.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0') &&
            (wardCode ? String(reg.wardCode).padStart(2, '0') === String(wardCode).padStart(2, '0') : true)
          ) || registry.find(reg => 
            String(reg.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0')
          );

          if (matchReg) {
            matched = true;
            if (!lga) lga = matchReg.lgaName || '';
            if (!ward) ward = matchReg.wardName || '';
            if (!pu) pu = matchReg.puName || '';
          }
        }

        if (lgaCode && !matched) {
          flags.push("code not in registry");
        } else if (!lga && !lgaCode) {
          flags.push("LGA missing");
        }

        if (!name) flags.push("Name missing");
        if (!contact) flags.push("Phone number missing");

        const newRow = {
          sn: currentSn,
          name: name || `VOTER #${currentSn}`,
          portfolio: portfolio || '',
          lga: lga || '',
          lgaCode: lgaCode || '',
          ward: ward || '',
          wardCode: wardCode || '',
          pu: pu || '',
          puCode: puCode || '',
          contact: contact || '',
          contact2: contact2 || '',
          flags: flags,
          sync: 'pending',
          createdAt: new Date().toISOString()
        };

        await dbPut('rows', newRow);
        added++;
      }

      toast(`Added ${added} card record(s) to table!`, "success", 3000);
    }

    // ─────────────────────────────────────────────────────────────────
    // CARD RECTANGLE DETECTION & CROPPING (UP TO 8 CARDS PER PAGE)
    // ─────────────────────────────────────────────────────────────────
    function detectCardRectangles(canvas, expectedCount = 0) {
      const W = canvas.width;
      const H = canvas.height;

      // Fast downsampled canvas for robust contour & connected-components analysis
      const sW = 240;
      const sH = Math.round((H / W) * sW);
      const tCanvas = document.createElement('canvas');
      tCanvas.width = sW;
      tCanvas.height = sH;
      const tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(canvas, 0, 0, sW, sH);

      const imgData = tCtx.getImageData(0, 0, sW, sH);
      const d = imgData.data;

      // Sample edge/border luminance to detect scanner/page background
      let borderLum = 0, borderCount = 0;
      for (let x = 0; x < sW; x += 2) {
        for (let y of [0, 1, 2, sH - 3, sH - 2, sH - 1]) {
          const idx = (y * sW + x) * 4;
          borderLum += 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          borderCount++;
        }
      }
      for (let y = 0; y < sH; y += 2) {
        for (let x of [0, 1, 2, sW - 3, sW - 2, sW - 1]) {
          const idx = (y * sW + x) * 4;
          borderLum += 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          borderCount++;
        }
      }
      const bgL = borderLum / Math.max(1, borderCount);

      // Light regions against background: PVC cards are light (typically L > 175)
      const isLight = new Uint8Array(sW * sH);
      const thresh = (bgL < 200) ? Math.max(160, bgL + 25) : 215;

      for (let i = 0; i < sW * sH; i++) {
        const lum = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
        if (lum >= thresh) isLight[i] = 1;
      }

      // Connected component labeling (BFS)
      const visited = new Uint8Array(sW * sH);
      const boxes = [];
      const totalPixels = sW * sH;

      for (let y = 0; y < sH; y++) {
        for (let x = 0; x < sW; x++) {
          const idx = y * sW + x;
          if (isLight[idx] && !visited[idx]) {
            let minX = x, maxX = x, minY = y, maxY = y;
            const q = [idx];
            visited[idx] = 1;
            let qIdx = 0;

            while (qIdx < q.length) {
              const curr = q[qIdx++];
              const cx = curr % sW;
              const cy = Math.floor(curr / sW);
              if (cx < minX) minX = cx;
              if (cx > maxX) maxX = cx;
              if (cy < minY) minY = cy;
              if (cy > maxY) maxY = cy;

              if (cy > 0 && isLight[curr - sW] && !visited[curr - sW]) {
                visited[curr - sW] = 1; q.push(curr - sW);
              }
              if (cy < sH - 1 && isLight[curr + sW] && !visited[curr + sW]) {
                visited[curr + sW] = 1; q.push(curr + sW);
              }
              if (cx > 0 && isLight[curr - 1] && !visited[curr - 1]) {
                visited[curr - 1] = 1; q.push(curr - 1);
              }
              if (cx < sW - 1 && isLight[curr + 1] && !visited[curr + 1]) {
                visited[curr + 1] = 1; q.push(curr + 1);
              }
            }

            const bw = maxX - minX + 1;
            const bh = maxY - minY + 1;
            const area = bw * bh;
            const aspect = bw / bh;

            // Area between 2% and 48% of page (or up to 88% if single card)
            if (area >= totalPixels * 0.02 && area <= totalPixels * 0.88) {
              if ((aspect >= 1.05 && aspect <= 2.2) || (aspect >= 0.5 && aspect <= 0.95)) {
                const scX = W / sW;
                const scY = H / sH;
                boxes.push({
                  x: Math.max(0, Math.round(minX * scX)),
                  y: Math.max(0, Math.round(minY * scY)),
                  w: Math.min(W, Math.round(bw * scX)),
                  h: Math.min(H, Math.round(bh * scY)),
                  area: area
                });
              }
            }
          }
        }
      }

      // Deduplicate overlapping boxes
      const cleanBoxes = [];
      for (let i = 0; i < boxes.length; i++) {
        let keep = true;
        for (let j = 0; j < boxes.length; j++) {
          if (i !== j) {
            const A = boxes[i];
            const B = boxes[j];
            const oX = Math.max(0, Math.min(A.x + A.w, B.x + B.w) - Math.max(A.x, B.x));
            const oY = Math.max(0, Math.min(A.y + A.h, B.y + B.h) - Math.max(A.y, B.y));
            const oArea = oX * oY;
            if (oArea > (A.w * A.h) * 0.6 && (B.w * B.h) > (A.w * A.h)) {
              keep = false;
              break;
            }
          }
        }
        if (keep) cleanBoxes.push(boxes[i]);
      }

      // Sort in reading order (top-to-bottom, left-to-right)
      cleanBoxes.sort((a, b) => {
        const yDiff = a.y - b.y;
        if (Math.abs(yDiff) > H * 0.08) return yDiff;
        return a.x - b.x;
      });

      // If at least 1 card detected, limit to max 8 cards and return
      if (cleanBoxes.length > 0) {
        return cleanBoxes.slice(0, 8);
      }

      // Fallback: Partition page into standard multi-card grid if cards are on plain white background
      const count = Math.min(8, Math.max(1, expectedCount || 1));
      const fallbackBoxes = [];
      if (count <= 1) {
        fallbackBoxes.push({
          x: Math.round(W * 0.04),
          y: Math.round(H * 0.04),
          w: Math.round(W * 0.92),
          h: Math.round(H * 0.92)
        });
      } else {
        const cols = count > 1 ? 2 : 1;
        const rows = Math.ceil(count / cols);
        const cellW = W / cols;
        const cellH = H / rows;
        for (let i = 0; i < count; i++) {
          const c = i % cols;
          const r = Math.floor(i / cols);
          fallbackBoxes.push({
            x: Math.round(c * cellW + cellW * 0.02),
            y: Math.round(r * cellH + cellH * 0.02),
            w: Math.round(cellW * 0.96),
            h: Math.round(cellH * 0.96)
          });
        }
      }
      return fallbackBoxes;
    }

    function cropCardCanvas(sourceCanvas, box) {
      const cropped = document.createElement('canvas');
      const maxW = 800;
      let cw = box.w;
      let ch = box.h;
      if (cw > maxW) {
        ch = Math.round((ch * maxW) / cw);
        cw = maxW;
      }
      cropped.width = Math.max(10, cw);
      cropped.height = Math.max(10, ch);
      const ctx = cropped.getContext('2d');
      ctx.drawImage(sourceCanvas, box.x, box.y, box.w, box.h, 0, 0, cropped.width, cropped.height);
      return cropped;
    }

    async function processPvcPdfFile(file) {
      if (!window.pdfjsLib) {
        toast("PDF.js library is not loaded. Please check your internet connection.", "error");
        return;
      }
      toast("Reading PDF pages...", "info", 3000);

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const registry = await dbAll('registry');
        const numPages = pdf.numPages;
        let totalImportedCards = 0;

        toast(`Parsing ${numPages} page(s) with multi-card detection...`, "info", 4000);

        for (let i = 1; i <= numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });

          // Render page to canvas
          const pageCanvas = document.createElement('canvas');
          pageCanvas.width = viewport.width;
          pageCanvas.height = viewport.height;
          const pCtx = pageCanvas.getContext('2d');
          await page.render({ canvasContext: pCtx, viewport: viewport }).promise;

          // Extract text items with coordinates
          const textContent = await page.getTextContent();
          const itemsWithPos = (textContent.items || []).map(it => {
            const pt = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
            return { str: it.str, x: pt[0], y: pt[1] };
          });

          const fullPageText = itemsWithPos.map(it => it.str).join(' ');

          // Count text card indicators
          const codeMatches = Array.from(fullPageText.matchAll(/CODE[:\s]+(\d{2})-(\d{2})-(\d{2})-(\d{1,3})/gi));
          const captionMatches = Array.from(fullPageText.matchAll(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/g));
          const phoneMatches = Array.from(fullPageText.matchAll(/(0\d{10})/g));
          const expectedCards = Math.max(codeMatches.length, captionMatches.length, 1);

          // Detect individual card rectangles (light regions against background, up to 8 cards per page)
          const cardBoxes = detectCardRectangles(pageCanvas, expectedCards);

          toast(`Page ${i}: Found ${cardBoxes.length} card(s). Cropping and extracting...`, "info", 2000);

          for (let cIdx = 0; cIdx < cardBoxes.length; cIdx++) {
            const box = cardBoxes[cIdx];
            // Crop ONLY this card rectangle
            const cardCanvas = cropCardCanvas(pageCanvas, box);

            // Find text items located inside this card rectangle
            const boxItems = itemsWithPos.filter(it => 
              it.x >= box.x - 25 && it.x <= box.x + box.w + 25 &&
              it.y >= box.y - 25 && it.y <= box.y + box.h + 25
            );
            const boxText = boxItems.map(it => it.str).join(' ');

            let captionMatch = boxText.match(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/);
            let codeMatch = boxText.match(/CODE[:\s]+(\d{2})-(\d{2})-(\d{2})-(\d{1,3})/i);
            let phoneMatch = boxText.match(/(0\d{10})/);

            // If box text was empty or missing key fields, fallback to indexed matches from page
            if (!codeMatch && codeMatches[cIdx]) codeMatch = codeMatches[cIdx];
            if (!captionMatch && captionMatches[cIdx]) captionMatch = captionMatches[cIdx];
            if (!phoneMatch && phoneMatches[cIdx]) phoneMatch = phoneMatches[cIdx];

            // If still missing and Tesseract available, run OCR on ONLY this cropped card canvas
            if ((!codeMatch || !captionMatch) && window.Tesseract) {
              try {
                const ocrRes = await Tesseract.recognize(cardCanvas, 'eng');
                const ocrText = ocrRes?.data?.text || '';
                if (!captionMatch) captionMatch = ocrText.match(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/);
                if (!codeMatch) codeMatch = ocrText.match(/CODE[:\s]+(\d{2})-(\d{2})-(\d{2})-(\d{1,3})/i);
                if (!phoneMatch) phoneMatch = ocrText.match(/(0\d{10})/);
              } catch (e) {
                console.warn("Card OCR error:", e);
              }
            }

            const existingRows = await dbAll('rows');
            let sn = captionMatch ? parseInt(captionMatch[1]) : (existingRows.length + 1);
            let name = captionMatch ? captionMatch[2].trim().toUpperCase() : '';
            let lgaHint = captionMatch ? captionMatch[3].trim().toUpperCase() : '';

            let stateCode = codeMatch ? codeMatch[1] : '';
            let lgaCode = codeMatch ? codeMatch[2] : '';
            let wardCode = codeMatch ? codeMatch[3] : '';
            let puCode = codeMatch ? codeMatch[4].padStart(3, '0') : '';
            let contact = phoneMatch ? phoneMatch[1] : '';

            // Requirement 2: Location Resolution
            // If code cannot be found in registry store, do NOT fail the row.
            // Leave LGA/Ward/PU names blank, add flag "code not in registry", and keep row editable.
            let lgaName = "";
            let wardName = "";
            let puName = "";
            let matched = false;

            if (lgaCode) {
              const matchReg = registry.find(r => 
                String(r.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0') &&
                (wardCode ? String(r.wardCode).padStart(2, '0') === String(wardCode).padStart(2, '0') : true) &&
                (puCode && r.puCode ? String(r.puCode).padStart(3, '0') === String(puCode).padStart(3, '0') : true)
              ) || registry.find(r => 
                String(r.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0') &&
                (wardCode ? String(r.wardCode).padStart(2, '0') === String(wardCode).padStart(2, '0') : true)
              ) || registry.find(r => 
                String(r.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0')
              );

              if (matchReg) {
                lgaName = matchReg.lgaName || lgaHint || '';
                wardName = (wardCode && matchReg.wardCode === wardCode) ? (matchReg.wardName || '') : '';
                puName = (puCode && matchReg.puCode === puCode) ? (matchReg.puName || '') : '';
                matched = true;
              }
            }

            const flags = [];
            if (!matched) {
              lgaName = "";
              wardName = "";
              puName = "";
              flags.push("code not in registry");
            }

            if (!name) {
              name = `CARD P${i} #${cIdx + 1}`;
              flags.push("Name could not be parsed");
            }
            if (!contact) {
              flags.push("Phone number missing");
            }

            // Create row
            const newRow = {
              sn: sn,
              name: name,
              portfolio: '',
              lga: lgaName,
              lgaCode: lgaCode,
              ward: wardName,
              wardCode: wardCode,
              pu: puName,
              puCode: puCode,
              contact: contact,
              contact2: '',
              flags: flags,
              sync: 'pending',
              createdAt: new Date().toISOString()
            };

            const rowId = await dbPut('rows', newRow);

            // Save ONLY the cropped card as that row's image in IndexedDB
            await new Promise((resolve) => {
              cardCanvas.toBlob(async (blob) => {
                if (blob) {
                  await dbPut('images', { rowId, blob });
                }
                resolve();
              }, 'image/jpeg', 0.6);
            });

            totalImportedCards++;
          }
        }

        toast(`Successfully imported ${totalImportedCards} cropped voter cards!`, "success", 4000);
        setCardView('table');
      } catch (err) {
        toast(`Error reading PDF: ${err.message}`, "error");
      }
    }

    function processPvcImageFile(file) {
      return new Promise((resolve, reject) => {
        toast("Processing card photo with OCR...", "info", 4000);

        const reader = new FileReader();
        reader.onerror = (err) => reject(err);
        reader.onload = async (e) => {
          const img = new Image();
          img.onerror = (err) => reject(err);
          img.onload = async () => {
            const maxW = 800;
            let w = img.width;
            let h = img.height;
            if (w > maxW) {
              h = Math.round((h * maxW) / w);
              w = maxW;
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            let ocrText = '';
            if (window.Tesseract) {
              try {
                const res = await Tesseract.recognize(canvas, 'eng');
                ocrText = res.data.text;
              } catch(e) {
                console.warn("Tesseract OCR error:", e);
              }
            }

            const captionMatch = ocrText.match(/(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/);
            const codeMatch = ocrText.match(/CODE[:\s]+(\d{2})-(\d{2})-(\d{2})-(\d{1,3})/i);
            const phoneMatch = ocrText.match(/(0\d{10})/);

            const existingRows = await dbAll('rows');
            const registry = await dbAll('registry');

            let sn = captionMatch ? parseInt(captionMatch[1]) : existingRows.length + 1;
            let name = captionMatch ? captionMatch[2].trim().toUpperCase() : 'PHOTO VOTER';
            let lgaHint = captionMatch ? captionMatch[3].trim().toUpperCase() : '';

            let stateCode = codeMatch ? codeMatch[1] : '';
            let lgaCode = codeMatch ? codeMatch[2] : '';
            let wardCode = codeMatch ? codeMatch[3] : '';
            let puCode = codeMatch ? codeMatch[4].padStart(3, '0') : '';
            let contact = phoneMatch ? phoneMatch[1] : '';

            // Requirement 2: Location Resolution
            let lgaName = "";
            let wardName = "";
            let puName = "";
            let matched = false;

            if (lgaCode) {
              const matchReg = registry.find(r => 
                String(r.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0') &&
                (wardCode ? String(r.wardCode).padStart(2, '0') === String(wardCode).padStart(2, '0') : true)
              );
              if (matchReg) {
                lgaName = matchReg.lgaName || lgaHint || '';
                wardName = matchReg.wardName || '';
                puName = matchReg.puName || '';
                matched = true;
              }
            }

            const flags = [];
            if (!matched) {
              lgaName = "";
              wardName = "";
              puName = "";
              flags.push("code not in registry");
            }

            const newRow = {
              sn: sn,
              name: name,
              portfolio: '',
              lga: lgaName,
              lgaCode: lgaCode,
              ward: wardName,
              wardCode: wardCode,
              pu: puName,
              puCode: puCode,
              contact: contact,
              contact2: '',
              flags: flags,
              sync: 'pending',
              createdAt: new Date().toISOString()
            };

            const rowId = await dbPut('rows', newRow);

            // Save blob to images store
            canvas.toBlob(async (blob) => {
              if (blob) await dbPut('images', { rowId, blob });
              toast("Voter photo added to table!", "success");
              setCardView('table');
              resolve();
            }, 'image/jpeg', 0.6);
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    let replaceTargetRowId = null;

    function triggerReplacePhoto(rowId) {
      replaceTargetRowId = rowId;
      const fileInput = document.getElementById('file-replace-photo');
      if (fileInput) {
        fileInput.value = '';
        fileInput.click();
      }
    }

    document.getElementById('file-replace-photo').addEventListener('change', async function(e) {
      const file = e.target.files[0];
      if (!file || !replaceTargetRowId) return;

      toast("Processing new photo...", "info", 2000);

      const reader = new FileReader();
      reader.onload = async (ev) => {
        const img = new Image();
        img.onload = async () => {
          const maxW = 800;
          let w = img.width;
          let h = img.height;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);

          canvas.toBlob(async (blob) => {
            if (blob) {
              // Overwrite existing Blob in the "images" store for that rowId
              await dbPut('images', { rowId: replaceTargetRowId, blob: blob });

              // Mark row pending if it was synced so the new photo is uploaded on next sync
              const row = await dbGet('rows', replaceTargetRowId);
              if (row && row.sync === 'synced') {
                row.sync = 'pending';
                await dbPut('rows', row);
              }

              toast("Photo replaced successfully!", "success");
              // Refresh the thumbnail and inspector
              R();
            }
          }, 'image/jpeg', 0.6);
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    });

    // ─────────────────────────────────────────────────────────────────
    // PARSERS: LOCATIONS (PDF, XLSX, CSV, DOCX, JPG/PNG)
    // ─────────────────────────────────────────────────────────────────
    async function parseLocationPdf(file) {
      const arrayBuffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
      let fullText = "";
      const unreadablePages = [];

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const textContent = await page.getTextContent();
        const str = textContent.items.map(item => item.str).join(' ');
        if (!str || str.trim().length < 20) {
          // If no text layer, try OCR on page canvas
          if (window.Tesseract) {
            try {
              const viewport = page.getViewport({ scale: 1.5 });
              const pageCanvas = document.createElement('canvas');
              pageCanvas.width = viewport.width;
              pageCanvas.height = viewport.height;
              const pCtx = pageCanvas.getContext('2d');
              await page.render({ canvasContext: pCtx, viewport: viewport }).promise;
              const ocrRes = await Tesseract.recognize(pageCanvas, 'eng');
              const ocrStr = ocrRes?.data?.text || '';
              if (ocrStr.trim().length >= 20) {
                fullText += "\n" + ocrStr;
              } else {
                unreadablePages.push(i);
              }
            } catch (e) {
              unreadablePages.push(i);
            }
          } else {
            unreadablePages.push(i);
          }
        } else {
          fullText += "\n" + str;
        }
      }

      const items = parseLocationText(fullText);
      return { items, unreadablePages };
    }

    function parseLocationText(rawText) {
      const items = [];
      let defaultState = "";
      let defaultStateCode = "";

      const stateMatch = rawText.match(/State[:\s]+([A-Za-z]+)\s*(?:\((\d{1,2})\))?/i);
      if (stateMatch) {
        defaultState = stateMatch[1];
        if (stateMatch[2]) defaultStateCode = stateMatch[2];
      }

      // Split on /LGA[:\s]+([A-Z' ]+?)\s*CODE[:\s]+(\d{1,2})/
      const lgaRegex = /LGA[:\s]+([A-Z' ]+?)\s*CODE[:\s]+(\d{1,2})/gi;
      let match;
      const lgaBlocks = [];
      let lastIndex = 0;
      let lastLga = null;

      while ((match = lgaRegex.exec(rawText)) !== null) {
        if (lastLga) {
          lgaBlocks.push({
            lgaName: lastLga.name.trim().toUpperCase(),
            lgaCode: lastLga.code.trim(),
            content: rawText.substring(lastIndex, match.index)
          });
        }
        lastLga = { name: match[1], code: match[2] };
        lastIndex = lgaRegex.lastIndex;
      }
      if (lastLga) {
        lgaBlocks.push({
          lgaName: lastLga.name.trim().toUpperCase(),
          lgaCode: lastLga.code.trim(),
          content: rawText.substring(lastIndex)
        });
      }

      // Inside each block match ward lines:
      const wardRegex = /^\s*(\d{1,3})\s*([A-Za-z0-9'’\-\/&.\s]+?)\s*(\d{2})\s+(.+)$/gm;

      for (const block of lgaBlocks) {
        let wMatch;
        while ((wMatch = wardRegex.exec(block.content)) !== null) {
          const wardNum = wMatch[1];
          const wardName = wMatch[2].trim().toUpperCase();
          const wardCode = wMatch[3].trim();
          const collationCentre = wMatch[4].trim().toUpperCase();

          items.push({
            stateName: defaultState,
            stateCode: defaultStateCode,
            lgaName: block.lgaName,
            lgaCode: block.lgaCode,
            wardName: wardName,
            wardCode: wardCode,
            puName: collationCentre,
            puCode: wardCode
          });
        }
      }

      return items;
    }

    // Excel Parser (SheetJS)
    async function parseLocationExcel(file) {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: 'array' });
      const sheetName = wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });

      return rows.map(r => ({
        stateName: getNormCol(r, ['state', 'statename']),
        stateCode: getNormCol(r, ['statecode', 'state code']),
        lgaName: getNormCol(r, ['lga', 'lganame', 'local government']).toUpperCase(),
        lgaCode: getNormCol(r, ['lgacode', 'lga code', 'code']),
        wardName: getNormCol(r, ['ward', 'wardname']).toUpperCase(),
        wardCode: getNormCol(r, ['wardcode', 'ward code']),
        puName: getNormCol(r, ['pu', 'puname', 'polling unit', 'pollingunit', 'collation centre']).toUpperCase(),
        puCode: getNormCol(r, ['pucode', 'pu code'])
      })).filter(item => item.lgaName && item.wardName);
    }

    // CSV Parser
    async function parseLocationCsv(file) {
      const text = await file.text();
      const wb = XLSX.read(text, { type: 'string' });
      const sheetName = wb.SheetNames[0];
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: '' });
      return rows.map(r => ({
        stateName: getNormCol(r, ['state', 'statename']),
        stateCode: getNormCol(r, ['statecode', 'state code']),
        lgaName: getNormCol(r, ['lga', 'lganame', 'local government']).toUpperCase(),
        lgaCode: getNormCol(r, ['lgacode', 'lga code', 'code']),
        wardName: getNormCol(r, ['ward', 'wardname']).toUpperCase(),
        wardCode: getNormCol(r, ['wardcode', 'ward code']),
        puName: getNormCol(r, ['pu', 'puname', 'polling unit', 'pollingunit', 'collation centre']).toUpperCase(),
        puCode: getNormCol(r, ['pucode', 'pu code'])
      })).filter(i => i.lgaName && i.wardName);
    }

    // DOCX Parser (JSZip -> word/document.xml)
    async function parseLocationDocx(file) {
      const zip = await JSZip.loadAsync(file);
      const docXml = await zip.file("word/document.xml").async("text");
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(docXml, "application/xml");
      const trs = Array.from(xmlDoc.getElementsByTagName("w:tr"));

      if (trs.length > 1) {
        const headers = Array.from(trs[0].getElementsByTagName("w:tc")).map(tc => {
          return Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim();
        });
        const rows = [];
        for (let i = 1; i < trs.length; i++) {
          const cells = Array.from(trs[i].getElementsByTagName("w:tc")).map(tc => {
            return Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim();
          });
          const rowObj = {};
          headers.forEach((h, hIdx) => {
            rowObj[h] = cells[hIdx] || '';
          });
          rows.push(rowObj);
        }
        return rows.map(r => ({
          stateName: getNormCol(r, ['state', 'statename']),
          stateCode: getNormCol(r, ['statecode', 'state code']),
          lgaName: getNormCol(r, ['lga', 'lganame', 'local government']).toUpperCase(),
          lgaCode: getNormCol(r, ['lgacode', 'lga code', 'code']),
          wardName: getNormCol(r, ['ward', 'wardname']).toUpperCase(),
          wardCode: getNormCol(r, ['wardcode', 'ward code']),
          puName: getNormCol(r, ['pu', 'puname', 'polling unit', 'pollingunit', 'collation centre']).toUpperCase(),
          puCode: getNormCol(r, ['pucode', 'pu code'])
        })).filter(item => item.lgaName && item.wardName);
      } else {
        const textOnly = docXml.replace(/<w:p[^>]*>/g, '\n').replace(/<[^>]+>/g, ' ');
        return parseLocationText(textOnly);
      }
    }

    // Image Parser (Tesseract OCR)
    async function parseLocationImage(file) {
      if (!window.Tesseract) throw new Error("Tesseract.js not loaded.");
      toast("Running OCR on image document...", "info", 6000);
      const res = await Tesseract.recognize(file, 'eng');
      return parseLocationText(res.data.text || '');
    }

            </div>

            <!-- Unreadable pages warning strip -->
            ${S.importPreview.unreadablePages && S.importPreview.unreadablePages.length > 0 ? `
              <div class="warning-strip">
                <div>
                  <b>⚠ Unreadable pages:</b> Pages ${S.importPreview.unreadablePages.join(', ')} had no extractable text.
                </div>
                <div style="display:flex; gap:8px;">
                  <button type="button" class="btn sm" onclick="tryOcrOnUnreadablePages()">Try OCR on these pages</button>
                  <button type="button" class="btn alt sm" onclick="skipUnreadablePages()">Skip them</button>
                </div>
              </div>
            ` : ''}

            <!-- Summary Table -->
            <div style="max-height: 280px; overflow-y: auto; border: 1px solid rgba(109,165,192,0.25); border-radius: 14px; margin: 14px 0;">
              <table style="width: 100%; border-collapse: collapse; font-size: 13.5px;">
                <thead>
                  <tr style="background: rgba(7,46,51,0.9); color: var(--mist); text-align: left;">
                    <th style="padding: 10px;">LGA</th>
                    <th style="padding: 10px;">CODE</th>
                    <th style="padding: 10px;">WARDS</th>
                    <th style="padding: 10px;">STATUS</th>
                  </tr>
                </thead>
                <tbody>
                  ${Array.from(lgaMap.values()).map(l => `
                    <tr style="border-bottom: 1px solid rgba(109,165,192,0.15);">
                      <td style="padding: 9px 10px; font-weight: 600;">${escapeHtml(l.name)}</td>
                      <td style="padding: 9px 10px; font-family: monospace;">${escapeHtml(l.code || '—')}</td>
                      <td style="padding: 9px 10px;">${l.count}</td>
                      <td style="padding: 9px 10px;">
                        <span class="tag green">● New</span>
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-top:16px;">
              <button type="button" class="btn alt sm" onclick="downloadErrorReport()">Download error report</button>
              <div style="display:flex; gap:8px;">
                <button type="button" class="btn alt" onclick="closeModal()">Cancel</button>
                <button type="button" class="btn" onclick="confirmLocationImport()">Confirm import</button>
              </div>
            </div>
          </div>
        `;
        overlayContainer.appendChild(modal);
      }
    }

    function updateExportOptionsUI() {
      const selected = document.querySelector('input[name="expFormat"]:checked')?.value;
      ['pdf', 'excel', 'csv', 'print'].forEach(f => {
        const btn = document.getElementById(`exp-lbl-${f}`);
        if (btn) {
          if (f === selected) {
            btn.style.background = 'var(--teal)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--bright)';
          } else {
            btn.style.background = 'transparent';
            btn.style.color = 'var(--mist)';
            btn.style.borderColor = 'var(--mist)';
          }
        }
      });
      const pdfOpts = document.getElementById('pdf-extra-options');
      if (pdfOpts) pdfOpts.style.display = (selected === 'pdf') ? 'flex' : 'none';
      const dlBtn = document.getElementById('btn-do-download');
      if (dlBtn) dlBtn.innerText = (selected === 'print') ? 'Print' : 'Download';
    }

    async function saveSettingsForm(e) {
      e.preventDefault();
      const syncUrl = document.getElementById('st-syncUrl').value.trim();
      const sheetId = document.getElementById('st-sheetId').value.trim();
      const folderId = document.getElementById('st-folderId').value.trim();

      await dbPut('settings', { key: 'syncUrl', value: syncUrl });
      await dbPut('settings', { key: 'sheetId', value: sheetId });
      await dbPut('settings', { key: 'folderId', value: folderId });

      toast("Sync settings saved!", "success");
      closeModal();
      R();
    }

    function handlePasteLocationSubmit() {
      const text = document.getElementById('paste-loc-textarea').value;
      if (!text.trim()) {
        toast("Please paste text first.", "warning");
        return;
      }
      const items = parseLocationText(text);
      if (items.length === 0) {
        toast("Could not extract any LGA/Ward blocks. Check text formatting.", "error");
        return;
      }
      S.importPreview = {
        fileName: "Pasted text",
        items: items,
        unreadablePages: []
      };
      openModal('loc-preview');
    }

    async function handleManualLocationSubmit(e) {
      e.preventDefault();
      const item = {
        stateName: document.getElementById('mloc-state').value.trim(),
        stateCode: document.getElementById('mloc-stateCode').value.trim(),
        lgaName: document.getElementById('mloc-lga').value.trim().toUpperCase(),
        lgaCode: document.getElementById('mloc-lgaCode').value.trim(),
        wardName: document.getElementById('mloc-ward').value.trim().toUpperCase(),
        wardCode: document.getElementById('mloc-wardCode').value.trim(),
        puName: document.getElementById('mloc-pu').value.trim().toUpperCase() || 'Collation Centre PU',
        puCode: document.getElementById('mloc-puCode').value.trim() || document.getElementById('mloc-wardCode').value.trim()
      };
      await dbPut('registry', item);
      toast("Location saved to registry!", "success");
      closeModal();
      R();
    }

    async function confirmLocationImport() {
      if (!S.importPreview || !S.importPreview.items) return;
      toast(`Importing ${S.importPreview.items.length} locations...`, "info");
      for (const item of S.importPreview.items) {
        await dbPut('registry', item);
      }
      toast(`Registry updated with ${S.importPreview.items.length} records!`, "success");
      S.importPreview = null;
      closeModal();
      R();
    }

    async function tryOcrOnUnreadablePages() {
      if (!S.importPreview || !S.importPreview.fileRef || !window.pdfjsLib || !window.Tesseract) {
        toast("OCR libraries not available.", "error");
        return;
      }
      toast("Rendering pages for OCR. This may take a few moments...", "info", 5000);
      try {
        const arrayBuffer = await S.importPreview.fileRef.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let ocrFullText = "";

        for (const pageNum of S.importPreview.unreadablePages) {
          const page = await pdf.getPage(pageNum);
          const viewport = page.getViewport({ scale: 1.5 });
          const canvas = document.createElement('canvas');
          canvas.width = viewport.width;
          canvas.height = viewport.height;
          const ctx = canvas.getContext('2d');
          await page.render({ canvasContext: ctx, viewport: viewport }).promise;

          const res = await Tesseract.recognize(canvas, 'eng');
          ocrFullText += "\n" + res.data.text;
        }

        const ocrItems = parseLocationText(ocrFullText);
        if (ocrItems.length > 0) {
          S.importPreview.items.push(...ocrItems);
          S.importPreview.unreadablePages = [];
          toast(`OCR recovered ${ocrItems.length} locations!`, "success");
        } else {
          toast("OCR completed but could not detect structured LGA/Ward blocks.", "warning");
        }
        renderModals();
      } catch (err) {
        toast(`OCR failed: ${err.message}`, "error");
      }
    }

    function skipUnreadablePages() {
      if (S.importPreview) {
        S.importPreview.unreadablePages = [];
        renderModals();
      }
    }

    function downloadErrorReport() {
      const report = `MOBILIZE LOCATION IMPORT REPORT\nFile: ${S.importPreview?.fileName}\nDate: ${new Date().toLocaleString()}\nExtracted Items: ${S.importPreview?.items?.length || 0}\nUnreadable Pages: ${S.importPreview?.unreadablePages?.join(', ') || 'None'}\n`;
      const blob = new Blob([report], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `error_report_${Date.now()}.txt`;
      a.click();
    }

    // ─────────────────────────────────────────────────────────────────
    // EXPORT ENGINE (PDF, EXCEL, CSV, PRINT)
    // ─────────────────────────────────────────────────────────────────
    async function executeExport(e) {
      e.preventDefault();
      const format = document.querySelector('input[name="expFormat"]:checked')?.value || 'pdf';
      const scope = document.querySelector('input[name="expRecords"]:checked')?.value || 'all';
      const includeImages = document.getElementById('exp-include-images')?.checked;

      let rows = await dbAll('rows');
      if (scope === 'filtered') {
        if (S.tableFilter === 'flagged') rows = rows.filter(r => r.flags && r.flags.length > 0);
        else if (S.tableFilter === 'pending') rows = rows.filter(r => r.sync === 'pending' || !r.sync);
        else if (S.tableFilter === 'synced') rows = rows.filter(r => r.sync === 'synced');
        else if (S.tableFilter === 'error') rows = rows.filter(r => r.sync === 'error');

        if (S.tableSearch.trim()) {
          const q = S.tableSearch.toLowerCase().trim();
          rows = rows.filter(r => 
            (r.name && r.name.toLowerCase().includes(q)) ||
            (r.contact && r.contact.includes(q)) ||
            (r.lga && r.lga.toLowerCase().includes(q))
          );
        }
      }

      closeModal();

      if (format === 'print') {
        window.print();
        return;
      }

      if (format === 'csv') {
        exportCSV(rows);
      } else if (format === 'excel') {
        exportExcel(rows);
      } else if (format === 'pdf') {
        await exportPDF(rows, includeImages);
      }
    }

    // 11 Exact SA Columns:
    // S/N · NAME · PORTFOLIO/MDA · L.G.A · Code · WARD · Code · POLLING UNIT · Code · CONTACT NO · 2nd CONTACT
    function exportCSV(rows) {
      const headers = ["S/N", "NAME", "PORTFOLIO/MDA", "L.G.A", "Code", "WARD", "Code", "POLLING UNIT", "Code", "CONTACT NO", "2nd CONTACT"];
      const lines = [headers.map(h => `"${h}"`).join(",")];

      rows.forEach((r, idx) => {
        const rowData = [
          r.sn || (idx + 1),
          r.name || '',
          r.portfolio || '',
          r.lga || '',
          r.lgaCode || '',
          r.ward || '',
          r.wardCode || '',
          r.pu || '',
          r.puCode || '',
          r.contact ? `\t${r.contact}` : '', // Tab prefix ensures phone leading zero preserved in CSV
          r.contact2 ? `\t${r.contact2}` : ''
        ];
        lines.push(rowData.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
      });

      // UTF-8 BOM
      const csvContent = "\uFEFF" + lines.join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mobilized_voters_${Date.now()}.csv`;
      a.click();
    }

    function exportExcel(rows) {
      if (!window.XLSX) {
        toast("SheetJS library not loaded.", "error");
        return;
      }
      const headers = ["S/N", "NAME", "PORTFOLIO/MDA", "L.G.A", "Code", "WARD", "Code", "POLLING UNIT", "Code", "CONTACT NO", "2nd CONTACT"];
      const data = [headers];

      rows.forEach((r, idx) => {
        data.push([
          String(r.sn || (idx + 1)),
          r.name || '',
          r.portfolio || '',
          r.lga || '',
          String(r.lgaCode || ''),
          r.ward || '',
          String(r.wardCode || ''),
          r.pu || '',
          String(r.puCode || ''),
          String(r.contact || ''),
          String(r.contact2 || '')
        ]);
      });

      const ws = XLSX.utils.aoa_to_sheet(data);

      // Force type "s" (string) on all codes and contact cells to protect leading zeros
      for (let R = 1; R < data.length; ++R) {
        [4, 6, 8, 9, 10].forEach(C => {
          const cellRef = XLSX.utils.encode_cell({ c: C, r: R });
          if (ws[cellRef]) {
            ws[cellRef].t = 's';
          }
        });
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Mobilized Voters");
      XLSX.writeFile(wb, `mobilized_voters_${Date.now()}.xlsx`);
    }

    async function exportPDF(rows, includeImages) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        toast("jsPDF library not loaded.", "error");
        return;
      }
      toast("Generating PDF...", "info", 3000);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'pt', 'a4');

      const title = `MOBILIZED VOTERS — ${S.tableFilter.toUpperCase()} — ${new Date().toLocaleDateString()}`;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.setTextColor(12, 112, 117);
      doc.text(title, 40, 36);

      const headers = [
        ["S/N", "NAME", "PORTFOLIO", "L.G.A", "Code", "WARD", "Code", "POLLING UNIT", "Code", "CONTACT NO", "2nd CONTACT"]
      ];

      const body = rows.map((r, idx) => [
        r.sn || (idx + 1),
        r.name || '',
        r.portfolio || '',
        r.lga || '',
        r.lgaCode || '',
        r.ward || '',
        r.wardCode || '',
        r.pu || '',
        r.puCode || '',
        r.contact || '',
        r.contact2 || ''
      ]);

      doc.autoTable({
        head: headers,
        body: body,
        startY: 50,
        theme: 'grid',
        styles: { fontSize: 8.5, cellPadding: 4, font: 'helvetica' },
        headStyles: { fillColor: [12, 112, 117], textColor: [255, 255, 255], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [240, 248, 250] },
        margin: { left: 40, right: 40 }
      });

      doc.save(`mobilized_voters_${Date.now()}.pdf`);
      toast("PDF downloaded!", "success");
    }

    // Helper to download the current single HTML file directly
    function downloadMobilizeHtml() {
      const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
      const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = "Mobilize.html";
      a.click();
      toast("Saved Mobilize.html! Ready to host on cPanel public_html.", "success");
    }

    // Utility HTML Escaper
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize application on window load
    window.addEventListener('DOMContentLoaded', async () => {
      await initSettingsAndRegistry();
      await R();
    });
  </script>
