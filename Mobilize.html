    // ─────────────────────────────────────────────────────────────────
    // LOCATION CODE / LABEL HELPERS (SHARED BY FORM, REVIEW & LOCATIONS)
    // ─────────────────────────────────────────────────────────────────
    function normLocCode(val, len = 2) {
      const s = String(val ?? '').trim();
      if (!s) return '';
      return /^\d+$/.test(s) ? s.padStart(len, '0') : s;
    }

    function formatLocLabel(name, code) {
      const n = String(name || '').trim();
      const c = String(code || '').trim();
      if (n && c) return `${n} (${c})`;
      if (n) return n;
      if (c) return `(${c})`;
      return '';
    }

    function getRegistryStates(reg) {
      const map = new Map();
      (reg || []).forEach(r => {
        const name = String(r.stateName || 'BORNO').trim().toUpperCase();
        const code = normLocCode(r.stateCode || (name === 'BORNO' ? '08' : ''), 2);
        const key = name || code;
        if (!key) return;
        if (!map.has(key)) map.set(key, { code: code || '', name: name || code });
      });
      return Array.from(map.values()).sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
    }

    function getRegistryLgas(reg, stateVal) {
      const sTarget = normLocCode(stateVal, 2);
      const sRaw = String(stateVal || '').trim().toUpperCase();
      const map = new Map();
      (reg || []).forEach(r => {
        const rStateName = String(r.stateName || 'BORNO').trim().toUpperCase();
        const rStateCode = normLocCode(r.stateCode || (rStateName === 'BORNO' ? '08' : ''), 2);
        if (sRaw && rStateName !== sRaw && (!sTarget || rStateCode !== sTarget)) return;
        const name = String(r.lgaName || '').trim();
        const code = normLocCode(r.lgaCode, 2);
        const val = code || name.toUpperCase();
        if (!val) return;
        if (!map.has(val)) map.set(val, { code: val, name: name || val });
      });
      return Array.from(map.values()).sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    }

    function getRegistryWards(reg, stateVal, lgaCode) {
      const sTarget = normLocCode(stateVal, 2);
      const sRaw = String(stateVal || '').trim().toUpperCase();
      const lTarget = normLocCode(lgaCode, 2);
      const lRaw = String(lgaCode || '').trim().toUpperCase();
      if (!lRaw) return [];
      const map = new Map();
      (reg || []).forEach(r => {
        const rStateName = String(r.stateName || 'BORNO').trim().toUpperCase();
        const rStateCode = normLocCode(r.stateCode || (rStateName === 'BORNO' ? '08' : ''), 2);
        if (sRaw && rStateName !== sRaw && (!sTarget || rStateCode !== sTarget)) return;
        const rLgaName = String(r.lgaName || '').trim().toUpperCase();
        const rLgaCode = normLocCode(r.lgaCode, 2);
        if (rLgaCode !== lTarget && rLgaName !== lRaw) return;
        const name = String(r.wardName || '').trim();
        const code = normLocCode(r.wardCode, 2);
        const val = code || name.toUpperCase();
        if (!val) return;
        if (!map.has(val)) map.set(val, { code: val, name: name || val });
      });
      return Array.from(map.values()).sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    }

    function getRegistryPus(reg, stateVal, lgaCode, wardCode) {
      const sTarget = normLocCode(stateVal, 2);
      const sRaw = String(stateVal || '').trim().toUpperCase();
      const lTarget = normLocCode(lgaCode, 2);
      const lRaw = String(lgaCode || '').trim().toUpperCase();
      const wTarget = normLocCode(wardCode, 2);
      const wRaw = String(wardCode || '').trim().toUpperCase();
      if (!lRaw || !wRaw) return [];
      const map = new Map();
      (reg || []).forEach((r, idx) => {
        const rStateName = String(r.stateName || 'BORNO').trim().toUpperCase();
        const rStateCode = normLocCode(r.stateCode || (rStateName === 'BORNO' ? '08' : ''), 2);
        if (sRaw && rStateName !== sRaw && (!sTarget || rStateCode !== sTarget)) return;

        const rLgaCode = normLocCode(r.lgaCode, 2);
        const rLgaName = String(r.lgaName || '').trim().toUpperCase();
        if (rLgaCode !== lTarget && (rLgaCode || rLgaName !== lRaw)) return;

        // Match strictly by wardCode (never collapse different wards with duplicate names)
        const rWardCode = normLocCode(r.wardCode, 2);
        const rWardName = String(r.wardName || '').trim().toUpperCase();
        if (rWardCode !== wTarget && (rWardCode || rWardName !== wRaw)) return;

        const name = String(r.puName || '').trim();
        const code = normLocCode(r.puCode, 3);
        if (!name && !code) return;
        const dedupeKey = code || `NAME:${name.toUpperCase() || idx}`;
        if (!map.has(dedupeKey)) {
          map.set(dedupeKey, { code: code || name, name: name || code });
        }
      });
      return Array.from(map.values()).sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
    }

    function setCardFilter(level, val) {
      if (!S.filter) S.filter = { state: '', lga: '', ward: '', pu: '' };
      if (level === 'state') {
        S.filter.state = val;
        S.filter.lga = '';
        S.filter.ward = '';
        S.filter.pu = '';
      } else if (level === 'lga') {
        S.filter.lga = val;
        S.filter.ward = '';
        S.filter.pu = '';
      } else if (level === 'ward') {
        S.filter.ward = val;
        S.filter.pu = '';
      } else if (level === 'pu') {
        S.filter.pu = val;
      }
      R(true);
    }

    function clearCardFilters() {
      S.filter = { state: '', lga: '', ward: '', pu: '' };
      S.tableSearch = '';
      if (S.tableFilter === 'lga') {
        S.tableFilter = 'all';
        S.filterLga = '';
        S.filterLgaName = '';
      }
      R(true);
    }

    async function drillIntoLga(lgaName) {
      const target = String(lgaName || '').toUpperCase().trim();
      const registry = await dbAll('registry');
      const match = registry.find(r =>
        (r.lgaName && String(r.lgaName).toUpperCase().trim() === target) ||
        (r.lgaCode && normLocCode(r.lgaCode, 2) === normLocCode(target, 2))
      );

      if (!match) {
        toast("Could not find LGA code for: " + lgaName, "warning");
        return;
      }

      S.selectedRows.clear();
      S.tab = 'cards';
      S.cardView = 'table';
      S.lastCardTab = 'table';
      S.tableFilter = 'lga';
      S.filterLga = normLocCode(match.lgaCode, 2);
      S.filterLgaName = match.lgaName ? String(match.lgaName).toUpperCase().trim() : lgaName;

      // Clear other filters
      S.tableSearch = '';
      S.filterState = '';
      S.filterWard = '';
      S.filterPu = '';
      S.filter = { state: '', lga: '', ward: '', pu: '' };

      updateNavHighlight();
      await R(true);
      toast(`Showing records for ${S.filterLgaName}`, "info", 3000);
    }

    async function drillIntoUnassigned() {
      S.selectedRows.clear();
      S.tab = 'cards';
      S.cardView = 'review';
      S.lastCardTab = 'review';
      S.tableFilter = 'flagged';
      S.filterLga = '';
      S.filterLgaName = '';
      S.tableSearch = '';
      S.filter = { state: '', lga: '', ward: '', pu: '' };

      updateNavHighlight();
      await R(true);
      toast("Showing unassigned and needs-review records", "info", 3000);
    }

    function clearLgaFilter() {
      S.tableFilter = 'all';
      S.filterLga = '';
      S.filterLgaName = '';
      R(true);
    }

    function applyCardLocationFilter(rows) {
      const f = S.filter || { state: '', lga: '', ward: '', pu: '' };
      return rows.filter(r => {
        const rState = normLocCode(r.stateCode, 2);
        const rLga = normLocCode(r.lgaCode, 2);
        const rWard = normLocCode(r.wardCode, 2);
        const rPu = normLocCode(r.puCode, 3);
        return (!f.state || rState === normLocCode(f.state, 2) || r.stateCode === f.state) &&
               (!f.lga   || rLga   === normLocCode(f.lga, 2)   || r.lgaCode   === f.lga) &&
               (!f.ward  || rWard  === normLocCode(f.ward, 2)  || r.wardCode  === f.ward) &&
               (!f.pu    || rPu    === normLocCode(f.pu, 3)    || r.puCode    === f.pu);
      });
    }

    function renderCardLocationFilterBar(reg, mode = 'table', extraOpts = {}) {
      const f = S.filter || { state: '', lga: '', ward: '', pu: '' };
      const statesList = getRegistryStates(reg);
      const lgasList = getRegistryLgas(reg, f.state);
      const wardsList = f.lga ? getRegistryWards(reg, f.state, f.lga) : [];
      const pusList = (f.lga && f.ward) ? getRegistryPus(reg, f.state, f.lga, f.ward) : [];
      const hasActive = Boolean(f.state || f.lga || f.ward || f.pu || (S.tableSearch || '').trim());

      const syncText = (S.syncRunning && S.syncProgress)
        ? (S.syncProgress.batches > 1
            ? `Batch ${S.syncProgress.batch}/${S.syncProgress.batches} (${S.syncProgress.current}/${S.syncProgress.total})…`
            : `Syncing ${S.syncProgress.current}/${S.syncProgress.total}...`)
        : '⟳ Sync';

      const stopBtnHtml = S.syncRunning
        ? `<button type="button" class="btn red sm compact-filter-btn" onclick="cancelActiveSync()" title="Stop after current batch completes cleanly">
             ${S.syncCancelRequested ? 'Stopping…' : '■ Stop'}
           </button>`
        : '';

      const actionButtonsHtml = mode === 'review'
        ? `
          <button type="button" class="btn sm btn-sync-retry compact-filter-btn" onclick="startSyncPending('error-only')" ${S.syncRunning ? 'disabled' : ''}>
            ${syncText}
          </button>
          ${stopBtnHtml}
          <button type="button" class="btn alt sm compact-filter-btn" id="btn-rescan-all-flagged" onclick="rescanAllFlaggedRows()" ${extraOpts.rowCount === 0 ? 'disabled' : ''}>
            🔄 Rescan flagged
          </button>
        `
        : `
          <button type="button" class="btn sm btn-sync-pending compact-filter-btn" id="btn-sync-pending" onclick="startSyncPending('clean')" ${S.syncRunning ? 'disabled' : ''}>
            ${syncText}
          </button>
          ${stopBtnHtml}
          <button type="button" class="btn alt sm compact-filter-btn" onclick="openExportExcelCsv()" title="Export Excel or CSV">
            Export
          </button>
        `;

      return `
        <div class="compact-filter-row">
          <select class="compact-filter-select" onchange="setCardFilter('state', this.value)" title="Filter by State">
            <option value="">All States</option>
            ${statesList.map(s => `<option value="${escapeHtml(s.code)}" ${f.state === s.code ? 'selected' : ''}>${escapeHtml(formatLocLabel(s.name, s.code))}</option>`).join('')}
          </select>
          <select class="compact-filter-select" onchange="setCardFilter('lga', this.value)" title="Filter by LGA">
            <option value="">All LGAs</option>
            ${lgasList.map(l => `<option value="${escapeHtml(l.code)}" ${f.lga === l.code ? 'selected' : ''}>${escapeHtml(formatLocLabel(l.name, l.code))}</option>`).join('')}
          </select>
          <select class="compact-filter-select" onchange="setCardFilter('ward', this.value)" title="Filter by Ward">
            <option value="">All Wards</option>
            ${wardsList.map(w => `<option value="${escapeHtml(w.code)}" ${f.ward === w.code ? 'selected' : ''}>${escapeHtml(formatLocLabel(w.name, w.code))}</option>`).join('')}
          </select>
          <select class="compact-filter-select" onchange="setCardFilter('pu', this.value)" title="Filter by PU">
            <option value="">All PUs</option>
            ${pusList.map(p => `<option value="${escapeHtml(p.code)}" ${f.pu === p.code ? 'selected' : ''}>${escapeHtml(formatLocLabel(p.name, p.code))}</option>`).join('')}
          </select>
          <input type="text" id="card-filter-search" class="compact-filter-search" placeholder="Search…" value="${escapeHtml(S.tableSearch || '')}" oninput="setTableSearch(this.value)">
          <button type="button" class="btn alt sm compact-filter-btn" onclick="clearCardFilters()" ${hasActive ? '' : 'style="opacity:0.75;"'}>
            Clear
          </button>
          ${actionButtonsHtml}
        </div>
      `;
    }

    // ─────────────────────────────────────────────────────────────────
    // SCREEN 2: LOCATIONS
    // ─────────────────────────────────────────────────────────────────
    async function vLocations() {
      const viewMode = await getEffectiveViewMode();
      const isMobile = viewMode === 'mobile';
      applyViewModeClass(viewMode);
      const reg = await dbAll('registry');

      const stateOptMap = new Map();
      reg.forEach(r => {
        const name = String(r.stateName || '').trim() || 'BORNO';
        const code = normLocCode(r.stateCode || (name.toUpperCase() === 'BORNO' ? '08' : ''), 2);
        const key = name.toUpperCase();
        if (!stateOptMap.has(key)) stateOptMap.set(key, { name, code });
      });
      const statesList = Array.from(stateOptMap.values());

      const stateName = reg.length > 0 ? (reg[0].stateName || 'BORNO') : '';
      const stateCode = reg.length > 0 ? (reg[0].stateCode || '') : '';

      // Cascading filter lists for Locations view (with codes in brackets)
      const lgaOptMap = new Map();
      if (reg.length > 0) {
        reg.filter(r => !S.locFilterState || ((r.stateName || 'BORNO').trim().toUpperCase() === S.locFilterState.trim().toUpperCase()))
           .forEach(r => {
             const name = String(r.lgaName || '').trim();
             if (!name) return;
             const code = normLocCode(r.lgaCode, 2);
             const key = name.toUpperCase();
             if (!lgaOptMap.has(key)) lgaOptMap.set(key, { name, code });
           });
      }
      const filterLgas = Array.from(lgaOptMap.values());

      const wardOptMap = new Map();
      if (reg.length > 0 && S.locFilterLga) {
        reg.filter(r => (r.lgaName || '').trim().toUpperCase() === S.locFilterLga.trim().toUpperCase())
           .forEach(r => {
             const name = String(r.wardName || '').trim();
             if (!name) return;
             const code = normLocCode(r.wardCode, 2);
             const key = name.toUpperCase();
             if (!wardOptMap.has(key)) wardOptMap.set(key, { name, code });
           });
      }
      const filterWards = Array.from(wardOptMap.values());

      const puOptMap = new Map();
      if (reg.length > 0 && S.locFilterWard) {
        reg.filter(r => (!S.locFilterLga || (r.lgaName || '').trim().toUpperCase() === S.locFilterLga.trim().toUpperCase()) &&
                        (r.wardName || '').trim().toUpperCase() === S.locFilterWard.trim().toUpperCase())
           .forEach(r => {
             const name = String(r.puName || '').trim();
             if (!name) return;
             const code = normLocCode(r.puCode, 3);
             const key = name.toUpperCase();
             if (!puOptMap.has(key)) puOptMap.set(key, { name, code });
           });
      }
      const filterPus = Array.from(puOptMap.values());

      // Apply cascading filter to tree view if selected
      const filteredReg = reg.filter(item => {
        if (S.locFilterState && ((item.stateName || 'BORNO').trim().toUpperCase() !== S.locFilterState.trim().toUpperCase())) return false;
        if (S.locFilterLga && ((item.lgaName || '').trim().toUpperCase() !== S.locFilterLga.trim().toUpperCase())) return false;
        if (S.locFilterWard && ((item.wardName || '').trim().toUpperCase() !== S.locFilterWard.trim().toUpperCase())) return false;
        return true;
      });

      const allValidRegIds = new Set(reg.map(r => Number(r.id)));
      Array.from(S.locSelection).forEach(id => {
        if (!allValidRegIds.has(Number(id))) S.locSelection.delete(Number(id));
      });
      S.visibleLocIds = filteredReg.map(item => Number(item.id));

      const lgaMap = new Map();
      filteredReg.forEach(item => {
        const lgaKey = `${item.lgaName || 'UNKNOWN'}|${item.lgaCode || ''}`;
        if (!lgaMap.has(lgaKey)) {
          lgaMap.set(lgaKey, { name: item.lgaName || 'UNKNOWN', code: item.lgaCode || '', ids: [], wards: new Map() });
        }
        const lgaObj = lgaMap.get(lgaKey);
        lgaObj.ids.push(Number(item.id));
        const wardKey = `${item.wardName || 'UNKNOWN'}|${item.wardCode || ''}`;
        if (!lgaObj.wards.has(wardKey)) {
          lgaObj.wards.set(wardKey, { id: item.id, ids: [], name: item.wardName, code: item.wardCode, pus: [] });
        }
        const wardObj = lgaObj.wards.get(wardKey);
        wardObj.ids.push(Number(item.id));
        wardObj.pus.push({
          id: Number(item.id),
          name: item.puName || '',
          code: item.puCode || '',
          fullCode: item.fullCode || buildFullCode(item)
        });
      });

      const totalLgas = new Set(reg.map(r => r.lgaCode || r.lgaName).filter(Boolean)).size;
      const totalWards = new Set(reg.filter(r => r.lgaCode || r.wardCode || r.wardName).map(r => (r.lgaCode || r.lgaName || '') + '|' + (r.wardCode || r.wardName || ''))).size;
      const totalPus = reg.length;

      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.gap = '20px';

      const isPreloaded = HARDCODED_REGISTRY.length > 0;
      const registryHeader = reg.length > 0
        ? (isPreloaded
            ? `Registry: ${stateName || 'BORNO'} (${stateCode || '08'}) · ${totalLgas} LGAs · ${totalWards} Wards · ${totalPus.toLocaleString()} PUs · Pre-loaded`
            : `${stateName ? `${stateName} ` : ''}${stateCode ? `(${stateCode}) ` : ''}· ${totalLgas} LGAs · ${totalWards} wards · ${totalPus.toLocaleString()} polling units`)
        : 'Registry is empty — upload a document to begin.';

      const registryBanner = isPreloaded
        ? `<div style="margin-bottom:14px; padding:10px 14px; border-radius:10px; background:rgba(15,150,156,0.14); border:1px solid rgba(15,150,156,0.35); color:#a7f3d0; font-size:13px;">
             ℹ️ Locations are pre-loaded with Borno State data (27 LGAs, 312 Wards, 5,071 Polling Units). You do not need to upload anything.
           </div>`
        : (reg.length === 0
            ? `<div style="margin-bottom:14px; padding:10px 14px; border-radius:10px; background:rgba(245,158,11,0.14); border:1px solid rgba(245,158,11,0.45); color:#fde68a; font-size:13px; font-weight:600;">
                 ⚠️ No built-in locations found. Please upload the BORNO Excel file manually.
               </div>`
            : '');

      wrap.innerHTML = `
        <div class="card">
          ${registryBanner}
          <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:14px;">
            <div>
              <h2 style="font-size: 24px; margin-bottom: 4px;">Registry</h2>
              <p style="color: var(--mist); font-size: 15px; font-weight: 500;">${escapeHtml(registryHeader)}</p>
            </div>
            <div style="display:flex; gap:8px; flex-wrap:wrap;">
              <button type="button" class="btn sm" onclick="document.getElementById('file-locations-upload').click()">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Upload file (PDF / CSV / XLSX / DOCX)
              </button>
              <button type="button" class="btn alt sm" onclick="openModal('loc-paste')">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
                Paste text
              </button>
              <button type="button" class="btn alt sm" onclick="openModal('loc-manual')">
                + Add Location Manually
              </button>
              ${reg.length > 0 ? `
                <button type="button" class="btn alt sm" onclick="clearRegistryData()" title="Clear all loaded locations from local registry">
                  Clear
                </button>
              ` : ''}
            </div>
          </div>

          <p style="font-size: 12px; color: var(--mu); margin-top: 10px;">
            Accepted: .pdf · .csv · .xlsx · .docx (Old .doc → save as .docx or PDF first)
          </p>

          <!-- Cascading Filter Dropdowns -->
          <div style="display:grid; grid-template-columns: ${isMobile ? '1fr' : 'repeat(auto-fit, minmax(150px, 1fr))'}; gap:10px; margin-top:14px;">
            <select onchange="setLocFilter('state', this.value)" title="Filter by State">
              <option value="">All States</option>
              ${statesList.map(s => `<option value="${escapeHtml(s.name)}" ${S.locFilterState === s.name ? 'selected' : ''}>${escapeHtml(formatLocLabel(s.name, s.code))}</option>`).join('')}
            </select>
            <select onchange="setLocFilter('lga', this.value)" title="Filter by LGA">
              <option value="">All LGAs</option>
              ${filterLgas.map(l => `<option value="${escapeHtml(l.name)}" ${S.locFilterLga === l.name ? 'selected' : ''}>${escapeHtml(formatLocLabel(l.name, l.code))}</option>`).join('')}
            </select>
            <select onchange="setLocFilter('ward', this.value)" title="Filter by Ward">
              <option value="">All Wards</option>
              ${filterWards.map(w => `<option value="${escapeHtml(w.name)}" ${S.locFilterWard === w.name ? 'selected' : ''}>${escapeHtml(formatLocLabel(w.name, w.code))}</option>`).join('')}
            </select>
            <select title="Polling Units in selected Ward">
              <option value="">Polling Units (${filterPus.length})</option>
              ${filterPus.map(p => `<option value="${escapeHtml(p.name)}">${escapeHtml(formatLocLabel(p.name, p.code))}</option>`).join('')}
            </select>
          </div>
        </div>

        <!-- Collapsible Tree View -->
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 14px; flex-wrap:wrap; gap:8px;">
            <h3 style="font-size: 18px;">Locations Tree</h3>
            <span style="font-size: 12px; color: var(--mu);">Click any Ward to expand its Polling Units · Names &amp; codes are directly editable</span>
          </div>

          ${filteredReg.length > 0 ? `
            <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 12px; margin-bottom:12px; background:rgba(5,22,26,0.55); border:1px solid rgba(109,165,192,0.22); border-radius:10px; flex-wrap:wrap;">
              <label style="display:inline-flex; align-items:center; gap:8px; cursor:pointer; font-size:13px; font-weight:600; color:#fff;">
                <input type="checkbox" class="row-checkbox" id="loc-select-all" onchange="toggleAllLocations(this.checked)">
                Select all in this view (${filteredReg.length})
              </label>
              <button type="button" class="btn alt sm" id="loc-clear-selection-btn" onclick="clearLocSelection()" style="display:${S.locSelection.size > 0 ? 'inline-flex' : 'none'};">
                Clear (${S.locSelection.size})
              </button>
            </div>
          ` : ''}

          <div id="loc-tree-container">
            ${lgaMap.size === 0 ? 
              `<p style="color:var(--mu); font-style:italic; padding:16px;">Registry is empty — upload a document to begin.</p>` :
              Array.from(lgaMap.values()).map((lga, idx) => `
                <details class="lga-node" ${idx === 0 || S.locFilterLga ? 'open' : ''}>
                  <summary class="lga-summary">
                    <span style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                      <input type="checkbox" class="row-checkbox loc-lga-cb" data-loc-ids="${escapeHtml(JSON.stringify(lga.ids))}" onclick="event.stopPropagation()" onchange="toggleLocSelection(${escapeHtml(JSON.stringify(lga.ids))}, this.checked)" title="Select all wards and polling units in ${escapeHtml(lga.name)}">
                      <span style="color:var(--bright); font-size:13px;">▸</span>
                      <span style="font-weight:700;">${escapeHtml(formatLocLabel(lga.name, normLocCode(lga.code, 2) || lga.code))}</span>
                      <span style="font-size:12px; color:var(--mist);">— ${lga.wards.size} ward${lga.wards.size === 1 ? '' : 's'}</span>
                    </span>
                    <span style="display:flex; align-items:center; gap:10px;">
                      <button type="button" class="del-icon-btn" onclick="deleteRegistryGroup('${escapeHtml(JSON.stringify(lga.ids))}', 'LGA ${escapeHtml(lga.name)}', event)">Delete</button>
                    </span>
                  </summary>
                  <div class="ward-tree-body">
                    ${Array.from(lga.wards.values()).map((w) => `
                      <details class="ward-node" ${S.locFilterWard && (w.name || '').toUpperCase() === S.locFilterWard.toUpperCase() ? 'open' : ''}>
                        <summary class="ward-row">
                          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                            <input type="checkbox" class="row-checkbox loc-ward-cb" data-loc-ids="${escapeHtml(JSON.stringify(w.ids))}" onclick="event.stopPropagation()" onchange="toggleLocSelection(${escapeHtml(JSON.stringify(w.ids))}, this.checked)" title="Select all polling units in ward ${escapeHtml(w.name || w.code)}">
                            <span style="color:var(--bright); font-size:12px;">▸</span>
                            <span style="font-family:monospace; color:var(--mu); font-size:12px;">Ward:</span>

                                  onblur="saveWardEdit(${w.id}, 'wardName', this.innerText)"
                                  title="Click to edit ward name">${escapeHtml(w.name || '')}</span>
                            <span style="font-family:monospace; font-size:12.5px; color:var(--amber); font-weight:600;">(<span contenteditable="true"
                                  onclick="event.stopPropagation()"
                                  onblur="saveWardEdit(${w.id}, 'wardCode', this.innerText)"
                                  title="Click to edit ward code">${escapeHtml(w.code || '—')}</span>)</span>
                          </div>
                          <div style="display:flex; align-items:center; gap:8px;">
                            <span style="font-size:12px; color:var(--mist);">— ${w.pus.length} Polling Unit${w.pus.length === 1 ? '' : 's'}</span>
                            <button type="button" class="del-icon-btn" onclick="deleteRegistryGroup('${escapeHtml(JSON.stringify(w.ids))}', 'Ward ${escapeHtml(w.name || w.code)}', event)">Delete</button>
                          </div>
                        </summary>
                        <div class="pu-list">
                          ${w.pus.map(pu => `
                            <div class="pu-row">
                              <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap; flex:1;">
                                <input type="checkbox" class="row-checkbox loc-pu-cb" data-loc-id="${pu.id}" ${S.locSelection.has(pu.id) ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleLocSelection(${pu.id}, this.checked)" title="Select polling unit ${escapeHtml(pu.name || pu.code)}">
                                <span style="font-family:monospace; color:var(--mu); font-size:11.5px;">PU:</span>
                                <span contenteditable="true" class="editable-cell ${!pu.name ? 'is-blank' : ''}"
                                      onblur="savePuEdit(${pu.id}, 'puName', this.innerText)"
                                      title="Click to edit Polling Unit name">${escapeHtml(pu.name || '')}</span>
                                <span style="font-family:monospace; font-size:12px; color:var(--bright); font-weight:600;">(<span contenteditable="true"
                                      onblur="savePuEdit(${pu.id}, 'puCode', this.innerText)"
                                      title="Click to edit PU code">${escapeHtml(pu.code || '—')}</span>)</span>
                                ${pu.fullCode ? `<span style="font-family:monospace; font-size:11px; color:var(--mist);">${escapeHtml(pu.fullCode)}</span>` : ''}
                              </div>

                            </div>
                          `).join('')}
                        </div>
                      </details>
                    `).join('')}
                  </div>
                </details>
              `).join('')
            }
          </div>
        </div>
      `;
      return wrap;
    }

    function setLocFilter(level, val) {
      if (level === 'state') {
        S.locFilterState = val;
        S.locFilterLga = '';
        S.locFilterWard = '';
      } else if (level === 'lga') {
        S.locFilterLga = val;
        S.locFilterWard = '';
      } else if (level === 'ward') {
        S.locFilterWard = val;
      }
      R();
    }

    async function saveWardEdit(id, field, value) {
      if (!id) return;
      const item = await dbGet('registry', id);
      if (item) {
        item[field] = value.trim();
        item.fullCode = buildFullCode({ ...item, fullCode: '' });
        await dbPut('registry', item);
        toast(`Updated ward ${field} to ${value.trim()}`, 'success', 2000);
      }
    }

    async function savePuEdit(id, field, value) {
      if (!id) return;
      const item = await dbGet('registry', id);
      if (item) {
        item[field] = field === 'puName' ? value.trim().toUpperCase() : value.trim();
        item.fullCode = buildFullCode({ ...item, fullCode: '' });
        await dbPut('registry', item);
        toast(`Updated ${field} to ${item[field]}`, 'success', 2000);
        await R();
      }
    }

    async function deleteRegistryItem(id, label, e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      const ok = await askConfirm(`Delete ${label || 'this location'} from the registry?`, {
        title: "Delete Location",
        confirmLabel: "Delete",
        danger: true
      });
      if (!ok) return;
      await dbDelete('registry', id);
      S.locSelection.delete(Number(id));
      toast(`Deleted ${label || 'location'}`, 'info', 2000);
      await R();
    }

    async function deleteRegistryGroup(idsJson, label, e) {
      if (e) {
        e.stopPropagation();
        e.preventDefault();
      }
      let ids = [];
      try { ids = JSON.parse(idsJson); } catch(err) {}
      if (!ids || ids.length === 0) return;
      const ok = await askConfirm(`Delete ${label} (${ids.length} registry entr${ids.length === 1 ? 'y' : 'ies'})?`, {
        title: "Delete Location Group",
        confirmLabel: "Delete",
        danger: true
      });
      if (!ok) return;
      for (const id of ids) {
        await dbDelete('registry', id);
        S.locSelection.delete(Number(id));
      }
      toast(`Deleted ${label}`, 'info', 2000);
      await R();
    }

    async function clearRegistryData() {
      const ok = await askConfirm("Clear all loaded location records from local registry?", {
        title: "Clear Registry",
        confirmLabel: "Clear All",
        danger: true
      });
      if (ok) {
        await dbClear('registry');
        S.locSelection.clear();
        S.locFilterState = '';
        S.locFilterLga = '';
        S.locFilterWard = '';
        toast("Registry cleared — store is now empty.", "info");
        R();
      }
    }

    // ─────────────────────────────────────────────────────────────────
    // SCREEN 4A: MAIN TABLE (SPREADSHEET UI — CLEAN / SYNCED ROWS ONLY)
    // ─────────────────────────────────────────────────────────────────
    async function vCardsTable() {
      const viewMode = await getEffectiveViewMode();
      const isMobile = viewMode === 'mobile';
      applyViewModeClass(viewMode);
      const allRows = await dbAll('rows');
      const reg = await dbAll('registry');

      // Show ONLY rows where sync === 'synced' OR (sync === 'pending' AND no flags/errors)
      let rows = allRows.filter(isMainTableRow);

      // Optional sub-filter within Main Table
      if (S.tableFilter === 'pending') {
        rows = rows.filter(r => r.sync === 'pending' || !r.sync);
      } else if (S.tableFilter === 'synced') {
        rows = rows.filter(r => r.sync === 'synced');
      } else if (S.tableFilter === 'lga' && S.filterLga) {
        rows = rows.filter(r => String(r.lgaCode || '').padStart(2, '0') === String(S.filterLga).padStart(2, '0'));
      }

      // Cascading State / LGA / Ward / PU filter
      rows = applyCardLocationFilter(rows);

      // Search filter
      if (S.tableSearch.trim()) {
        const q = S.tableSearch.toLowerCase().trim();
        rows = rows.filter(r => 
          (r.name && r.name.toLowerCase().includes(q)) ||
          (r.contact && r.contact.includes(q)) ||
          ((r.vin || r.contact2) && (r.vin || r.contact2).toLowerCase().includes(q)) ||
          (r.lga && r.lga.toLowerCase().includes(q)) ||
          (r.ward && r.ward.toLowerCase().includes(q)) ||
          (r.pu && r.pu.toLowerCase().includes(q)) ||
          (r.portfolio && r.portfolio.toLowerCase().includes(q)) ||
          (r.sourceFile && r.sourceFile.toLowerCase().includes(q))
        );
      }

      const validRowIds = new Set(rows.map(r => r.id));
      Array.from(S.selectedRows).forEach(id => {
        if (!validRowIds.has(id) && !validRowIds.has(Number(id))) S.selectedRows.delete(id);
      });
      S.visibleRowIds = rows.map(r => r.id);

      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.flexDirection = 'column';
      wrap.style.gap = '14px';

      // Load thumbnails from images store
      const allImages = await dbAll('images');
      const imageMap = new Map();
      allImages.forEach(img => {
        if (img.blob) {
          imageMap.set(img.rowId, URL.createObjectURL(img.blob));
        }
      });

      const filterBarHtml = renderCardLocationFilterBar(reg, 'table');
      const totalDupCount = allRows.filter(r => Boolean(r.duplicateOf) || (Array.isArray(r.flags) && r.flags.includes('possible duplicate'))).length;

      const renderMobileRowCardHtml = (row, idx) => {
        const thumbSrc = imageMap.get(row.id);
        const snDisplay = `${row.sn || (idx + 1)}`;
        const isDup = Boolean(row.duplicateOf) || (Array.isArray(row.flags) && row.flags.includes('possible duplicate'));
        const vinVal = row.vin || row.contact2 || '';
        const syncTagClass = row.sync === 'synced' ? 'green' : 'amber';
        const syncLabel = row.sync === 'synced' ? 'Synced' : 'Pending';
        const isChecked = S.selectedRows.has(row.id) || S.selectedRows.has(String(row.id));
        const srcText = formatSourceShort(row);
        const fullCode = [row.stateCode || '08', row.lgaCode, row.wardCode, row.puCode].filter(Boolean).join('-');
        return `
          <div class="mobile-row-card" data-row-id="${escapeHtml(String(row.id))}" onclick="openRowInspector(${JSON.stringify(row.id)})">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:10px;">
              <div style="display:flex; align-items:center; gap:10px;">
                <input type="checkbox" class="row-checkbox row-select-cb" data-row-id="${escapeHtml(String(row.id))}" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="toggleRowSelection(${JSON.stringify(row.id)}, this.checked)" aria-label="Select row ${snDisplay}">

                  ${thumbSrc ? `<img src="${thumbSrc}" alt="Card Photo">` : `<span style="font-size:11px; color:var(--mu);">No pic</span>`}
                </div>
                <div>
                  <div style="font-weight:700; color:#fff; font-size:15px;">#${snDisplay} · ${escapeHtml(row.name || 'Unnamed')}</div>
                  <div style="font-size:12px; color:var(--mist); font-family:monospace;">${escapeHtml(fullCode || '—')}</div>
                </div>
              </div>
              <span class="tag ${syncTagClass}">${syncLabel}</span>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:6px 10px; font-size:12.5px; color:var(--mu);">

              <div style="display:flex; gap:6px; align-items:center;">
                ${isDup ? `<button type="button" class="tag amber" onclick="event.stopPropagation(); openDuplicateReviewModal(${JSON.stringify(row.id)})">⚠ Dup</button>` : ''}

            </div>

              <select id="tbl-filter-sel" style="width: auto; padding: 5px 28px 5px 10px; font-size: 12.5px;" onchange="setTableFilter(this.value)">

                <option value="pending" ${S.tableFilter === 'pending' ? 'selected' : ''}>Pending sync</option>
                <option value="synced" ${S.tableFilter === 'synced' ? 'selected' : ''}>Synced</option>

              ${S.tableFilter === 'lga' && S.filterLga ? `

            </div>

            <div class="offline-notice">
              <span>💾 All data is saved on this device. Unsynced records are kept safe offline.</span>
            </div>
          </div>
        </div>

        ${isMobile ? mobileCardsHtml : `
        <!-- 15-Column Spreadsheet Table -->
        <div class="table-container">
          <table class="data-table spreadsheet-table">
            <thead>
              <tr>
                <th style="width: 36px; text-align:center;">
                  <input type="checkbox" class="row-checkbox" id="select-all-visible" onchange="toggleSelectAllVisible(this.checked)" title="Select all visible rows">
                </th>
                <th style="width: 54px;">S/N</th>
                <th>NAME</th>
                <th>PORTFOLIO</th>
                <th>LGA</th>
                <th>CODE</th>
                <th>WARD</th>
                <th>CODE</th>
                <th>PU</th>
                <th>CODE</th>
                <th>CONTACT</th>
                <th>VIN</th>
                <th>SOURCE</th>
                <th>PVC PHOTO</th>
                <th>SYNC STATUS</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>`}
      `;

      const renderMainTableRowHtml = (row, idx) => {
        console.log("Rendering row:", row.id, row.name);
        const thumbSrc = imageMap.get(row.id);
        const snDisplay = `${row.sn || (idx + 1)}`;
        const isDup = Boolean(row.duplicateOf) || (Array.isArray(row.flags) && row.flags.includes('possible duplicate'));
        const vinVal = row.vin || row.contact2 || '';
        const syncTagClass = row.sync === 'synced' ? 'green' : 'amber';
        const syncLabel = row.sync === 'synced' ? 'Synced' : 'Pending';
        const animDelay = `${Math.min(idx, 12) * 35}ms`;
        const isChecked = S.selectedRows.has(row.id) || S.selectedRows.has(String(row.id));
        const srcText = formatSourceShort(row);
        const srcTip = formatSourceTooltip(row);

        return `
          <tr class="row-anim-in" style="animation-delay: ${animDelay};" data-row-id="${escapeHtml(String(row.id))}">

                <span>${snDisplay}</span>
                ${isDup ? `<button type="button" class="tag amber" style="cursor:pointer;" onclick="event.stopPropagation(); openDuplicateReviewModal(${JSON.stringify(row.id)})" title="Click to review duplicate records">⚠ Duplicate?</button>` : ''}
              </div>
            </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.name ? 'is-blank' : ''}"

                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.portfolio ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'portfolio', this.innerText)"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.portfolio || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.lga ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'lga', this.innerText)"
                            onfocus="showRegistryAutocomplete(this, ${JSON.stringify(row.id)}, 'lga')"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.lga || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.lgaCode ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'lgaCode', this.innerText)"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.lgaCode || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.ward ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'ward', this.innerText)"
                            onfocus="showRegistryAutocomplete(this, ${JSON.stringify(row.id)}, 'ward')"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.ward || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.wardCode ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'wardCode', this.innerText)"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.wardCode || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.pu ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'pu', this.innerText)"
                            onfocus="showRegistryAutocomplete(this, ${JSON.stringify(row.id)}, 'pu')"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.pu || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.puCode ? 'is-blank' : ''}"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'puCode', this.innerText)"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.puCode || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!row.contact ? 'is-blank' : ''}"
                            style="font-family:monospace;"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'contact', this.innerText)"
                            onkeydown="handleCellNav(event)">${escapeHtml(row.contact || '')}</span>
                    </td>

                    <td onclick="event.stopPropagation()">
                      <span contenteditable="true" class="editable-cell ${!vinVal ? 'is-blank' : ''}"
                            style="font-family:monospace;"
                            onblur="saveCellEdit(${JSON.stringify(row.id)}, 'vin', this.innerText)"
                            onkeydown="handleCellNav(event)">${escapeHtml(vinVal)}</span>
                    </td>

            <td onclick="event.stopPropagation()" title="${escapeHtml(srcTip)}">
              <span class="source-cell-pill">${escapeHtml(srcText)}</span>
            </td>

            <td onclick="event.stopPropagation()" style="text-align:center;">
              <div class="thumb-cell" onclick="openPhotoLightbox('${thumbSrc || ''}')" title="Click to view full photo">

        const tbodyEl = wrap.querySelector('.spreadsheet-table tbody');

    function parseFlexibleCode(rawCode) {
      if (!rawCode) return null;
      const fourPart = normalizeAndParseDelimCode(rawCode);
      if (fourPart) return fourPart;
      const parts = String(rawCode).trim().toUpperCase().replace(/\s*[-–—]\s*/g, '-').split('-').filter(Boolean);
      if (parts.length === 3) {
        return normalizeAndParseDelimCode(`08-${parts[0].padStart(2, '0')}-${parts[1].padStart(2, '0')}-${parts[2].padStart(3, '0')}`);
      }
      return null;
    }

    async function saveReviewRow(rowId) {
      console.log("Save clicked for row: " + rowId);
      const row = await dbGet('rows', rowId);
      if (!row) return;

      const nameEl = document.getElementById(`rev-name-${rowId}`);
      const codeEl = document.getElementById(`rev-code-${rowId}`);
      const portEl = document.getElementById(`rev-portfolio-${rowId}`);
      const contEl = document.getElementById(`rev-contact-${rowId}`);
      const vinEl = document.getElementById(`rev-vin-${rowId}`);

      const name = (nameEl ? nameEl.value : (row.name || '')).trim().toUpperCase();
      const rawCode = (codeEl ? codeEl.value : '').trim();
      const portfolio = (portEl ? portEl.value : (row.portfolio || '')).trim();
      const contact = (contEl ? contEl.value : (row.contact || '')).trim();
      const vin = (vinEl ? vinEl.value : (row.vin || row.contact2 || '')).trim().toUpperCase();

      const parsed = parseFlexibleCode(rawCode);
      const stateCode = parsed ? parsed.stateCode : (row.stateCode || '');
      const lgaCode = parsed ? parsed.lgaCode : (rawCode ? '' : (row.lgaCode || ''));
      const wardCode = parsed ? parsed.wardCode : (rawCode ? '' : (row.wardCode || ''));
      const puCode = parsed ? parsed.puCode : (rawCode ? '' : (row.puCode || ''));

      if (!name || !lgaCode || !wardCode || !puCode) {
        toast("Cannot save: LGA, Ward and PU are required.", "error", 4000);
        return;
      }

      const registry = await dbAll('registry');
      const loc = resolveLocationByCode(registry, stateCode, lgaCode, wardCode, puCode);

      row.name = name;
      row.portfolio = portfolio;
      row.contact = contact;
      row.vin = vin;
      row.contact2 = vin;
      row.stateCode = loc.matched ? loc.stateCode : (stateCode || '08');
      row.stateName = loc.matched ? loc.stateName : (row.stateName || '');
      row.lgaCode = loc.matched ? loc.lgaCode : lgaCode;
      row.lga = (loc.matched && loc.lgaName) ? loc.lgaName : (row.lga || '');
      row.wardCode = loc.matched ? loc.wardCode : wardCode;
      row.ward = (loc.matched && loc.wardName) ? loc.wardName : (row.ward || '');
      row.puCode = loc.matched ? loc.puCode : puCode;
      row.pu = (loc.matched && loc.puName) ? loc.puName : (row.pu || '');
      const wasError = row.sync === 'error';
      row.sync = wasError ? 'error' : 'pending';
      row.flags = computeRowFlags(row, registry);

      await dbPut('rows', row);
      const blocking = row.flags.filter(f => f !== 'possible duplicate');
      if (blocking.length > 0) {
        toast(`Saved, but still flagged (${blocking.join(', ')}). Check registry code.`, "warning", 4000);
      } else if (wasError) {
        toast("Saved! Click '⟳ Retry failed syncs' to push.", "success", 3500);
      } else {
        toast("Saved! Row moved to Main Table.", "success", 3000);
      }
      await RWithScrollPreserve();
    }

    function createCanvasFromBlob(blob, maxW = 800) {
      return new Promise((resolve, reject) => {
        if (!blob) { reject(new Error('Missing image blob')); return; }
        const img = new Image();
        const url = URL.createObjectURL(blob);
        img.onload = () => {
          URL.revokeObjectURL(url);
          let w = img.width || 1;
          let h = img.height || 1;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = Math.max(10, w);
          canvas.height = Math.max(10, h);
          canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
          // Re-encode via JPEG (max 800px wide) as clean normalized card canvas
          const jpegUrl = canvas.toDataURL('image/jpeg', 0.9);
          const normImg = new Image();
          normImg.onload = () => {
            const out = document.createElement('canvas');
            out.width = canvas.width;
            out.height = canvas.height;
            out.getContext('2d').drawImage(normImg, 0, 0);
            resolve(out);
          };
          normImg.onerror = () => resolve(canvas);
          normImg.src = jpegUrl;
        };
        img.onerror = (err) => {
          URL.revokeObjectURL(url);
          reject(err || new Error('Failed to decode image blob'));
        };
        img.src = url;
      });
    }

    function getFormattedRowCode(row) {
      if (row?.lgaCode && row?.wardCode && row?.puCode) {
        return `${String(row.stateCode || '08').padStart(2, '0')}-${String(row.lgaCode).padStart(2, '0')}-${String(row.wardCode).padStart(2, '0')}-${String(row.puCode).padStart(3, '0')}`;
      }
      return '';
    }

    function normalizeExtractedFieldsForRow(extracted) {
      const name = String(extracted?.name || '').trim().toUpperCase();
      const rawCode = String(extracted?.code || '').trim();
      const parsed = parseFlexibleCode(rawCode);
      const code = parsed ? parsed.fullCode : rawCode;
      const vin = String(extracted?.vin || '').trim().toUpperCase();
      const contact = String(extracted?.contact || '').replace(/\D/g, '').trim();
      return { name, code, vin, contact };
    }

    function applyExtractedFieldsToRowObj(row, normExt, registry) {
      const updated = { ...row };
      if (normExt.name) updated.name = normExt.name;
      if (normExt.vin) {
        updated.vin = normExt.vin;
        updated.contact2 = normExt.vin;
      }
      if (normExt.contact) updated.contact = normExt.contact;
      if (normExt.code) {
        const res = resolveExtractedCardLocation(registry, normExt.code, updated.name);
        if (res.matched) {
          updated.stateName = res.stateName || updated.stateName || '';
          updated.stateCode = res.stateCode || updated.stateCode || '08';
          updated.lga = res.lga || updated.lga || '';
          updated.lgaCode = res.lgaCode;
          updated.ward = res.ward || updated.ward || '';
          updated.wardCode = res.wardCode;
          updated.pu = res.pu || updated.pu || '';
          updated.puCode = res.puCode;
        } else {
          const parsed = parseFlexibleCode(normExt.code);
          if (parsed) {
            updated.stateCode = parsed.stateCode;
            updated.lgaCode = parsed.lgaCode;
            updated.wardCode = parsed.wardCode;
            updated.puCode = parsed.puCode;
          }
        }
      }
      updated.flags = computeRowFlags(updated, registry);
      return updated;
    }

    async function rescanSingleReviewRow(rowId) {
      const row = await dbGet('rows', rowId);
      if (!row) return;
      const imgRec = await dbGet('images', row.id) || await dbGet('images', Number(row.id));
      if (!imgRec || !imgRec.blob) {
        toast("No image stored for this row. Cannot rescan.", "warning", 3500);
        return;
      }

      toast("Rescanning card photo...", "info", 1800);
      try {
        const canvas = await createCanvasFromBlob(imgRec.blob, 800);
        const extracted = await extractCardData(canvas);
        let uprightCanvas = extracted.uprightCanvas || rotateCanvas(canvas, extracted.rotation_needed || 0);
        const normExt = normalizeExtractedFieldsForRow(extracted);

        const curName = String(row.name || '').trim().toUpperCase();
        const curCode = getFormattedRowCode(row).toUpperCase();
        const curVin = String(row.vin || row.contact2 || '').trim().toUpperCase();
        const curContact = String(row.contact || '').replace(/\D/g, '').trim();

        const hasNewData =
          (normExt.name && normExt.name !== curName) ||
          (normExt.code && normExt.code.toUpperCase() !== curCode) ||
          (normExt.vin && normExt.vin !== curVin) ||
          (normExt.contact && normExt.contact !== curContact);

        if (!hasNewData) {
          toast("Rescan found nothing new. Card may be too blurry.", "info", 3500);
          return;
        }

        const shouldApply = await showRescanDiffModal(row, normExt);
        if (!shouldApply) return;

        const registry = await dbAll('registry');
        const updated = applyExtractedFieldsToRowObj(row, normExt, registry);
        await dbPut('rows', updated);

        if (extracted.rotation_needed && uprightCanvas) {
          if (uprightCanvas.width > 800) {
            const scaled = document.createElement('canvas');
            scaled.width = 800;
            scaled.height = Math.round((uprightCanvas.height * 800) / uprightCanvas.width);
            scaled.getContext('2d').drawImage(uprightCanvas, 0, 0, scaled.width, scaled.height);
            uprightCanvas = scaled;
          }
          const uprightBlob = await new Promise((resolve) => uprightCanvas.toBlob((b) => resolve(b || null), 'image/jpeg', 0.6));
          if (uprightBlob) await dbPut('images', { rowId: row.id, blob: uprightBlob });
        }

        toast("Row updated via rescan.", "success", 3000);
        await updateHeaderStats();
        await RWithScrollPreserve();
      } catch (err) {
        console.error("Rescan failed:", err);
        toast("Rescan failed: " + (err?.message || err), "error", 4000);
        await updateHeaderStats();
      }
    }

    async function rescanAllFlaggedRows() {
      const allRows = await dbAll('rows');
      const registry = await dbAll('registry');
      let targetRows = applyCardLocationFilter(allRows.filter(isReviewRow));
      if (S.tableSearch.trim()) {
        const q = S.tableSearch.toLowerCase().trim();
        targetRows = targetRows.filter(r =>
          (r.name && r.name.toLowerCase().includes(q)) ||
          (r.contact && r.contact.includes(q)) ||
          ((r.vin || r.contact2) && (r.vin || r.contact2).toLowerCase().includes(q)) ||
          (r.lga && r.lga.toLowerCase().includes(q)) ||
          (r.ward && r.ward.toLowerCase().includes(q)) ||
          (r.pu && r.pu.toLowerCase().includes(q)) ||
          (r.sourceFile && r.sourceFile.toLowerCase().includes(q)) ||
          (Array.isArray(r.flags) && r.flags.some(f => f.toLowerCase().includes(q)))
        );
      }
      if (targetRows.length === 0) {
        toast("No flagged rows in current view to rescan.", "info", 3000);
        return;
      }

      const btn = document.getElementById('btn-rescan-all-flagged');
      if (btn) btn.disabled = true;

      let fixedCount = 0;
      let manualCount = 0;

      try {
        for (let i = 0; i < targetRows.length; i++) {
          const row = targetRows[i];
          const progressText = `Rescanning ${i + 1} of ${targetRows.length}...`;
          if (btn) btn.textContent = progressText;
          toast(progressText, "info", 1200);

          const imgRec = await dbGet('images', row.id) || await dbGet('images', Number(row.id));
          if (!imgRec || !imgRec.blob) {
            manualCount++;
            continue;
          }

          try {
            const canvas = await createCanvasFromBlob(imgRec.blob, 800);
            const extracted = await extractCardData(canvas);
            let uprightCanvas = extracted.uprightCanvas || rotateCanvas(canvas, extracted.rotation_needed || 0);
            const normExt = normalizeExtractedFieldsForRow(extracted);
            const candidate = applyExtractedFieldsToRowObj(row, normExt, registry);

            if (Array.isArray(candidate.flags) && candidate.flags.length === 0) {
              await dbPut('rows', candidate);
              if (extracted.rotation_needed && uprightCanvas) {
                if (uprightCanvas.width > 800) {
                  const scaled = document.createElement('canvas');
                  scaled.width = 800;
                  scaled.height = Math.round((uprightCanvas.height * 800) / uprightCanvas.width);
                  scaled.getContext('2d').drawImage(uprightCanvas, 0, 0, scaled.width, scaled.height);
                  uprightCanvas = scaled;
                }
                const uprightBlob = await new Promise((resolve) => uprightCanvas.toBlob((b) => resolve(b || null), 'image/jpeg', 0.6));
                if (uprightBlob) await dbPut('images', { rowId: row.id, blob: uprightBlob });
              }
              fixedCount++;
            } else {
              manualCount++;
            }
          } catch (rowErr) {
            console.warn(`Rescan skipped row ${row.id}:`, rowErr);
            manualCount++;
          }
        }
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = '🔄 Rescan all flagged rows';
        }
      }

      toast(`Rescan complete: ${fixedCount} rows fixed, ${manualCount} still need manual review`, fixedCount > 0 ? "success" : "info", 5000);
      await updateHeaderStats();
      await RWithScrollPreserve();
    }

    async function showRegistryAutocomplete(cell, rowId, type) {
      if (activeAcDropdown) activeAcDropdown.remove();
      const reg = await dbAll('registry');
      if (reg.length === 0) return;

      const items = new Set();
      if (type === 'lga') {
        reg.forEach(r => { if (r.lgaName) items.add(`${r.lgaName} (${r.lgaCode || ''})`); });
      } else if (type === 'ward') {
        reg.forEach(r => { if (r.wardName) items.add(`${r.wardName} (${r.wardCode || ''})`); });
      } else if (type === 'pu') {
        reg.forEach(r => { if (r.puName) items.add(`${r.puName} (${r.puCode || ''})`); });
      }

      if (items.size === 0) return;

      const dd = document.createElement('div');
      dd.className = 'ac-dropdown';
      const rect = cell.getBoundingClientRect();
      dd.style.left = `${rect.left}px`;
      dd.style.top = `${rect.bottom + window.scrollY + 4}px`;

      Array.from(items).slice(0, 15).forEach(str => {
        const itemEl = document.createElement('div');
        itemEl.className = 'ac-item';
        itemEl.innerText = str;
        itemEl.onmousedown = (e) => {
          e.preventDefault();
          const match = str.match(/^(.+?)\s*\((.*?)\)$/);
          if (match) {
            cell.innerText = match[1].trim();
            saveCellEdit(rowId, type, match[1].trim());
            // If code exists, also update corresponding code field
            if (match[2]) {
              saveCellEdit(rowId, `${type}Code`, match[2].trim());
            }
          } else {
            cell.innerText = str;
            saveCellEdit(rowId, type, str);
          }
          dd.remove();
        };
        dd.appendChild(itemEl);
      });

      document.body.appendChild(dd);
      activeAcDropdown = dd;

      const closeHandler = () => {
        if (activeAcDropdown) activeAcDropdown.remove();
        document.removeEventListener('click', closeHandler);
      };
      setTimeout(() => document.addEventListener('click', closeHandler), 100);

    async function updateFormPuOptions(wardCode, lgaCodeArg = null, stateCodeArg = null) {
      const reg = await dbAll('registry');
      const puEl = document.getElementById('mf-pu');
      const emptyMsg = document.getElementById('mf-pu-empty-msg');
      if (!puEl) return;

      if (!wardCode || reg.length === 0) {
        puEl.innerHTML = '<option value="">Select Ward first</option>';
        if (emptyMsg) emptyMsg.style.display = 'none';
        return;
      }

      const stateEl = document.getElementById('mf-state');
      const lgaEl = document.getElementById('mf-lga');
      const stateVal = stateCodeArg !== null ? stateCodeArg : (stateEl ? stateEl.value : '');
      const lgaVal = lgaCodeArg !== null ? lgaCodeArg : (lgaEl ? lgaEl.value : '');

      const targetLga = pad2(lgaVal);
      const targetWard = pad2(wardCode);
      const targetStateDigits = pad2(stateVal);
      const targetStateRaw = String(stateVal || '').trim().toUpperCase();

      const filtered = reg.filter(r => {
        if (targetLga && pad2(r.lgaCode) !== targetLga) return false;
        if (!targetLga && String(r.lgaName || '').trim().toUpperCase() !== String(lgaVal || '').trim().toUpperCase()) return false;

        if (targetWard && pad2(r.wardCode) !== targetWard) return false;
        if (!targetWard && String(r.wardName || '').trim().toUpperCase() !== String(wardCode || '').trim().toUpperCase()) return false;

        if (targetStateRaw) {
          const rStateName = String(r.stateName || 'BORNO').trim().toUpperCase();
          const rStateCode = pad2(r.stateCode || (rStateName === 'BORNO' ? '08' : ''));
          if (targetStateDigits) {
            if (rStateCode !== targetStateDigits) return false;
          } else if (rStateName !== targetStateRaw) {
            return false;
          }
        }
        return true;
      });

      // Dedupe by puCode (preserve distinct PUs that lack puCode by name key)
      const unique = new Map();
      filtered.forEach((r, idx) => {
        const pCode = pad3(r.puCode);
        const pName = String(r.puName || '').trim();
        const key = pCode || `NAME:${pName.toUpperCase() || idx}`;
        if (!unique.has(key)) {
          unique.set(key, {
            puCode: pCode,
            puName: pName || pCode
          });
        }
      });

      const pus = Array.from(unique.values()).sort((a, b) =>
        (a.puCode || a.puName).localeCompare(b.puCode || b.puName, undefined, { numeric: true })
      );

      console.log(`PU dropdown for ward ${wardCode}: ${pus.length} PUs found`);

      if (pus.length === 0) {
        puEl.innerHTML = '<option value="">No PUs in registry for this ward</option>';
        if (emptyMsg) {
          emptyMsg.textContent = 'No PUs found for this ward. Check the registry.';
          emptyMsg.style.display = 'block';
        }
        return;
      }

      puEl.innerHTML = '<option value="">Select PU</option>' +
        pus.map(p => `<option value="${escapeHtml(p.puCode || p.puName)}" data-pu-name="${escapeHtml(p.puName)}">${escapeHtml(p.puName)}${p.puCode ? ` (${escapeHtml(p.puCode)})` : ''}</option>`).join('');

      if (emptyMsg) emptyMsg.style.display = 'none';
    }

    // ─────────────────────────────────────────────────────────────────
    // SCREEN 6: ROW INSPECTOR / REVIEW & FIX (S.cardView = 'row')
    // ─────────────────────────────────────────────────────────────────
    function resolveInitialDropdownCodes(row, reg) {
      const hasAnyCode = Boolean(
        String(row?.stateCode || '').trim() ||
        String(row?.lgaCode || '').trim() ||
        String(row?.wardCode || '').trim() ||
        String(row?.puCode || '').trim()
      );
      const hasAnyName = Boolean(
        String(row?.stateName || '').trim() ||
        String(row?.lga || '').trim() ||
        String(row?.ward || '').trim() ||
        String(row?.pu || '').trim()
      );

      if (!hasAnyCode && !hasAnyName) {
        return { stateCode: '', lgaCode: '', wardCode: '', puCode: '' };
      }

      let sCode = normLocCode(row.stateCode, 2);
      let lCode = normLocCode(row.lgaCode, 2);
      let wCode = normLocCode(row.wardCode, 2);
      let pCode = normLocCode(row.puCode, 3);

      // Try resolving codes against registry so missing names or missing stateCode get resolved
      if (lCode || wCode || pCode) {
        const loc = resolveLocationByCode(reg, sCode, lCode, wCode, pCode);
        if (loc.matched) {
          sCode = normLocCode(loc.stateCode, 2) || sCode;
          lCode = loc.lgaCode || lCode;
          if (loc.exactWardMatched) wCode = loc.wardCode || wCode;
          if (loc.exactPuMatched) pCode = loc.puCode || pCode;
        }
      } else if (hasAnyName) {
        // Fallback: if row only stored names without codes, match against registry by name
        const lName = String(row.lga || '').trim().toUpperCase();
        const wName = String(row.ward || '').trim().toUpperCase();
        const pName = String(row.pu || '').trim().toUpperCase();
        const exact = reg.find(r =>
          (!lName || (r.lgaName || '').trim().toUpperCase() === lName) &&
          (!wName || (r.wardName || '').trim().toUpperCase() === wName) &&
          (!pName || (r.puName || '').trim().toUpperCase() === pName)
        ) || (lName ? reg.find(r => (r.lgaName || '').trim().toUpperCase() === lName) : null);
        if (exact) {
          sCode = normLocCode(exact.stateCode || '08', 2);
          lCode = normLocCode(exact.lgaCode, 2);
          if (wName && (exact.wardName || '').trim().toUpperCase() === wName) wCode = normLocCode(exact.wardCode, 2);
          if (pName && (exact.puName || '').trim().toUpperCase() === pName) pCode = normLocCode(exact.puCode, 3);
        }
      }

      if (!sCode && (lCode || row.stateName)) {
        const sMatch = reg.find(r =>
          (row.stateName && (r.stateName || '').trim().toUpperCase() === String(row.stateName).trim().toUpperCase()) ||
          (lCode && normLocCode(r.lgaCode, 2) === lCode)
        );
        if (sMatch) sCode = normLocCode(sMatch.stateCode || '08', 2);
      }

      return { stateCode: sCode, lgaCode: lCode, wardCode: wCode, puCode: pCode };
    }

    async function onInspectorLocationChange(rowId, level) {
      const reg = await dbAll('registry');
      const stateEl = document.getElementById('insp-state');
      const lgaEl = document.getElementById('insp-lga');
      const wardEl = document.getElementById('insp-ward');
      const puEl = document.getElementById('insp-pu');
      if (!stateEl || !lgaEl || !wardEl || !puEl) return;

      const stateCode = stateEl.value;
      if (level === 'state') {
        const lgas = stateCode ? getRegistryLgas(reg, stateCode) : [];
        lgaEl.innerHTML = '<option value="">Select LGA</option>' + lgas.map(l => `<option value="${escapeHtml(l.code)}">${escapeHtml(formatLocLabel(l.name, l.code))}</option>`).join('');
        lgaEl.value = '';
        wardEl.innerHTML = '<option value="">Select Ward</option>';
        wardEl.value = '';
        puEl.innerHTML = '<option value="">Select PU</option>';
        puEl.value = '';
      } else if (level === 'lga') {
        const wards = (stateCode && lgaEl.value) ? getRegistryWards(reg, stateCode, lgaEl.value) : [];
        wardEl.innerHTML = '<option value="">Select Ward</option>' + wards.map(w => `<option value="${escapeHtml(w.code)}">${escapeHtml(formatLocLabel(w.name, w.code))}</option>`).join('');
        wardEl.value = '';
        puEl.innerHTML = '<option value="">Select PU</option>';
        puEl.value = '';
      } else if (level === 'ward') {
        const pus = (stateCode && lgaEl.value && wardEl.value) ? getRegistryPus(reg, stateCode, lgaEl.value, wardEl.value) : [];
        puEl.innerHTML = '<option value="">Select PU</option>' + pus.map(p => `<option value="${escapeHtml(p.code)}">${escapeHtml(formatLocLabel(p.name, p.code))}</option>`).join('');
        puEl.value = '';
      }

      const row = await dbGet('rows', rowId);
      if (!row) return;

      const selState = stateEl.value;
      const selLga = lgaEl.value;
      const selWard = wardEl.value;
      const selPu = puEl.value;

      const stateItem = getRegistryStates(reg).find(s => s.code === selState);
      const lgaItem = selLga ? getRegistryLgas(reg, selState).find(l => l.code === selLga) : null;
      const wardItem = (selLga && selWard) ? getRegistryWards(reg, selState, selLga).find(w => w.code === selWard) : null;
      const puItem = (selLga && selWard && selPu) ? getRegistryPus(reg, selState, selLga, selWard).find(p => p.code === selPu) : null;

      row.stateCode = selState ? normLocCode(selState, 2) : '';
      row.stateName = stateItem ? stateItem.name : '';
      row.lgaCode = selLga ? normLocCode(selLga, 2) : '';
      row.lga = lgaItem ? lgaItem.name : '';
      row.wardCode = selWard ? normLocCode(selWard, 2) : '';
      row.ward = wardItem ? wardItem.name : '';
      row.puCode = selPu ? normLocCode(selPu, 3) : '';
      row.pu = puItem ? puItem.name : '';

      // Also keep latest text inputs if already edited
      const nameEl = document.getElementById('insp-name');
      const portEl = document.getElementById('insp-portfolio');
      const contEl = document.getElementById('insp-contact');
      const vinEl = document.getElementById('insp-vin');
      if (nameEl) row.name = nameEl.value.trim().toUpperCase();
      if (portEl) row.portfolio = portEl.value.trim();
      if (contEl) row.contact = contEl.value.trim();
      if (vinEl) {
        const v = vinEl.value.trim().toUpperCase();
        row.vin = v;
        row.contact2 = v;
      }

      row.flags = computeRowFlags(row, reg);
      await dbPut('rows', row);
      updateHeaderStats();

      const codeBadge = document.getElementById('insp-stored-code');
      if (codeBadge) {
        codeBadge.textContent = (row.lgaCode || row.wardCode || row.puCode || row.stateCode)
          ? `${row.stateCode || '??'}-${row.lgaCode || '??'}-${row.wardCode || '??'}-${row.puCode || '???'}`
          : 'None';
      }
    }

    async function persistInspectorFormRow(id) {
      const row = await dbGet('rows', id);
      if (!row) return { ok: false };

      const name = document.getElementById('insp-name').value.trim().toUpperCase();
      const portfolio = document.getElementById('insp-portfolio').value.trim();
      const contact = document.getElementById('insp-contact').value.trim();
      const vin = document.getElementById('insp-vin').value.trim().toUpperCase();
      const stateCode = document.getElementById('insp-state')?.value || '';
      const lgaCode = document.getElementById('insp-lga')?.value || '';
      const wardCode = document.getElementById('insp-ward')?.value || '';
      const puCode = document.getElementById('insp-pu')?.value || '';

      if (!name || !lgaCode || !wardCode || !puCode) {
        toast("Cannot save: Name, LGA, Ward and PU are required.", "error", 4000);
        return { ok: false };
      }

      const registry = await dbAll('registry');
      const loc = resolveLocationByCode(registry, stateCode || row.stateCode || '08', lgaCode, wardCode, puCode);
      const stateItem = getRegistryStates(registry).find(s => s.code === stateCode);
      const lgaItem = getRegistryLgas(registry, stateCode).find(l => l.code === lgaCode);
      const wardItem = getRegistryWards(registry, stateCode, lgaCode).find(w => w.code === wardCode);
      const puItem = getRegistryPus(registry, stateCode, lgaCode, wardCode).find(p => p.code === puCode);

      row.name = name;
      row.portfolio = portfolio;
      row.contact = contact;
      row.vin = vin;
      row.contact2 = vin;
      row.stateCode = loc.matched ? loc.stateCode : normLocCode(stateCode, 2);
      row.stateName = (loc.matched && loc.stateName) ? loc.stateName : (stateItem ? stateItem.name : (row.stateName || ''));
      row.lgaCode = loc.matched ? loc.lgaCode : normLocCode(lgaCode, 2);
      row.lga = (loc.matched && loc.lgaName) ? loc.lgaName : (lgaItem ? lgaItem.name : '');
      row.wardCode = loc.matched ? loc.wardCode : normLocCode(wardCode, 2);
      row.ward = (loc.matched && loc.wardName) ? loc.wardName : (wardItem ? wardItem.name : '');
      row.puCode = loc.matched ? loc.puCode : normLocCode(puCode, 3);
      row.pu = (loc.matched && loc.puName) ? loc.puName : (puItem ? puItem.name : '');
      const wasError = row.sync === 'error';
      row.flags = computeRowFlags(row, registry);
      row.sync = wasError ? 'error' : 'pending';

      await dbPut('rows', row);
      return { ok: true, row, wasError };
    }

    async function saveInspectorRow(e, id) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      console.log("Save clicked for row: " + id);

      const res = await persistInspectorFormRow(id);
      if (!res.ok) return;

      const blocking = res.row.flags.filter(f => f !== 'possible duplicate');
      if (blocking.length > 0) {
        toast(`Saved, but still flagged (${blocking.join(', ')}).`, "warning", 3500);
      } else {
        toast("Saved.", "success", 2500);
      }
      await RWithScrollPreserve('#inspector-form');
    }

    async function saveAndNextInspectorRow(e, id) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      const res = await persistInspectorFormRow(id);
      if (!res.ok) return;

      const allRows = await dbAll('rows');
      const idx = allRows.findIndex(r => r.id === id || String(r.id) === String(id));
      const nextRow = (idx >= 0 && idx < allRows.length - 1) ? allRows[idx + 1] : null;
      if (nextRow) {
        toast("Saved.", "success", 2000);
        S.rowId = nextRow.id;
        await R();
        window.scrollTo(0, 0);
      } else {
        toast("Saved. Reached last row.", "info", 2500);
        await RWithScrollPreserve('#inspector-form');
      }
    }

    async function deleteSingleRow(id, e) {
      if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
      console.log("DELETE CLICKED. Row ID:", id);
      const ok = await askConfirm("Delete this record permanently?", {
        title: "Delete Record",
        confirmLabel: "Delete",
        danger: true
      });
      if (!ok) return;
      S.selectedRows.delete(id);
      S.selectedRows.delete(Number(id));
      await dbDelete('rows', id);
      await dbDelete('images', id).catch(() => {});
      toast("Record deleted", "info");
      if (S.cardView === 'row') {
        S.rowId = null;
        S.cardView = S.lastCardTab || 'table';
      }
      await RWithScrollPreserve();
    }
