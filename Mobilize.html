        if (!lgaCode) lgaCode = padDelimPart(lgaCodeRaw, 2);
        if (!wardCode) wardCode = padDelimPart(wardCodeRaw, 2);
        if (!puCode) puCode = padDelimPart(puCodeRaw, 3);

        if (!stateName && stateCode === '08') stateName = 'BORNO';
        if (!stateCode && stateName.toUpperCase() === 'BORNO') stateCode = '08';

        rows.push({
          sn: parsedSn,
          name: name.toUpperCase(),
          portfolio: portfolio.toUpperCase(),
          stateName: stateName.toUpperCase(),
          stateCode,
          lga: lgaName.toUpperCase(),
          lgaName: lgaName.toUpperCase(),
          lgaCode,
          ward: wardName.toUpperCase(),
          wardName: wardName.toUpperCase(),
          wardCode,
          pu: puName.toUpperCase(),
          puName: puName.toUpperCase(),
          puCode,
          fullCode,
          contact,
          vin: vin.toUpperCase(),
          pvc: pvc.toUpperCase(),
          _sheetName: sheetName || '',
          _excelRow: r + 1
        });
      }

      return {
        rows,
        detectedStateName,
        detectedStateCode,
        schema: { colMap, detectedStateName, detectedStateCode },
        skippedReason: '',
        uninterpretableRows
      };
    }

    function pickBestSheet(wb) {
      if (!wb || !Array.isArray(wb.SheetNames) || wb.SheetNames.length === 0) return null;
      for (const name of wb.SheetNames) {
        const s = wb.Sheets[name];
        const aoa = expandMergedCellsAoa(s);
        if (Array.isArray(aoa) && aoa.some(r => Array.isArray(r) && r.some(c => String(c ?? '').trim() !== ''))) {
          return s;
        }
      }
      return wb.Sheets[wb.SheetNames[0]];
    }

    // Cards CSV Parser
    async function parseCardsCsv(file, batchMeta = null) {
      const text = await file.text();
      const wb = XLSX.read(text, { type: 'string' });
      const sheet = pickBestSheet(wb);
      const res = extractStructuredRowsFromSheet(sheet, null, wb.SheetNames[0] || 'CSV');
      const meta = Object.assign({ batchId: makeBatchId(), sourceFile: file.name, pageNumber: 1 }, batchMeta || {});
      meta.importDiagnostics = {
        fileName: file.name,
        sheetsProcessed: res.rows.length > 0 ? 1 : 0,
        skippedSheets: res.skippedReason ? [{ sheetName: wb.SheetNames[0] || 'CSV', reason: res.skippedReason }] : [],
        uninterpretableRows: res.uninterpretableRows || [],
        warnings: []
      };
      return processCardDataRows(res.rows, meta);
    }

    // Cards Excel Parser (SheetJS — scans ALL sheets independently; validates continuation compatibility strictly)
    async function parseCardsExcel(file, batchMeta = null) {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: 'array' });
      let allRows = [];
      let lastSchema = null;
      const skippedSheets = [];
      const allUninterpretableRows = [];
      const warnings = [];
      let sheetsProcessed = 0;

      for (const sheetName of wb.SheetNames) {
        const sheet = wb.Sheets[sheetName];
        if (!sheet) continue;
        const aoaCheck = expandMergedCellsAoa(sheet);
        if (!aoaCheck.some(r => r.some(c => String(c ?? '').trim() !== ''))) {
          continue; // Skip truly blank worksheet silently
        }

        const res = extractStructuredRowsFromSheet(sheet, lastSchema, sheetName);
        if (res.skippedReason) {
          skippedSheets.push({ sheetName, reason: res.skippedReason });
        }
        if (res.schema && !res.isContinuation) {
          lastSchema = res.schema;
        }
        if (Array.isArray(res.uninterpretableRows) && res.uninterpretableRows.length > 0) {
          allUninterpretableRows.push(...res.uninterpretableRows);
        }

        const sheetRows = Array.isArray(res.rows) ? res.rows : [];
        if (sheetRows.length > 0) {
          sheetsProcessed++;
          console.log(`Reading sheet "${sheetName}"${res.isContinuation ? ' [continuation]' : ''}: ${sheetRows.length} rows`);
          allRows = allRows.concat(sheetRows);
        }
      }

      console.log(`Total rows from all sheets: ${allRows.length}`);
      const meta = Object.assign({ batchId: makeBatchId(), sourceFile: file.name, pageNumber: 1 }, batchMeta || {});
      meta.importDiagnostics = {
        fileName: file.name,
        sheetsProcessed,
        skippedSheets,
        uninterpretableRows: allUninterpretableRows,
        warnings
      };
      return processCardDataRows(allRows, meta);
    }

    // Cards Word Table Parser (JSZip -> word/document.xml)
    async function parseCardsDocx(file, batchMeta = null) {
      const meta = batchMeta || { batchId: makeBatchId(), sourceFile: file.name, pageNumber: 1 };
      const zip = await JSZip.loadAsync(file);
      const docXml = await zip.file("word/document.xml").async("text");
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(docXml, "application/xml");
      const trs = Array.from(xmlDoc.getElementsByTagName("w:tr"));

      if (trs.length > 1) {
        const headers = Array.from(trs[0].getElementsByTagName("w:tc")).map(tc => {
          return Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim();
        });
        const rawRows = [];
        for (let i = 1; i < trs.length; i++) {
          const cells = Array.from(trs[i].getElementsByTagName("w:tc")).map(tc => {
            return Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim();
          });
          const rowObj = {};
          headers.forEach((h, hIdx) => {
            rowObj[h] = cells[hIdx] || '';
          });
          rawRows.push(rowObj);
        }
        return processCardDataRows(rawRows, meta);
      } else {
        const textOnly = docXml.replace(/<w:p[^>]*>/g, '\n').replace(/<[^>]+>/g, ' ');
        const codeMatches = Array.from(textOnly.matchAll(/CODE[:\s]+(\d{2})-(\d{2})-(\d{2})-(\d{1,3})/gi));
        const captionMatches = Array.from(textOnly.matchAll(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/g));
        const phoneMatches = Array.from(textOnly.matchAll(/(0\d{10})/g));
        const count = Math.max(codeMatches.length, captionMatches.length, phoneMatches.length, 1);
        const rawRows = [];
        for (let i = 0; i < count; i++) {
          rawRows.push({
            name: captionMatches[i] ? captionMatches[i][2].trim().toUpperCase() : '',
            lga: captionMatches[i] ? captionMatches[i][3].trim().toUpperCase() : '',
            lgaCode: codeMatches[i] ? codeMatches[i][2] : '',
            wardCode: codeMatches[i] ? codeMatches[i][3] : '',
            puCode: codeMatches[i] ? codeMatches[i][4].padStart(3, '0') : '',
            contact: phoneMatches[i] ? phoneMatches[i][1] : ''
          });
        }
        return processCardDataRows(rawRows, meta);
      }
    }

    async function detectRotation(canvas) {
      const today = new Date().toISOString().slice(0, 10);
      const settings = await getSyncSettings();
      const candidateKeys = [
        { id: 1, key: settings.geminiApiKey1, exhausted: (await dbGet('settings', 'geminiKey1Exhausted'))?.value || '' },
        { id: 2, key: settings.geminiApiKey2, exhausted: (await dbGet('settings', 'geminiKey2Exhausted'))?.value || '' },
        { id: 3, key: settings.geminiApiKey3, exhausted: (await dbGet('settings', 'geminiKey3Exhausted'))?.value || '' }
      ].filter(k => k.key && k.exhausted !== today);
      if (candidateKeys.length === 0) return 0;

      const base64 = canvas.toDataURL('image/jpeg', 0.7).split(',')[1];
      const prompt = `Look at this image of a Nigerian Voter's Card. What rotation is needed to make the text upright?
Return ONLY JSON: {"rotation": 0, "confidence": "high|low"}
rotation must be 0, 90, 180, or 270.`;

      const models = ['gemini-1.5-flash', 'gemini-2.5-flash'];
      for (const k of candidateKeys) {
        for (const model of models) {
          try {
            const res = await fetch(
              `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(k.key)}`,
              {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  contents: [{ parts: [
                    { text: prompt },
                    { inline_data: { mime_type: 'image/jpeg', data: base64 } }
                  ]}],
                  generationConfig: { temperature: 0, responseMimeType: 'application/json' }
                })
              }
            );
            if (res.status === 404 && model === 'gemini-1.5-flash') {
              continue;
            }
            if (res.status === 429) {
              console.warn(`Rotation check Key ${k.id} hit 429.`);
              break;
            }
            if (res.ok) {
              const data = await res.json();
              const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
              const text = rawText.replace(/^```(?:json)?\s*/i, '').replace(/```\s*$/i, '').trim();
              const parsed = JSON.parse(text);
              if (parsed.rotation !== undefined) {
                const deg = [0, 90, 180, 270].includes(Number(parsed.rotation)) ? Number(parsed.rotation) : 0;
                console.log(`Rotation detected: ${deg}° (${parsed.confidence || 'unknown'})`);
                return deg;
              }
            } else {
              const errBody = await res.text().catch(() => '');
              console.warn(`Rotation check HTTP ${res.status}:`, errBody.substring(0, 160));
              break;
            }
          } catch (e) {
            console.warn("Rotation check failed:", e);
            break;
          }
        }
      }
      return 0;
    }

    function rotateCanvas(sourceCanvas, degrees) {
      const deg = Number(degrees) || 0;
      if (!deg || deg === 0) return sourceCanvas;
      const rad = (deg * Math.PI) / 180;
      const sin = Math.abs(Math.sin(rad));
      const cos = Math.abs(Math.cos(rad));
      const newW = Math.max(1, Math.round(sourceCanvas.width * cos + sourceCanvas.height * sin));
      const newH = Math.max(1, Math.round(sourceCanvas.width * sin + sourceCanvas.height * cos));
      const rotated = document.createElement('canvas');
      rotated.width = newW;
      rotated.height = newH;
      const ctx = rotated.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, newW, newH);
      ctx.translate(newW / 2, newH / 2);
      ctx.rotate(rad);
      ctx.drawImage(sourceCanvas, -sourceCanvas.width / 2, -sourceCanvas.height / 2);
      return rotated;
    }

    function rotateCanvasIfNeeded(canvas, rotationDeg) {
      return rotateCanvas(canvas, rotationDeg);
    }

    function normalizeAndParseDelimCode(rawCode) {
      if (!rawCode) return null;
      const cleaned = String(rawCode).toUpperCase().replace(/\s*[-–—]\s*/g, '-').trim();
      const tokenMatch = cleaned.match(/([0-9OB]{2})-([0-9OB]{2})-([0-9OB]{2})-([0-9OB]{1,3})/);
      const candidate = tokenMatch
        ? `${tokenMatch[1]}-${tokenMatch[2]}-${tokenMatch[3]}-${tokenMatch[4]}`
        : cleaned;
      const fixDigits = (s) => s.replace(/O/g, '0').replace(/B/g, '8');
      const parts = candidate.split('-');
      if (parts.length !== 4) return null;
      const sCode = fixDigits(parts[0]);
      const lCode = fixDigits(parts[1]);
      const wCode = fixDigits(parts[2]);
      let pCode = fixDigits(parts[3]);
      if (/^\d{1,2}$/.test(pCode)) pCode = pCode.padStart(3, '0');
      const normalized = `${sCode}-${lCode}-${wCode}-${pCode}`;
      const m = normalized.match(/^(\d{2})-(\d{2})-(\d{2})-(\d{3})$/);
      if (!m) return null;
      return {
        fullCode: normalized,
        stateCode: m[1],
        lgaCode: m[2],
        wardCode: m[3],
        puCode: m[4]
      };
    }

    function resolveLocationByCode(registry, stateCode, lgaCode, wardCode, puCode) {
      if (!lgaCode) {
        return { matched: false, stateName: '', stateCode: stateCode || '', lgaName: '', lgaCode: '', wardName: '', wardCode: wardCode || '', puName: '', puCode: puCode || '', registryLgaName: '' };
      }
      const lPad = String(lgaCode).padStart(2, '0');
      const wPad = wardCode ? String(wardCode).padStart(2, '0') : '';
      const pPad = puCode ? String(puCode).padStart(3, '0') : '';

      const exactPu = (wPad && pPad) ? registry.find(r =>
        String(r.lgaCode).padStart(2, '0') === lPad &&
        String(r.wardCode).padStart(2, '0') === wPad &&
        String(r.puCode || '').padStart(3, '0') === pPad
      ) : null;

      const wardMatch = (!exactPu && wPad) ? registry.find(r =>
        String(r.lgaCode).padStart(2, '0') === lPad &&
        String(r.wardCode).padStart(2, '0') === wPad
      ) : null;

      const lgaMatch = (!exactPu && !wardMatch) ? registry.find(r =>
        String(r.lgaCode).padStart(2, '0') === lPad
      ) : null;

      const reg = exactPu || wardMatch || lgaMatch;
      if (!reg) {
        return { matched: false, stateName: '', stateCode: stateCode || '', lgaName: '', lgaCode: lPad, wardName: '', wardCode: wPad, puName: '', puCode: pPad, registryLgaName: '' };
      }

      return {
        matched: true,
        exactPuMatched: Boolean(exactPu),
        exactWardMatched: Boolean(exactPu || wardMatch),
        stateName: reg.stateName || '',
        stateCode: reg.stateCode || stateCode || '',
        lgaName: reg.lgaName || '',
        lgaCode: reg.lgaCode ? String(reg.lgaCode).padStart(2, '0') : lPad,
        wardName: (exactPu || wardMatch) ? (reg.wardName || '') : '',
        wardCode: (exactPu || wardMatch) ? (reg.wardCode ? String(reg.wardCode).padStart(2, '0') : wPad) : wPad,
        puName: exactPu ? (reg.puName || '') : '',
        puCode: exactPu ? (reg.puCode ? String(reg.puCode).padStart(3, '0') : pPad) : pPad,
        registryLgaName: reg.lgaName || ''
      };
    }

    // Resolve LGA, Ward, and Polling Unit by normalized names against registry (no blind sheet-tab assumptions)
    function resolveLocationByName(registry, stateName, lgaName, wardName, puName) {
      if (!Array.isArray(registry) || registry.length === 0) return { matched: false };
      const cleanName = (s) => normStr(String(s || '').replace(/\b(L\.?G\.?A\.?|LOCAL GOVERNMENT( AREA)?|WARD)\b/gi, ''));
      const nState = normStr(stateName);
      const nLga = cleanName(lgaName);
      const nWard = cleanName(wardName);
      const nPu = normStr(puName);

      let pool = registry;
      if (nState) {
        const statePool = pool.filter(r => normStr(r.stateName) === nState);
        if (statePool.length > 0) pool = statePool;
      }

      let lgaMatched = null;
      if (nLga) {
        const lgaPool = pool.filter(r => {
          const rl = cleanName(r.lgaName);
          return rl === nLga || normStr(r.lgaName) === normStr(lgaName);
        });
        if (lgaPool.length > 0) {
          pool = lgaPool;
          lgaMatched = lgaPool[0];
        }
      }

      let wardMatched = null;
      if (nWard) {
        const wardPool = pool.filter(r => {
          const rw = cleanName(r.wardName);
          return rw === nWard || normStr(r.wardName) === normStr(wardName);
        });
        // Only lock in ward across the whole registry without LGA if unambiguous (single LGA/Ward pair)
        if (wardPool.length > 0) {
          const uniqueWards = new Set(wardPool.map(w => `${w.lgaCode}|${w.wardCode}`));
          if (lgaMatched || uniqueWards.size === 1) {
            pool = wardPool;
            wardMatched = wardPool[0];
          }
        }
      }

      let puMatched = null;
      if (nPu && (lgaMatched || wardMatched)) {
        const puPool = pool.filter(r => normStr(r.puName) === nPu);
        if (puPool.length === 1 || (puPool.length > 1 && wardMatched)) {
          puMatched = puPool[0];
        }
      }

      const best = puMatched || wardMatched || lgaMatched;
      if (!best) return { matched: false };

      return {
        matched: true,
        exactPuMatched: Boolean(puMatched),
        exactWardMatched: Boolean(puMatched || wardMatched),
        stateName: best.stateName || '',
        stateCode: best.stateCode ? String(best.stateCode).padStart(2, '0') : '',
        lgaName: best.lgaName || '',
        lgaCode: best.lgaCode ? String(best.lgaCode).padStart(2, '0') : '',
        wardName: (puMatched || wardMatched) ? (best.wardName || '') : '',
        wardCode: (puMatched || wardMatched) && best.wardCode ? String(best.wardCode).padStart(2, '0') : '',
        puName: puMatched ? (puMatched.puName || '') : '',
        puCode: puMatched && puMatched.puCode ? String(puMatched.puCode).padStart(3, '0') : ''
      };
    }

    function resolveExtractedCardLocation(registry, rawCode, name = '') {
      const originalCode = String(rawCode || '').trim();
      const parsedCode = normalizeAndParseDelimCode(rawCode);
      const cleanName = String(name || '').trim();
      const flags = [];
      if (!cleanName) flags.push("name not read");

      if (!parsedCode) {
        flags.push(originalCode ? `code not in registry: ${originalCode}` : "code not read");
        return {
          matched: false,
          stateName: '',
          stateCode: '',
          lga: '',
          lgaCode: '',
          ward: '',
          wardCode: '',
          pu: '',
          puCode: '',
          flags
        };
      }

      const lPad = normLocCode(parsedCode.lgaCode, 2);
      const wPad = normLocCode(parsedCode.wardCode, 2);
      const pPad = normLocCode(parsedCode.puCode, 3);

      // Exact 3-tier lookup against registry: 1) lga+ward+pu, 2) lga+ward, 3) lga only
      const exactPu = (registry || []).find(r =>
        normLocCode(r.lgaCode, 2) === lPad &&
        normLocCode(r.wardCode, 2) === wPad &&
        normLocCode(r.puCode, 3) === pPad
      );
      const wardMatch = !exactPu ? (registry || []).find(r =>
        normLocCode(r.lgaCode, 2) === lPad &&
        normLocCode(r.wardCode, 2) === wPad
      ) : null;
      const lgaMatch = (!exactPu && !wardMatch) ? (registry || []).find(r =>
        normLocCode(r.lgaCode, 2) === lPad
      ) : null;

      const matchedReg = exactPu || wardMatch || lgaMatch;
      if (!matchedReg) {
        flags.push(`code not in registry: ${originalCode || parsedCode.fullCode}`);
        return {
          matched: false,
          stateName: '',
          stateCode: '',
          lga: '',
          lgaCode: '',
          ward: '',
          wardCode: '',
          pu: '',
          puCode: '',
          flags
        };
      }

      return {
        matched: true,
        stateName: matchedReg.stateName || '',
        stateCode: normLocCode(matchedReg.stateCode || parsedCode.stateCode || '08', 2),
        lga: matchedReg.lgaName || '',
        lgaCode: normLocCode(matchedReg.lgaCode, 2),
        ward: matchedReg.wardName || '',
        wardCode: normLocCode(matchedReg.wardCode, 2),
        pu: matchedReg.puName || '',
        puCode: normLocCode(matchedReg.puCode, 3),
        flags
      };
    }

    function makeQuotaError(retryAfterSec = 60) {
      const err = new Error('Gemini free-tier quota reached');
      err.code = 'QUOTA_EXHAUSTED';
      err.retryAfterSec = retryAfterSec;
      return err;
    }

    async function postGeminiExtract(url, bodyObj, allowShortRetry = true) {
      if (Date.now() < (S.geminiCooldownUntil || 0)) {
        throw makeQuotaError(Math.ceil((S.geminiCooldownUntil - Date.now()) / 1000));
      }
      const resp = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(bodyObj)
      });
      let payload = null;
      try { payload = await resp.json(); } catch (_) {}

      if (resp.status === 429 || payload?.code === 'QUOTA_EXHAUSTED') {
        const retryAfterSec = Number(payload?.retryAfterSec || 60);
        if (allowShortRetry && retryAfterSec > 0 && retryAfterSec <= 25) {
          toast(`Gemini rate limit hit — retrying in ${retryAfterSec + 1}s...`, "info", (retryAfterSec + 1) * 1000);
          await new Promise(r => setTimeout(r, (retryAfterSec + 1) * 1000));
          return postGeminiExtract(url, bodyObj, false);
        }
        const cooldownMs = Math.min(Math.max(retryAfterSec, 60), 3600) * 1000;
        S.geminiCooldownUntil = Date.now() + cooldownMs;
        throw makeQuotaError(retryAfterSec);
      }

      if (!resp.ok) {
        throw new Error(payload?.error || `Gemini extraction HTTP ${resp.status}`);
      }
      if (!payload || !payload.ok || !payload.data) {
        throw new Error(payload?.error || 'Gemini extraction returned no data');
      }
      return payload.data;
    }

    async function extractCardWithGemini(canvas) {
      const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
      return postGeminiExtract('/api/extract-card', {
        imageBase64: dataUrl,
        mimeType: 'image/jpeg'
      });
    }

    async function extractCardsBatchWithGemini(canvases) {
      if (!canvases || canvases.length === 0) return [];
      if (canvases.length === 1) {
        const single = await extractCardWithGemini(canvases[0]);
        return [single];
      }
      const cardsPayload = canvases.map((canvas, idx) => ({
        index: idx,
        imageBase64: canvas.toDataURL('image/jpeg', 0.82),
        mimeType: 'image/jpeg'
      }));
      const items = await postGeminiExtract('/api/extract-cards-batch', { cards: cardsPayload });
      const mapped = new Array(canvases.length).fill(null);
      if (Array.isArray(items)) {
        for (const item of items) {
          const idx = Number(item?.index);
          if (Number.isInteger(idx) && idx >= 0 && idx < canvases.length) {
            mapped[idx] = item;
          }
        }
      }
      return mapped;
    }

    async function processCardDataRows(rawRows, batchMeta = null) {
      const registry = await dbAll('registry');
      const existingRows = await dbAll('rows');
      let currentSn = existingRows.length;
      const batchId = batchMeta?.batchId || makeBatchId();
      const sourceFile = batchMeta?.sourceFile || '';
      const stagedCards = [];

      for (let rIdx = 0; rIdx < rawRows.length; rIdx++) {
        const r = rawRows[rIdx];
        const rawSn = Number(r.sn || getNormCol(r, ['sn', 'sno', 'serialno', 'serialnumber']));
        let name = getNormCol(r, ['name', 'fullname', 'full name', 'voter name', 'member name', 'beneficiary']);
        if (!name) {
          const sur = getNormCol(r, ['surname', 'lastname', 'familyname']);
          const fst = getNormCol(r, ['firstname', 'givenname']);
          const oth = getNormCol(r, ['othernames', 'othername', 'middlename']);
          name = [sur, fst, oth].filter(Boolean).join(' ').trim();
        }
        const portfolio = getNormCol(r, ['portfolio', 'mda', 'role', 'position', 'designation']);
        let stateName = getNormCol(r, ['state', 'statename']);
        let stateCode = getNormCol(r, ['statecode', 'state code']);
        let lga = getNormCol(r, ['lga', 'lganame', 'local government', 'local government area']);
        let lgaCode = getNormCol(r, ['lgacode', 'lga code']);
        let ward = getNormCol(r, ['ward', 'wardname', 'ra/ward', 'raward']);
        let wardCode = getNormCol(r, ['wardcode', 'ward code', 'racode']);
        let pu = getNormCol(r, ['pu', 'puname', 'polling unit', 'pollingunit', 'collation centre']);
        let puCode = getNormCol(r, ['pucode', 'pu code', 'pollingunitcode']);
        const fullCodeRaw = getNormCol(r, ['fullcode', 'full code', 'delimcode', 'delimitation', 'code']);
        let contact = getNormCol(r, ['contact', 'phone', 'phonenumber', 'phone number', 'mobile', 'gsm', 'telephone']);
        const vin = getNormCol(r, ['vin', 'voterid', 'voterno', '2ndcontact', '2nd contact', 'second contact', 'contact2', 'alternate phone']);
        const pvc = getNormCol(r, ['pvc', 'pvcstatus', 'cardstatus']);

        if (!name && !contact && !vin && !pvc && !lgaCode && !lga && !ward && !pu && !fullCodeRaw) continue;

        currentSn++;
        const resolvedSn = (Number.isInteger(rawSn) && rawSn > 0) ? rawSn : currentSn;
        if (contact) contact = normContactStr(contact);

        // Parse delimited code (fullCodeRaw or lgaCode containing dash/slash)
        const delimCandidate = fullCodeRaw || (lgaCode && /[-/]/.test(lgaCode) ? lgaCode : '');
        if (delimCandidate) {
          const parsed = normalizeAndParseDelimCode(delimCandidate);
          if (parsed) {
            stateCode = stateCode || parsed.stateCode;
            if (!lgaCode || /[-/]/.test(lgaCode)) lgaCode = parsed.lgaCode;
            wardCode = wardCode || parsed.wardCode;
            puCode = puCode || parsed.puCode;
          } else if (!lgaCode && /^\d{1,2}$/.test(fullCodeRaw.trim())) {
            lgaCode = fullCodeRaw.trim();
          }
        }

        const lgaDigits = String(lgaCode || '').replace(/\D/g, '');
        const wardDigits = String(wardCode || '').replace(/\D/g, '');
        const puDigits = String(puCode || '').replace(/\D/g, '');
        const stateDigits = String(stateCode || '').replace(/\D/g, '');
        if (stateDigits) stateCode = stateDigits.padStart(2, '0');
        if (lgaDigits) lgaCode = lgaDigits.padStart(2, '0');
        if (wardDigits) wardCode = wardDigits.padStart(2, '0');
        if (puDigits) puCode = puDigits.padStart(3, '0');

        // 1) Resolve location by code against registry
        const codeRes = resolveLocationByCode(registry, stateCode, lgaCode, wardCode, puCode);
        if (codeRes.matched) {
          stateName = stateName || codeRes.stateName;
          stateCode = stateCode || codeRes.stateCode;
          lga = codeRes.lgaName || lga || '';
          lgaCode = codeRes.lgaCode || lgaCode;
          ward = codeRes.wardName || ward || '';
          wardCode = codeRes.wardCode || wardCode;
          pu = codeRes.puName || pu || '';
          puCode = codeRes.puCode || puCode;
        }

        // 2) If codes were absent or incomplete, resolve by cell LGA/Ward/PU names against registry (never blind sheet tab name)
        if (!codeRes.matched || !codeRes.exactPuMatched) {
          const nameRes = resolveLocationByName(registry, stateName, lga, ward, pu);
          if (nameRes.matched) {
            stateName = stateName || nameRes.stateName;
            stateCode = stateCode || nameRes.stateCode;
            if (!lgaCode && nameRes.lgaCode) lgaCode = nameRes.lgaCode;
            if (!lga && nameRes.lgaName) lga = nameRes.lgaName;
            if (!wardCode && nameRes.wardCode) wardCode = nameRes.wardCode;
            if (!ward && nameRes.wardName) ward = nameRes.wardName;
            if (!puCode && nameRes.puCode) puCode = nameRes.puCode;
            if (!pu && nameRes.puName) pu = nameRes.puName;
          }
        }

        if (!name) name = "";
        const flags = computeRowFlags({ name, lgaCode, wardCode, puCode }, registry);

        const newRow = {
          sn: resolvedSn,
          name: name.toUpperCase(),
          portfolio: (portfolio || '').toUpperCase(),
          stateName: (stateName || '').toUpperCase(),
          stateCode: stateCode || '',
          lga: (lga || '').toUpperCase(),
          lgaCode: lgaCode || '',
          ward: (ward || '').toUpperCase(),
          wardCode: wardCode || '',
          pu: (pu || '').toUpperCase(),
          puCode: puCode || '',
          contact: contact || '',
          vin: (vin || '').toUpperCase(),
          contact2: (vin || '').toUpperCase(),
          pvc: (pvc || '').toUpperCase(),
          flags: flags,
          sync: 'pending',
          batchId: batchId,
          sourceFile: sourceFile,
          pageNumber: r._excelRow || (rIdx + 1),
          createdAt: new Date().toISOString()
        };

        stagedCards.push({ row: newRow, imageBlob: null });
      }

      // Persist import diagnostics if present
      const diag = batchMeta?.importDiagnostics || null;
      if (diag) {
        diag.totalSaved = 0;
        S.lastImportDiagnostics = diag;
      }

      if (stagedCards.length === 0 && rawRows.length === 0) {
        const warnCount = (diag?.skippedSheets?.length || 0) + (diag?.uninterpretableRows?.length || 0);
        if (warnCount > 0) {
          openModal('import-diagnostics');
        } else {
          toast(`No valid records found in ${sourceFile || 'file'}.`, 'warning', 4500);
        }
        return { total: 0, cleanCount: 0, flaggedCount: 0, cancelled: false, diagnostics: diag };
      }

      const result = await saveStagedCardsWithDeduplication(stagedCards, sourceFile);
      if (diag) {
        diag.totalSaved = result.total || 0;
        S.lastImportDiagnostics = diag;
      }

      if (!result.cancelled) {
        const warnCount = (diag?.skippedSheets?.length || 0) + (diag?.uninterpretableRows?.length || 0);
        toast(`Added ${result.total} card record(s) (${result.cleanCount} clean, ${result.flaggedCount} to review).`, "success", 3500);
        if (warnCount > 0) {
          openModal('import-diagnostics');
        }
      }
      return Object.assign({}, result, { diagnostics: diag });
    }

    // ─────────────────────────────────────────────────────────────────
    // CARD RECTANGLE DETECTION & CROPPING (UP TO 8 CARDS PER PAGE)
    // ─────────────────────────────────────────────────────────────────
    function detectCardRectangles(canvas, expectedCount = 0) {
      const W = canvas.width;
      const H = canvas.height;

      const sW = 320;
      const sH = Math.round((H / W) * sW);
      const tCanvas = document.createElement('canvas');
      tCanvas.width = sW;
      tCanvas.height = sH;
      const tCtx = tCanvas.getContext('2d');
      tCtx.drawImage(canvas, 0, 0, sW, sH);

      const imgData = tCtx.getImageData(0, 0, sW, sH);
      const d = imgData.data;
      const totalPixels = sW * sH;

      let borderLum = 0, borderCount = 0;
      for (let x = 0; x < sW; x += 3) {
        for (const y of [0, 1, 2, sH - 3, sH - 2, sH - 1]) {
          const idx = (y * sW + x) * 4;
          borderLum += 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          borderCount++;
        }
      }
      for (let y = 0; y < sH; y += 3) {
        for (const x of [0, 1, 2, sW - 3, sW - 2, sW - 1]) {
          const idx = (y * sW + x) * 4;
          borderLum += 0.299 * d[idx] + 0.587 * d[idx + 1] + 0.114 * d[idx + 2];
          borderCount++;
        }
      }
      const bgL = borderLum / Math.max(1, borderCount);
      const thresh = bgL < 100 ? 110 : (bgL < 180 ? 140 : 165);

      const isLight = new Uint8Array(totalPixels);
      for (let i = 0; i < totalPixels; i++) {
        const lum = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
        if (lum >= thresh) isLight[i] = 1;
      }

      const visited = new Uint8Array(totalPixels);
      const boxes = [];

      for (let y = 0; y < sH; y++) {
        for (let x = 0; x < sW; x++) {
          const idx = y * sW + x;
          if (!isLight[idx] || visited[idx]) continue;
          let minX = x, maxX = x, minY = y, maxY = y, pixelCount = 0;
          const q = [idx];
          visited[idx] = 1;
          let qIdx = 0;
          while (qIdx < q.length) {
            const curr = q[qIdx++];
            pixelCount++;
            const cx = curr % sW, cy = Math.floor(curr / sW);
            if (cx < minX) minX = cx;
            if (cx > maxX) maxX = cx;
            if (cy < minY) minY = cy;
            if (cy > maxY) maxY = cy;
            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nx = cx + dx, ny = cy + dy;
                if (nx < 0 || nx >= sW || ny < 0 || ny >= sH) continue;
                const nIdx = ny * sW + nx;
                if (isLight[nIdx] && !visited[nIdx]) {
                  visited[nIdx] = 1;
                  q.push(nIdx);
                }
              }
            }
          }
          const bw = maxX - minX + 1, bh = maxY - minY + 1;
          const bboxArea = bw * bh;
          const fillRatio = pixelCount / bboxArea;
          const aspect = bw / bh;
          const relativeArea = bboxArea / totalPixels;

          if (
            relativeArea >= 0.01 && relativeArea <= 0.92 &&
            aspect >= 0.55 && aspect <= 2.0 &&
            fillRatio >= 0.35 &&
            bw >= 30 && bh >= 20
          ) {
            const scX = W / sW, scY = H / sH;
            boxes.push({
              x: Math.max(0, Math.round(minX * scX)),
              y: Math.max(0, Math.round(minY * scY)),
              w: Math.min(W, Math.round(bw * scX)),
              h: Math.min(H, Math.round(bh * scY)),
              area: bboxArea,
              relativeArea: relativeArea
            });
          }
        }
      }

      function iou(a, b) {
        const oX = Math.max(0, Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x));
        const oY = Math.max(0, Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y));
        const inter = oX * oY;
        const denom = a.w * a.h + b.w * b.h - inter;
        return denom > 0 ? inter / denom : 0;
      }

      let merged = [];
      const used = new Set();
      for (let i = 0; i < boxes.length; i++) {
        if (used.has(i)) continue;
        let cur = { ...boxes[i] };
        used.add(i);
        for (let j = i + 1; j < boxes.length; j++) {
          if (used.has(j)) continue;
          if (iou(cur, boxes[j]) > 0.3) {
            const x1 = Math.min(cur.x, boxes[j].x);
            const y1 = Math.min(cur.y, boxes[j].y);
            const x2 = Math.max(cur.x + cur.w, boxes[j].x + boxes[j].w);
            const y2 = Math.max(cur.y + cur.h, boxes[j].y + boxes[j].h);
            cur = { x: x1, y: y1, w: x2 - x1, h: y2 - y1, area: (x2 - x1) * (y2 - y1) };
            used.add(j);
          }
        }
        merged.push(cur);
      }

      merged.sort((a, b) => {
        const tol = H * 0.06;
        if (Math.abs(a.y - b.y) > tol) return a.y - b.y;
        return a.x - b.x;
      });

      if (merged.length > 1) {
        const sizes = merged.map(b => b.w * b.h).sort((a, b) => a - b);
        const median = sizes[Math.floor(sizes.length / 2)];
        merged = merged.filter(b => (b.w * b.h) >= median * 0.4);
      }

      let result = merged.filter(b => b.w >= 150 && b.h >= 100);
      if (result.length === 0) {
        return generateGridFallback(W, H, Math.max(expectedCount || 1, 1)).slice(0, 8);
      }
      return result.slice(0, 8);
    }

    function generateGridFallback(W, H, count) {
      if (count <= 1) {
        return [{
          x: Math.round(W * 0.04),
          y: Math.round(H * 0.04),
          w: Math.round(W * 0.92),
          h: Math.round(H * 0.92)
        }];
      }
      let cols, rows;
      if (count === 2) { cols = 2; rows = 1; }
      else if (count === 3) { cols = 3; rows = 1; }
      else if (count === 4) { cols = 2; rows = 2; }
      else if (count <= 6) { cols = 2; rows = 3; }
      else { cols = 4; rows = 2; }
      const cellW = W / cols, cellH = H / rows, pad = 4;
      const boxes = [];
      for (let i = 0; i < count; i++) {
        const c = i % cols, r = Math.floor(i / cols);
        boxes.push({
          x: Math.round(c * cellW + pad),
          y: Math.round(r * cellH + pad),
          w: Math.round(cellW - pad * 2),
          h: Math.round(cellH - pad * 2)
        });
      }
      return boxes;
    }

    async function tryGeminiWithKey(apiKey, canvas) {
      const base64 = canvas.toDataURL('image/jpeg', 0.85).split(',')[1];
      const prompt = `Read this Nigerian INEC PVC. Return ONLY JSON:
{"name":"SURNAME, GIVEN (uppercase)","code":"SS-LL-WW-PPP or empty","vin":"VIN or empty","contact":"11-digit phone or empty","delim_lga":"","delim_ward":"","legible":{"name":"full|partial|none","code":"full|partial|none"}}
Use ? for unreadable characters, never guess. Ignore handwriting and fingers. No markdown.`;

      const models = ['gemini-1.5-flash', 'gemini-2.5-flash'];
      let lastRes = null;
      for (const model of models) {
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [
                { text: prompt },
                { inline_data: { mime_type: 'image/jpeg', data: base64 } }
              ]}],
              generationConfig: { temperature: 0, responseMimeType: 'application/json' }
            })
          }
        );

        lastRes = res;
        if (res.status === 404 && model === 'gemini-1.5-flash') {
          continue;
        }
        if (!res.ok) {
          const errorBody = await res.text();
          console.error("Gemini API Error:", res.status, errorBody.substring(0, 200));
          const err = new Error(`HTTP ${res.status}: ${errorBody.substring(0, 100)}`);
          err.status = res.status;
          throw err;
        }

        const json = await res.json();
        const text = (json.candidates?.[0]?.content?.parts?.[0]?.text || '')
          .replace(/^```(?:json)?\s*/i, '')
          .replace(/```\s*$/i, '')
          .trim();
        if (!text) {
          console.warn("Gemini returned empty text candidate:", JSON.stringify(json).substring(0, 200));
          return null;
        }
        const p = JSON.parse(text);
        return {
          name: (p.name || '').toUpperCase().trim(),
          code: (p.code || '').replace(/\//g, '-').trim(),
          vin: (p.vin || '').toUpperCase().replace(/\s+/g, ' ').trim(),
          contact: (p.contact || '').replace(/\D/g, '').trim(),
          delim_lga: (p.delim_lga || '').toUpperCase().trim(),
          delim_ward: (p.delim_ward || '').toUpperCase().trim()
        };
      }

      const err = new Error(`HTTP ${lastRes?.status || 500}`);
      err.status = lastRes?.status || 500;
      throw err;
    }

    // ─── Gemini key rotation (tries all 3 keys in order) ───
    async function callGeminiVision(canvas, onStatus = null) {
      S.currentEngine = 'gemini';
      const today = new Date().toISOString().slice(0, 10);
      const settings = await getSyncSettings();

      const keys = [
        { id: 1, key: settings.geminiApiKey1, exhausted: (await dbGet('settings', 'geminiKey1Exhausted'))?.value || '' },
        { id: 2, key: settings.geminiApiKey2, exhausted: (await dbGet('settings', 'geminiKey2Exhausted'))?.value || '' },
        { id: 3, key: settings.geminiApiKey3, exhausted: (await dbGet('settings', 'geminiKey3Exhausted'))?.value || '' }
      ];

      const configuredKeys = keys.filter(k => Boolean(k.key));
      const availableKeys = configuredKeys.filter(k => k.exhausted !== today);

      if (availableKeys.length === 0) {
        console.log("No Gemini keys available today.");
        S.activeKeyLabel = 'None';
        S.activeKeyStatus = configuredKeys.length === 0 ? 'unknown' : 'none';
        return null;
      }

      for (const k of availableKeys) {
        console.log(`Trying Gemini Key ${k.id}...`);
        S.activeKeyLabel = `Key ${k.id}`;
        S.activeKeyStatus = 'active';
        if (typeof onStatus === 'function') onStatus(`Reading card (Gemini Key ${k.id})...`, { keyId: k.id });
        try {
          const result = await tryGeminiWithKey(k.key, canvas);
          if (result && (result.name || result.code)) {
            console.log(`Key ${k.id} succeeded.`);
            if (typeof onStatus === 'function') onStatus(`Card read via Gemini Key ${k.id}`, { keyId: k.id, done: true });
            return result;
          }
          console.log(`Key ${k.id} returned empty data. Trying next key.`);
        } catch (err) {
          if (err.status === 429 || String(err).includes('quota') || String(err).includes('RESOURCE_EXHAUSTED')) {
            console.warn(`Key ${k.id} exhausted (429). Marking exhausted.`);
            await dbPut('settings', { key: `geminiKey${k.id}Exhausted`, value: today });
            S.activeKeyLabel = `Key ${k.id}`;
            S.activeKeyStatus = 'exhausted';
          } else {
            console.warn(`Key ${k.id} failed with non-quota error:`, err);
          }
        }
      }

      console.log("All Gemini keys failed or exhausted.");
      S.activeKeyLabel = 'None';
      S.activeKeyStatus = 'none';
      return null;
    }

    function parseCardTextFields(rawText = '') {
      const txt = String(rawText || '');
      const captionMatch = txt.match(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/);
      const codeMatch =
        txt.match(/(?:CODE|DELIM(?:ITATION)?)[:\s]+([0-9OB]{2}\s*[-–\/]\s*[0-9OB]{2}\s*[-–\/]\s*[0-9OB]{2}\s*[-–\/]\s*[0-9OB]{1,3})/i) ||
        txt.match(/\b([0-9OB]{2}\s*[-\/]\s*[0-9OB]{2}\s*[-\/]\s*[0-9OB]{2}\s*[-\/]\s*[0-9OB]{2,3})\b/i);
      const phoneMatch =
        txt.match(/\b(0[789][01]\d{8})\b/) ||
        txt.match(/(0\d{10})/);
      const vinMatch = txt.match(/VIN[:\s]*([A-Z0-9][A-Z0-9 \t]{10,26})/i);

      let name = captionMatch ? captionMatch[2].trim().toUpperCase() : '';
      if (!name) {
        const surnameM = txt.match(/SURNAME[:\s]*([A-Z][A-Z\s'\-]{1,40})/i);
        const firstM = txt.match(/(?:FIRST\s*NAME|OTHER\s*NAMES?|GIVEN\s*NAME)[:\s]*([A-Z][A-Z\s'\-]{1,40})/i);
        if (surnameM || firstM) {
          name = [surnameM?.[1] || '', firstM?.[1] || ''].join(' ').replace(/\s+/g, ' ').trim().toUpperCase();
        }
      }
      if (!name) {
        const nameLineM = txt.match(/(?:^|\n)\s*NAME[:\s]+([A-Z][A-Z\s'\-\.]{2,60})/i);
        if (nameLineM) name = nameLineM[1].replace(/\s+/g, ' ').trim().toUpperCase();
      }

      const lgaHint = captionMatch ? captionMatch[3].trim().toUpperCase() : '';
      const rawCode = codeMatch ? codeMatch[1].replace(/\s+/g, '').replace(/[\/–]/g, '-').toUpperCase() : '';
      const contact = phoneMatch ? phoneMatch[1] : '';
      const vin = vinMatch ? vinMatch[1].replace(/\s+/g, '').toUpperCase() : '';
      const sn = captionMatch ? parseInt(captionMatch[1], 10) : null;

      return { name, code: rawCode, vin, contact, delim_lga: lgaHint, sn };
    }

    // ─── Gemini-only extraction pipeline ───
    async function extractCardData(cardCanvas, boxText = '', onStatus = null) {
      let workingCanvas = cardCanvas;
      if (cardCanvas.width < 400) {
        const scale = 400 / Math.max(1, cardCanvas.width);
        const upscaled = document.createElement('canvas');
        upscaled.width = Math.round(cardCanvas.width * scale);
        upscaled.height = Math.round(cardCanvas.height * scale);
        upscaled.getContext('2d').drawImage(cardCanvas, 0, 0, upscaled.width, upscaled.height);
        workingCanvas = upscaled;
      }

      const rotation = await detectRotation(workingCanvas);
      const uprightCanvas = rotateCanvas(workingCanvas, rotation);
      console.log(`Rotation applied: ${rotation}°`);

      S.currentEngine = 'gemini';
      const parsed = await callGeminiVision(uprightCanvas, (statusMsg, meta) => {
        if (typeof onStatus === 'function') onStatus(statusMsg, { ...(meta || {}), rotation });
      });

      if (!parsed || (!parsed.name && !parsed.code)) {
        toast("⚠️ All Gemini API keys are exhausted. Cannot extract this card.", "error", 5000);
        return {
          name: '',
          code: '',
          vin: '',
          contact: '',
          delim_lga: '',
          delim_ward: '',
          sn: null,
          rotation_needed: rotation,
          uprightCanvas,
          _failed: true
        };
      }

      const boxHints = boxText ? parseCardTextFields(boxText) : {};
      const rawName = parsed.name || boxHints.name || '';
      const cleanName = rawName.replace(/[?\s]+/g, '').length === 0 ? '' : rawName;

      return {
        name: cleanName,
        code: parsed.code || boxHints.code || '',
        vin: parsed.vin || boxHints.vin || '',
        contact: parsed.contact || boxHints.contact || '',
        delim_lga: parsed.delim_lga || boxHints.delim_lga || '',
        delim_ward: parsed.delim_ward || '',
        sn: boxHints.sn || null,
        rotation_needed: rotation,
        uprightCanvas
      };
    }

    function cropCardCanvas(sourceCanvas, box) {
      const cropped = document.createElement('canvas');
      const maxW = 800;
      let cw = box.w;
      let ch = box.h;
      if (cw > maxW) {
        ch = Math.round((ch * maxW) / cw);
        cw = maxW;
      }
      cropped.width = Math.max(10, cw);
      cropped.height = Math.max(10, ch);
      const ctx = cropped.getContext('2d');
      ctx.drawImage(sourceCanvas, box.x, box.y, box.w, box.h, 0, 0, cropped.width, cropped.height);
      return cropped;
    }

    async function processPvcPdfFile(file, progRowId = null, batchMeta = null) {
      const batchId = batchMeta?.batchId || makeBatchId();
      const sourceFile = batchMeta?.sourceFile || file.name;
      if (!window.pdfjsLib) {
        if (progRowId) completeProgress(progRowId, false, "Failed — PDF library missing");
        toast("PDF.js library is not loaded. Please check your internet connection.", "error");
        return { total: 0, cleanCount: 0, flaggedCount: 0 };
      }

      S.processingCount = (S.processingCount || 0) + 1;
      S.processing = true;
      updateProgress(progRowId, 8, "Analyzing document...");

      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        const registry = await dbAll('registry');
        const numPages = pdf.numPages;
        const stagedCards = [];
        let cancelled = false;
        let cancelledUnprocessed = 0;

        updateProgress(progRowId, 12, `Analyzing document (${numPages} page${numPages === 1 ? '' : 's'})...`);

        for (let i = 1; i <= numPages; i++) {
          if (S.cancelProcessing?.[batchId]) {
            console.log("Processing cancelled by user.");
            cancelled = true;
            cancelledUnprocessed = Math.max(1, numPages - i + 1);
            break;
          }

          const basePct = 12 + ((i - 1) / Math.max(1, numPages)) * 80;
          updateProgress(progRowId, basePct, `Extracting page ${i} of ${numPages}...`);

          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 1.5 });

          // Render page to canvas
          const pageCanvas = document.createElement('canvas');
          pageCanvas.width = viewport.width;
          pageCanvas.height = viewport.height;
          const pCtx = pageCanvas.getContext('2d');
          await page.render({ canvasContext: pCtx, viewport: viewport }).promise;

          if (S.cancelProcessing?.[batchId]) {
            console.log("Processing cancelled by user.");
            cancelled = true;
            cancelledUnprocessed = Math.max(1, numPages - i + 1);
            break;
          }

          // Extract text items with coordinates (useful for expected card count & phone captions)
          const textContent = await page.getTextContent();
          const itemsWithPos = (textContent.items || []).map(it => {
            const pt = viewport.convertToViewportPoint(it.transform[4], it.transform[5]);
            return { str: it.str, x: pt[0], y: pt[1] };
          });

          const fullPageText = itemsWithPos.map(it => it.str).join(' ');
          const codeMatches = Array.from(fullPageText.matchAll(/CODE[:\s]+([0-9OB]{2})-([0-9OB]{2})-([0-9OB]{2})-([0-9OB]{1,3})/gi));
          const captionMatches = Array.from(fullPageText.matchAll(/(?:^|\n|\s*)(\d+)\.\s*(.+?)\s*[—\-]\s*([^\n\r]+)/g));
          const vinMatches = Array.from(fullPageText.matchAll(/VIN[:\s]+[A-Z0-9]+/gi));
          const expectedCount = Math.max(codeMatches.length, captionMatches.length, vinMatches.length, 1);

          // Detect individual card rectangles (up to 8 cards per page) with forced grid fallback
          let cardBoxes = detectCardRectangles(pageCanvas, expectedCount);
          if (cardBoxes.length === 1 && expectedCount >= 2) {
            cardBoxes = generateGridFallback(pageCanvas.width, pageCanvas.height, Math.min(8, expectedCount));
            console.log(`Page ${i}: Forced grid fallback -> ${cardBoxes.length} cards (expected ${expectedCount})`);
          }

          const cardCanvases = cardBoxes.map(box => cropCardCanvas(pageCanvas, box));

          const midPct = basePct + (40 / Math.max(1, numPages));
          updateProgress(
            progRowId,
            midPct,
            `Extracting page ${i} of ${numPages} — ${cardBoxes.length} card${cardBoxes.length === 1 ? '' : 's'} found`
          );

          for (let cIdx = 0; cIdx < cardBoxes.length; cIdx++) {
            if (S.cancelProcessing?.[batchId]) {
              console.log("Processing cancelled by user.");
              cancelled = true;
              cancelledUnprocessed = (cardBoxes.length - cIdx) + Math.max(0, numPages - i);
              break;
            }

            const box = cardBoxes[cIdx];
            const cardCanvas = cardCanvases[cIdx];

            const boxItems = itemsWithPos.filter(it =>
              it.x >= box.x - 25 && it.x <= box.x + box.w + 25 &&
              it.y >= box.y - 25 && it.y <= box.y + box.h + 25
            );
            const boxText = boxItems.map(it => it.str).join(' ');

            const cardPct = basePct + ((cIdx + 0.5) / Math.max(1, cardBoxes.length)) * (80 / Math.max(1, numPages));
            const extracted = await extractCardData(cardCanvas, boxText, (engineStatus, meta) => {
              const rotDeg = Number(meta?.rotation || 0);
              const pageLabel = rotDeg ? `Reading page ${i} (Rotated ${rotDeg}°)...` : `Reading page ${i}...`;
              updateProgress(progRowId, cardPct, `${pageLabel} · Card ${cIdx + 1}/${cardBoxes.length} — ${engineStatus}`);
            });

            if (S.cancelProcessing?.[batchId]) {
              console.log("Processing cancelled by user.");
              cancelled = true;
              cancelledUnprocessed = (cardBoxes.length - cIdx) + Math.max(0, numPages - i);
              break;
            }

            let uprightCanvas = extracted.uprightCanvas || rotateCanvas(cardCanvas, extracted.rotation_needed || 0);
            if (uprightCanvas.width > 800) {
              const scaled = document.createElement('canvas');
              scaled.width = 800;
              scaled.height = Math.round((uprightCanvas.height * 800) / uprightCanvas.width);
              scaled.getContext('2d').drawImage(uprightCanvas, 0, 0, scaled.width, scaled.height);
              uprightCanvas = scaled;
            }

            const resolvedLoc = resolveExtractedCardLocation(registry, extracted.code, extracted.name);
            const imageBlob = await new Promise((resolve) => {
              uprightCanvas.toBlob((blob) => resolve(blob || null), 'image/jpeg', 0.6);
            });

            stagedCards.push({
              row: {
                sn: extracted.sn,
                name: extracted.name,
                portfolio: '',
                stateName: resolvedLoc.stateName,
                stateCode: resolvedLoc.stateCode,
                lga: resolvedLoc.lga,
                lgaCode: resolvedLoc.lgaCode,
                ward: resolvedLoc.ward,
                wardCode: resolvedLoc.wardCode,
                pu: resolvedLoc.pu,
                puCode: resolvedLoc.puCode,
                contact: extracted.contact,
                vin: extracted.vin,
                contact2: extracted.vin,
                flags: resolvedLoc.flags,
                sync: 'pending',
                batchId: batchId,
                sourceFile: sourceFile,
                pageNumber: i,
                createdAt: new Date().toISOString()
              },
              imageBlob
            });

            // Yield to browser after each card so UI stays responsive
            await new Promise(resolve => setTimeout(resolve, 0));
          }

          if (cancelled) break;

          // Yield to browser every page so UI stays responsive
          await new Promise(resolve => setTimeout(resolve, 0));
        }

        if (cancelled) {
          let savedCount = 0;
          if (stagedCards.length > 0) {
            const partialResult = await saveStagedCardsWithDeduplication(stagedCards, sourceFile);
            savedCount = partialResult?.total || 0;
          }
          toast(`Scanning cancelled. ${savedCount} cards saved, ${cancelledUnprocessed} not processed.`, "info", 5000);
          return { total: savedCount, cleanCount: 0, flaggedCount: 0, cancelled: true };
        }

        updateProgress(progRowId, 95, `Checking for duplicates (${stagedCards.length} cards)...`);
        const dedupResult = await saveStagedCardsWithDeduplication(stagedCards, sourceFile);

        completeProgress(
          progRowId,
          true,
          dedupResult.cancelled
            ? "Import cancelled"
            : `Done — ${dedupResult.total} record${dedupResult.total === 1 ? '' : 's'} extracted`
        );
        return dedupResult;
      } catch (err) {
        console.error('processPvcPdfFile error:', err);
        completeProgress(progRowId, false, "Failed — check file");
        toast(`Error reading PDF (${file.name}): ${err.message}`, "error");
        return { total: 0, cleanCount: 0, flaggedCount: 0 };
      } finally {
        if (S.cancelProcessing) delete S.cancelProcessing[batchId];
        S.processingCount = Math.max(0, (S.processingCount || 1) - 1);
        S.processing = S.processingCount > 0;
        await updateHeaderStats();
        if (!S.processing) {
          await R();
        }
      }
    }

    function readFileAsImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = (err) => reject(err);
        reader.onload = (e) => {
          const img = new Image();
          img.onerror = (err) => reject(err);
          img.onload = () => resolve(img);
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function processPvcImageFile(file, progRowId = null, batchMeta = null) {

        let canvas = document.createElement('canvas');

        canvas.height = h;

        const extracted = await extractCardData(canvas, '', (engineStatus, meta) => {

          updateProgress(progRowId, 58, `${engineStatus}${rotNote}`);
        });
        await new Promise(resolve => setTimeout(resolve, 0));
        if (S.cancelProcessing?.[batchId]) {
          toast("Scanning cancelled. 0 cards saved, 1 not processed.", "info", 4000);
          return { total: 0, cleanCount: 0, flaggedCount: 0, cancelled: true };
        }
        let uprightCanvas = extracted.uprightCanvas || rotateCanvas(canvas, extracted.rotation_needed || 0);

        updateProgress(progRowId, 82, "Cross-referencing registry...");
        const registry = await dbAll('registry');
        const resolvedLoc = resolveExtractedCardLocation(registry, extracted.code, extracted.name);
        const flags = resolvedLoc.flags;

        const newRow = {
          sn: extracted.sn,
          name: extracted.name,
          portfolio: '',
          stateName: resolvedLoc.stateName,
          stateCode: resolvedLoc.stateCode,
          lga: resolvedLoc.lga,
          lgaCode: resolvedLoc.lgaCode,
          ward: resolvedLoc.ward,
          wardCode: resolvedLoc.wardCode,
          pu: resolvedLoc.pu,

          vin: extracted.vin,

          flags: flags,
          sync: 'pending',
          batchId: batchId,
          sourceFile: sourceFile,
          pageNumber: imagePageNum,
          createdAt: new Date().toISOString()
        };

        const existingRows = await dbAll('rows');
        const dupMatch = findDuplicateInList(newRow, existingRows);
        if (dupMatch) {
          const saveAnyway = await showDuplicateConfirmModal(dupMatch.existing, newRow, dupMatch.reason);
          if (!saveAnyway) {
            completeProgress(progRowId, true, "Discarded duplicate");
            toast("Duplicate card discarded.", "info", 2500);
            return { total: 0, cleanCount: 0, flaggedCount: 0, cancelled: true };
          }
          newRow.duplicateOf = dupMatch.existing.id;
          newRow.flags = [...flags.filter(f => f !== 'possible duplicate'), 'possible duplicate'];
        }

        const rowId = await enqueueRowInsert(async () => {
          const currRows = await dbAll('rows');
          if (!newRow.sn) newRow.sn = currRows.length + 1;
          return dbPut('rows', newRow);
        });

        // Downscale upright canvas for storage (max 800px wide, JPEG 0.6) & save blob
        if (uprightCanvas.width > 800) {
          const saveCanvas = document.createElement('canvas');
          const sw = 800;
          const sh = Math.round((uprightCanvas.height * 800) / uprightCanvas.width);
          saveCanvas.width = sw;
          saveCanvas.height = sh;
          saveCanvas.getContext('2d').drawImage(uprightCanvas, 0, 0, sw, sh);
          uprightCanvas = saveCanvas;
        }

        const blob = await new Promise((resolve) => uprightCanvas.toBlob((b) => resolve(b || null), 'image/jpeg', 0.6));
        if (blob) await dbPut('images', { rowId, blob });
        completeProgress(progRowId, true, "Done — 1 record extracted");
        const blocking = (newRow.flags || []).filter(f => f !== 'possible duplicate');
        return { total: 1, cleanCount: blocking.length === 0 ? 1 : 0, flaggedCount: blocking.length > 0 ? 1 : 0 };
      } catch (err) {
        completeProgress(progRowId, false, "Failed — check file");
        throw err;
      } finally {
        if (S.cancelProcessing) delete S.cancelProcessing[batchId];
        S.processingCount = Math.max(0, (S.processingCount || 1) - 1);
        S.processing = S.processingCount > 0;
        await updateHeaderStats();
        if (!S.processing) {
          await R();
        }
      }
    }
