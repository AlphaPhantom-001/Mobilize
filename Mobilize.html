    // Canvas Downscaler: max 800px wide, JPEG 0.6 (revokes temporary object URLs)
    async function prepareImageBase64(blob) {
      if (!blob) return '';
      return new Promise((resolve) => {
        const img = new Image();
        const objUrl = URL.createObjectURL(blob);
        img.onload = () => {
          URL.revokeObjectURL(objUrl);
          const maxW = 800;
          let w = img.width;
          let h = img.height;
          if (w > maxW) {
            h = Math.round((h * maxW) / w);
            w = maxW;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
          resolve(dataUrl);
        };
        img.onerror = () => {
          URL.revokeObjectURL(objUrl);
          resolve('');
        };
        img.src = objUrl;
      });
    }

    const SYNC_MAX_RETRIES = 3;
    const SYNC_TEXT_CHUNK_LIMIT = 20;
    const SYNC_IMAGE_CHUNK_LIMIT = 6;
    const SYNC_MAX_PAYLOAD_BYTES = 1500000; // ~1.5 MB safe POST payload limit for GAS
    const SYNC_RECONCILE_CHUNK_LIMIT = 500;

    function buildSyncUrlQuery(syncUrl, queryParams = {}) {
      const sep = syncUrl.includes('?') ? '&' : '?';
      const qs = Object.entries(queryParams)
        .filter(([, v]) => v !== undefined && v !== null && v !== '')
        .map(([k, v]) => `${encodeURIComponent(k)}=${encodeURIComponent(String(v))}`)
        .join('&');
      return qs ? `${syncUrl}${sep}${qs}` : syncUrl;
    }

    function serializeRowForSync(row, imageBase64 = '') {
      return {
        clientId: row.id !== undefined && row.id !== null ? String(row.id) : String(row.sn || ''),
        id: row.id,
        sn: row.sn || '',
        name: row.name || '',
        portfolio: row.portfolio || '',
        lga: row.lga || '',
        lgaCode: row.lgaCode || '',
        ward: row.ward || '',
        wardCode: row.wardCode || '',
        pu: row.pu || '',
        puCode: row.puCode || '',
        contact: row.contact || '',
        vin: row.vin || row.contact2 || '',
        pvc: row.pvc || '',
        imageUrl: row.imageUrl || '',
        imageData: imageBase64 || '',
        fileName: imageBase64 ? `row_${row.id}_${row.sn || '0'}.jpg` : ''
      };
    }

    function isTransientSyncError(err) {
      if (!err) return true;
      if (err.nonRetryable) return false;
      const status = Number(err.status || 0);
      if (status === 429 || (status >= 500 && status <= 599)) return true;
      if (status >= 400 && status < 500) return false;
      return true; // NetworkError, AbortError/timeout, connection drop
    }

    async function postParamsWithRetry(syncUrl, params, { timeoutMs = 65000, maxRetries = SYNC_MAX_RETRIES } = {}) {
      let lastErr = null;
      for (let attempt = 0; attempt <= maxRetries; attempt++) {
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
        try {
          const resp = await fetch(syncUrl, {
            method: 'POST',
            mode: 'cors',
            redirect: 'follow',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString(),
            signal: controller.signal
          });
          clearTimeout(timeoutId);

          const text = await resp.text();
          if (/ServiceLogin|accounts\.google\.com/i.test(text)) {
            const authErr = new Error('Apps Script requires login. Redeploy Web App with access "Anyone".');
            authErr.nonRetryable = true;
            authErr.status = 403;
            throw authErr;
          }

          if (!resp.ok) {
            const httpErr = new Error(`HTTP ${resp.status}`);
            httpErr.status = resp.status;
            throw httpErr;
          }

          try {
            return JSON.parse(text);
          } catch (parseErr) {
            const err = new Error('Invalid JSON response from Apps Script');
            err.nonRetryable = true;
            throw err;
          }
        } catch (err) {
          clearTimeout(timeoutId);
          lastErr = err?.name === 'AbortError'
            ? Object.assign(new Error('Request timed out'), { status: 504 })
            : err;

          if (attempt >= maxRetries || !isTransientSyncError(lastErr) || S.syncCancelRequested) {
            throw lastErr;
          }
          const delayMs = 800 * Math.pow(2, attempt) + Math.floor(Math.random() * 200);
          console.warn(`Sync retry ${attempt + 1}/${maxRetries} after ${delayMs}ms:`, lastErr?.message || lastErr);
          await new Promise(resolve => setTimeout(resolve, delayMs));
        }
      }
      throw lastErr;
    }

    async function fetchBackendCapabilities(settings, forceRefresh = false) {
      const url = (settings?.syncUrl || '').trim();
      if (!url) return { version: 1, batchAddRows: false, reconcileCheck: false };

      if (!S.syncCapabilitiesCache) S.syncCapabilitiesCache = {};
      const cached = S.syncCapabilitiesCache[url];
      if (!forceRefresh && cached && (Date.now() - cached.checkedAt) < 120000) {
        return cached.caps;
      }

      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 9000);
      try {
        const endpoint = buildSyncUrlQuery(url, { action: 'count', sheetId: settings.sheetId });
        const resp = await fetch(endpoint, { method: 'GET', mode: 'cors', redirect: 'follow', signal: controller.signal });
        clearTimeout(timeoutId);
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        if (typeof data.total === 'number') {
          S.cloudTotal = data.total;
          S.cloudTotalLastUpdated = Date.now();
        }
        const caps = {
          version: Number(data.version || 1),
          batchAddRows: Boolean(data?.capabilities?.batchAddRows || Number(data.version || 1) >= 2),
          reconcileCheck: Boolean(data?.capabilities?.reconcileCheck || Number(data.version || 1) >= 2),
          reconcileMeta: Boolean(data?.capabilities?.reconcileMeta || Number(data.version || 1) >= 2),
          sheetRevision: data.sheetRevision || '',
          total: typeof data.total === 'number' ? data.total : null
        };
        S.syncCapabilitiesCache[url] = { caps, checkedAt: Date.now() };
        return caps;
      } catch (err) {
        clearTimeout(timeoutId);
        console.warn('Capability check fallback (assuming v1):', err?.message || err);
        return cached ? cached.caps : { version: 1, batchAddRows: false, reconcileCheck: false };
      }
    }

    async function sendRowSyncRequest(row, imageBase64, settings) {
      const params = new URLSearchParams();
      params.append('action', 'addRow');
      if (settings && settings.sheetId) params.append('sheetId', settings.sheetId);
      if (settings && settings.folderId) params.append('folderId', settings.folderId);
      params.append('clientId', row.id !== undefined && row.id !== null ? String(row.id) : String(row.sn || ''));
      params.append('sn', row.sn || '');
      params.append('name', row.name || '');
      params.append('portfolio', row.portfolio || '');
      params.append('lga', row.lga || '');
      params.append('lgaCode', row.lgaCode || '');
      params.append('ward', row.ward || '');
      params.append('wardCode', row.wardCode || '');
      params.append('pu', row.pu || '');
      params.append('puCode', row.puCode || '');
      params.append('contact', row.contact || '');
      params.append('vin', row.vin || row.contact2 || '');
      params.append('pvc', row.pvc || '');
      params.append('imageData', imageBase64 || '');
      params.append('fileName', imageBase64 ? `row_${row.id}_${row.sn || '0'}.jpg` : '');

      return postParamsWithRetry(settings.syncUrl, params, { timeoutMs: 30000, maxRetries: 2 });
    }

    async function sendBatchSyncRequest(serializedRows, settings) {
      const params = new URLSearchParams();
      params.append('action', 'batchAddRows');
      if (settings && settings.sheetId) params.append('sheetId', settings.sheetId);
      if (settings && settings.folderId) params.append('folderId', settings.folderId);
      params.append('rowsJson', JSON.stringify(serializedRows));

      return postParamsWithRetry(settings.syncUrl, params, { timeoutMs: 75000, maxRetries: SYNC_MAX_RETRIES });
    }

    // Dynamic payload-aware chunker (prepares images lazily per chunk so memory stays low)
    async function planSyncChunks(targetRows) {
      const allImages = await dbAll('images');
      const imgSet = new Set();
      allImages.forEach(rec => {
        if (rec && rec.blob && rec.rowId !== undefined) imgSet.add(String(rec.rowId));
      });

      const chunks = [];
      let curr = [];
      let currHasImage = false;
      let estBytes = 0;

      for (const row of targetRows) {
        const hasImg = imgSet.has(String(row.id));
        const estRowBytes = hasImg ? 260000 : 650;
        const limitCount = (currHasImage || hasImg) ? SYNC_IMAGE_CHUNK_LIMIT : SYNC_TEXT_CHUNK_LIMIT;

        if (curr.length > 0 && (curr.length >= limitCount || (estBytes + estRowBytes) > SYNC_MAX_PAYLOAD_BYTES)) {
          chunks.push(curr);
          curr = [];
          currHasImage = false;
          estBytes = 0;
        }
        curr.push({ row, hasImg });
        if (hasImg) currHasImage = true;
        estBytes += estRowBytes;
      }
      if (curr.length > 0) chunks.push(curr);
      return chunks;
    }

    async function buildChunkPayloads(chunkEntries) {
      const concurrency = 4;
      const results = new Array(chunkEntries.length);
      let cursor = 0;
      const worker = async () => {
        while (cursor < chunkEntries.length) {
          const i = cursor++;
          const { row, hasImg } = chunkEntries[i];
          let base64 = '';
          if (hasImg) {
            const imgRec = await dbGet('images', row.id) || await dbGet('images', Number(row.id));
            if (imgRec && imgRec.blob) {
              base64 = await prepareImageBase64(imgRec.blob);
            }
          }
          results[i] = serializeRowForSync(row, base64);
        }
      };
      await Promise.all(Array.from({ length: Math.min(concurrency, chunkEntries.length) }, () => worker()));

      // Re-split only if encoded JSON still exceeds SYNC_MAX_PAYLOAD_BYTES
      const subBatches = [];
      let bucket = [];
      let bucketBytes = 2;
      for (const item of results) {
        const itemBytes = JSON.stringify(item).length + 2;
        if (bucket.length > 0 && (bucketBytes + itemBytes) > SYNC_MAX_PAYLOAD_BYTES) {
          subBatches.push(bucket);
          bucket = [];
          bucketBytes = 2;
        }
        bucket.push(item);
        bucketBytes += itemBytes;
      }
      if (bucket.length > 0) subBatches.push(bucket);
      return subBatches;
    }

    function cancelActiveSync() {
      if (!S.syncRunning) return;
      S.syncCancelRequested = true;
      updateBulkActionBar();
      document.querySelectorAll('.btn-sync-pending, .btn-sync-retry').forEach(btn => {
        btn.disabled = true;
      });
      toast("Stopping sync cleanly after the current batch completes...", "info", 3000);
    }

    function updateSyncButtonsText(text) {
      const bulkBtn = document.getElementById('btn-bulk-sync');
      if (bulkBtn) {
        bulkBtn.disabled = true;
        bulkBtn.textContent = text;
      }
      document.querySelectorAll('.btn-sync-pending, .btn-sync-retry').forEach(btn => {
        btn.disabled = true;
        btn.textContent = text;
      });
    }

    async function executeUnifiedSync(targetRows, { labelPrefix = 'Syncing', clearSelectionOnDone = false } = {}) {
      if (S.syncRunning) return;
      const settings = await getSyncSettings();
      if (!settings.syncUrl) {
        toast("Please set your Sync URL in Settings first.", "warning", 4000);
        openModal('settings');
        return;
      }
      if (!targetRows || targetRows.length === 0) {
        toast("Nothing to sync.", "info", 3500);
        return;
      }

      S.syncRunning = true;
      S.syncCancelRequested = false;
      const caps = await fetchBackendCapabilities(settings, true);
      const useBatch = Boolean(caps.batchAddRows);

      if (!useBatch && targetRows.length > 1) {
        toast("Apps Script v1 detected — syncing sequentially. Deploy updated Code.gs for high-speed batch sync.", "warning", 5000);
      }

      let syncedCount = 0;
      let updatedCount = 0;
      let failedCount = 0;
      let firstErrorMsg = '';
      let processedRows = 0;

      try {
        if (useBatch) {
          const plannedChunks = await planSyncChunks(targetRows);
          S.syncProgress = { current: 0, total: targetRows.length, batch: 0, batches: plannedChunks.length };
          updateBulkActionBar();
          await R();

          for (let bIdx = 0; bIdx < plannedChunks.length; bIdx++) {
            if (S.syncCancelRequested) break;

            const progressText = `Batch ${bIdx + 1}/${plannedChunks.length} (${processedRows}/${targetRows.length})…`;
            S.syncProgress = { current: processedRows, total: targetRows.length, batch: bIdx + 1, batches: plannedChunks.length };
            updateSyncButtonsText(progressText);

            const chunkRows = plannedChunks[bIdx].map(c => c.row);
            const payloads = await buildChunkPayloads(plannedChunks[bIdx]);
            const rowByClientId = new Map(chunkRows.map(r => [String(r.id !== undefined ? r.id : r.sn), r]));

            for (const subPayload of payloads) {
              if (S.syncCancelRequested) break;
              try {
                const res = await sendBatchSyncRequest(subPayload, settings);
                if (!res || res.result === 'error' || !Array.isArray(res.results)) {
                  throw new Error(res?.message || "Batch sync returned invalid response");
                }

                if (typeof res.sheetTotal === 'number') {
                  S.cloudTotal = res.sheetTotal;
                  S.cloudTotalLastUpdated = Date.now();
                }

                const nowIso = new Date().toISOString();
                const updatedDbRows = [];
                for (const item of res.results) {
                  const row = rowByClientId.get(String(item.clientId));
                  if (!row) continue;
                  if (item.result === 'success' || item.result === 'updated') {
                    row.sync = 'synced';
                    row.syncedAt = nowIso;
                    if (item.imageUrl) row.imageUrl = item.imageUrl;
                    if (res.sheetRevision) row.lastVerifiedRevision = res.sheetRevision;
                    delete row.syncError;
                    if (item.result === 'updated') updatedCount++;
                    else syncedCount++;
                  } else {
                    row.sync = 'error';
                    row.syncError = item.message || 'Record sync failed';
                    failedCount++;
                    if (!firstErrorMsg) firstErrorMsg = row.syncError;
                  }
                  updatedDbRows.push(row);
                }
                if (updatedDbRows.length > 0) {
                  await dbBulkPut('rows', updatedDbRows);
                }
              } catch (batchErr) {
                const errMsg = batchErr?.message || String(batchErr);
                if (!firstErrorMsg) firstErrorMsg = errMsg;
                console.warn(`Batch ${bIdx + 1} failed:`, errMsg);
                const errRows = [];
                for (const p of subPayload) {
                  const row = rowByClientId.get(String(p.clientId));
                  if (row) {
                    row.sync = 'error';
                    row.syncError = errMsg;
                    errRows.push(row);
                    failedCount++;
                  }
                }
                if (errRows.length > 0) await dbBulkPut('rows', errRows);
                if (batchErr?.nonRetryable) {
                  S.syncCancelRequested = true;
                  break;
                }
              }
              processedRows += subPayload.length;
              S.syncProgress = { current: processedRows, total: targetRows.length, batch: bIdx + 1, batches: plannedChunks.length };
              updateSyncButtonsText(`Batch ${bIdx + 1}/${plannedChunks.length} (${processedRows}/${targetRows.length})…`);
            }
          }
        } else {
          // Legacy v1 compatibility path (still faster — zero artificial 1200ms sleep + automatic retry)
          S.syncProgress = { current: 0, total: targetRows.length, batch: 1, batches: 1 };
          updateBulkActionBar();
          await R();

          for (let i = 0; i < targetRows.length; i++) {
            if (S.syncCancelRequested) break;
            const row = targetRows[i];
            const progressText = `${labelPrefix} ${i + 1} of ${targetRows.length}…`;
            S.syncProgress = { current: i + 1, total: targetRows.length, batch: 1, batches: 1 };
            updateSyncButtonsText(progressText);

            const imgRec = await dbGet('images', row.id) || await dbGet('images', Number(row.id));
            const base64 = imgRec ? await prepareImageBase64(imgRec.blob) : '';

            try {
              const res = await sendRowSyncRequest(row, base64, settings);
              if (res && (res.result === 'success' || res.result === 'updated')) {
                row.sync = 'synced';
                row.syncedAt = new Date().toISOString();
                if (res.imageUrl) row.imageUrl = res.imageUrl;
                delete row.syncError;
                await dbPut('rows', row);
                if (res.result === 'updated') updatedCount++;
                else syncedCount++;
              } else {
                const msg = res?.message || "Sync returned error";
                row.sync = 'error';
                row.syncError = msg;
                await dbPut('rows', row);
                failedCount++;
                if (!firstErrorMsg) firstErrorMsg = msg;
              }
            } catch (err) {
              const msg = err?.message || "Sync request failed";
              console.warn(`Sync failed for row #${row.sn || row.id}:`, msg);
              row.sync = 'error';
              row.syncError = msg;
              await dbPut('rows', row);
              failedCount++;
              if (!firstErrorMsg) firstErrorMsg = msg;
              if (err?.nonRetryable) {
                S.syncCancelRequested = true;
                break;
              }
            }
          }
        }
      } finally {
        const wasCancelled = S.syncCancelRequested;
        S.syncRunning = false;
        S.syncCancelRequested = false;
        S.syncProgress = null;
        if (clearSelectionOnDone) S.selectedRows.clear();

        if (syncedCount > 0 || updatedCount > 0) {
          S._skipNextCloudRefresh = false;
        }

        const cancelledNote = wasCancelled ? ' (stopped early — resume anytime with no duplicates)' : '';
        const errSuffix = firstErrorMsg ? ` First error: ${firstErrorMsg}` : '';
        if (failedCount === 0 && (syncedCount > 0 || updatedCount > 0)) {
          toast(`Sync complete ✓: ${syncedCount} new, ${updatedCount} updated.${cancelledNote}`, "success", 5000);
        } else if (syncedCount > 0 || updatedCount > 0) {
          toast(`Sync partial: ${syncedCount} new, ${updatedCount} updated, ${failedCount} failed.${cancelledNote}${errSuffix}`, "warning", 6500);
        } else if (wasCancelled && failedCount === 0) {
          toast("Sync stopped cleanly.", "info", 3000);
        } else {
          toast(`Sync failed (${failedCount} record${failedCount === 1 ? '' : 's'}).${errSuffix}`, "error", 6000);
        }
        await R(true);
      }
    }

    async function syncSingleRow(id) {
      if (S.syncRunning) return;
      const settings = await getSyncSettings();
      if (!settings.syncUrl) {
        toast("Please configure your Google Apps Script Sync URL in Settings first.", "warning");
        openModal('settings');
        return;
      }

      const row = await dbGet('rows', id);
      if (!row) return;
      const registry = await dbAll('registry');
      if (!isCleanRow(row, registry)) {
        toast("Cannot sync: row has flags or missing/unmatched LGA, Ward, or PU code. Fix in Review first.", "warning", 4500);
        return;
      }

      toast("Syncing row...", "info", 1500);
      const imgRec = await dbGet('images', id) || await dbGet('images', Number(id));
      const base64 = imgRec ? await prepareImageBase64(imgRec.blob) : '';

      try {
        const res = await sendRowSyncRequest(row, base64, settings);
        if (res && (res.result === 'success' || res.result === 'updated')) {
          row.sync = 'synced';
          row.syncedAt = new Date().toISOString();
          if (res.imageUrl) row.imageUrl = res.imageUrl;
          if (res.sheetRevision) row.lastVerifiedRevision = res.sheetRevision;
          delete row.syncError;
          await dbPut('rows', row);
          if (typeof res.sheetTotal === 'number') {
            S.cloudTotal = res.sheetTotal;
            S.cloudTotalLastUpdated = Date.now();
          }
          S._skipNextCloudRefresh = false;
          toast(
            res.result === 'updated'
              ? "Row updated in Google Sheets (duplicate prevented)!"
              : "Row synced successfully to Google Sheets & Drive!",
            "success"
          );
        } else {
          const msg = res?.message || "Sync returned error";
          row.sync = 'error';
          row.syncError = msg;
          await dbPut('rows', row);
          toast(`Sync failed: ${msg}`, "error", 4500);
        }
      } catch (err) {
        const msg = err?.message || "Sync failed";
        console.warn('Sync failed:', msg);
        row.sync = 'error';
        row.syncError = msg;
        await dbPut('rows', row);
        toast(!/failed to fetch/i.test(msg) ? `Sync failed: ${msg}` : "Sync failed. Check your connection and try again.", "error", 4500);
      }
      await RWithScrollPreserve();
    }

    async function startSyncPending(mode = 'clean') {
      if (S.syncRunning) return;

      const settings = await getSyncSettings();
      if (!settings.syncUrl) {
        toast("Configure Sync URL in Settings first.", "warning", 4000);
        openModal('settings');
        return;
      }

      const registry = await dbAll('registry');
      const allRows = await dbAll('rows');

      let candidates = [];
      if (mode === 'clean') {
        candidates = allRows.filter(r =>
          (r.sync === 'pending' || !r.sync) && isCleanRow(r, registry)
        );
      } else if (mode === 'error-only') {
        candidates = allRows.filter(r =>
          r.sync === 'error' && isCleanRow(r, registry)
        );
      }

      if (candidates.length === 0) {
        toast(
          mode === 'clean'
            ? "No clean pending rows. Fix review rows first."
            : "No fixed rows to retry. Fix errors in Review first.",
          "info",
          4000
        );
        return;
      }

      const ok = await askConfirm(
        `Sync ${candidates.length} ${mode === 'clean' ? 'clean' : 'fixed'} row${candidates.length === 1 ? '' : 's'} to Google Sheets in high-speed batches?`,
        {
          title: mode === 'clean' ? "Sync Clean Rows" : "Retry Failed Syncs",
          confirmLabel: `Sync ${candidates.length}`,
          danger: false
        }
      );
      if (!ok) return;

      await executeUnifiedSync(candidates, {
        labelPrefix: 'Syncing',
        clearSelectionOnDone: false
      });
    }

    function syncPendingRows(mode = 'clean') {
      return startSyncPending(mode);
    }

    async function unsyncFlaggedRows() {
      const registry = await dbAll('registry');
      const allRows = await dbAll('rows');
      const badSynced = allRows.filter(r => {
        if (r.sync !== 'synced') return false;
        const hasFlags = Array.isArray(r.flags) && r.flags.length > 0;
        const missingCodes = !r.lgaCode || !r.wardCode || !r.puCode;
        return hasFlags || missingCodes || !isCleanRow(r, registry);
      });

      if (badSynced.length === 0) {
        toast("No flagged or incomplete synced rows found.", "info", 3500);
        return;
      }

      for (const r of badSynced) {
        r.flags = computeRowFlags(r, registry);
        r.sync = 'pending';
        delete r.syncedAt;
        delete r.lastVerifiedRevision;
        await dbPut('rows', r);
      }

      toast(`${badSynced.length} rows marked as needs-review. Delete them from your Google Sheet manually.`, "warning", 6000);
      await R();
    }

    async function reconcileWithSheet() {
      const settings = await getSyncSettings();
      if (!settings.syncUrl) {
        toast("Sync URL not configured.", "error");
        return;
      }

      const localRows = await dbAll('rows');
      if (localRows.length === 0) {
        toast("No local records to reconcile.", "info", 3000);
        return;
      }

      toast("Checking Google Sheet metadata...", "info", 2000);
      const caps = await fetchBackendCapabilities(settings, true);
      const lastReconcile = (await dbGet('settings', 'lastReconcileMeta'))?.value || null;
      const serverRev = caps.reconcileCheck ? (caps.sheetRevision || '') : '';

      // Skip unnecessary work if sheet revision hasn't changed AND all synced rows were already verified at this revision
      const unverifiedLocal = serverRev
        ? localRows.filter(r => r.lastVerifiedRevision !== serverRev)
        : localRows;

      if (caps.reconcileCheck && lastReconcile && serverRev && lastReconcile.revision === serverRev && unverifiedLocal.length === 0) {
        toast(`Sheet revision unchanged (${caps.total ?? 0} rows). All ${localRows.length} local rows already verified.`, "success", 5000);
        return;
      }

      const modeDesc = caps.reconcileCheck
        ? `This will run fast fingerprint verification against the Google Sheet (${caps.total ?? '—'} rows) without downloading the full spreadsheet.`
        : "This will fetch records from the current Google Sheet and check which local rows are truly missing.";

      const proceed = await askConfirm(
        `${modeDesc} Continue?`,
        {
          title: "Reconcile with Google Sheet",
          confirmLabel: "Continue",
          danger: false
        }
      );
      if (!proceed) return;

      try {
        let missingList = [];
        let sheetTotal = 0;
        let finalRevision = serverRev;

        if (caps.reconcileCheck) {
          toast(`Verifying ${unverifiedLocal.length || localRows.length} local record fingerprints...`, "info", 3000);
          // Verify any rows not yet verified at current sheetRevision (or all if revision changed)
          const rowsToVerify = (lastReconcile && serverRev && lastReconcile.revision === serverRev)
            ? unverifiedLocal
            : localRows;

          const missingIdSet = new Set();
          const verifiedUpdates = [];
          const rowById = new Map(rowsToVerify.map(r => [String(r.id), r]));

          for (let i = 0; i < rowsToVerify.length; i += SYNC_RECONCILE_CHUNK_LIMIT) {
            const slice = rowsToVerify.slice(i, i + SYNC_RECONCILE_CHUNK_LIMIT);
            const fps = slice.map(r => ({
              id: r.id,
              vin: normVinStr(r.vin || r.contact2),
              name: normStr(r.name),
              puCode: pad3Str(r.puCode),
              lgaCode: pad2Str(r.lgaCode),
              contact: normContactStr(r.contact)
            }));

            const params = new URLSearchParams();
            params.append('action', 'reconcileCheck');
            if (settings.sheetId) params.append('sheetId', settings.sheetId);
            params.append('fingerprintsJson', JSON.stringify(fps));

            const res = await postParamsWithRetry(settings.syncUrl, params, { timeoutMs: 45000, maxRetries: 2 });
            if (!res || res.result === 'error') {
              throw new Error(res?.message || "Reconcile check failed");
            }
            if (typeof res.sheetTotal === 'number') sheetTotal = res.sheetTotal;
            if (res.sheetRevision) finalRevision = res.sheetRevision;

            for (const missId of (res.missingIds || [])) {
              missingIdSet.add(String(missId));
            }
            const metaMap = res.matchedMeta || {};
            for (const r of slice) {
              const sid = String(r.id);
              if (!missingIdSet.has(sid)) {
                const m = metaMap[sid];
                let changed = false;
                if (finalRevision && r.lastVerifiedRevision !== finalRevision) {
                  r.lastVerifiedRevision = finalRevision;
                  changed = true;
                }
                if (m && m.imageUrl && !r.imageUrl) {
                  r.imageUrl = m.imageUrl;
                  changed = true;
                }
                if (changed) verifiedUpdates.push(r);
              }
            }
          }

          if (verifiedUpdates.length > 0) {
            await dbBulkPut('rows', verifiedUpdates);
          }
          missingList = rowsToVerify.filter(r => missingIdSet.has(String(r.id)));
          S.cloudTotal = sheetTotal;
          S.cloudTotalLastUpdated = Date.now();
          await dbPut('settings', {
            key: 'lastReconcileMeta',
            value: { revision: finalRevision, total: sheetTotal, checkedAt: Date.now() }
          });
        } else {
          // Legacy v1 fallback: fetch full sheet rows
          toast("Fetching records from Google Sheet...", "info", 3000);
          const res = await fetch(settings.syncUrl, { method: 'GET', mode: 'cors', redirect: 'follow' });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          const sheetRows = data.rows || [];
          sheetTotal = sheetRows.length;

          const sheetFingerprints = new Set();
          sheetRows.forEach(r => {
            const vin = normVinStr(r.vin);
            const name = normStr(r.name);
            const puCode = pad3Str(r.puCode);
            const lgaCode = pad2Str(r.lgaCode);
            const contact = normContactStr(r.contact);

            if (vin) sheetFingerprints.add('VIN:' + vin);
            if (name && puCode !== '000') sheetFingerprints.add('NAME_PU:' + name + '|' + puCode);
            if (name && lgaCode !== '00' && contact) sheetFingerprints.add('NAME_LGA_CONTACT:' + name + '|' + lgaCode + '|' + contact);
          });

          for (const row of localRows) {
            const vin = normVinStr(row.vin || row.contact2);
            const name = normStr(row.name);
            const puCode = pad3Str(row.puCode);
            const lgaCode = pad2Str(row.lgaCode);
            const contact = normContactStr(row.contact);

            const matched =
              (vin && sheetFingerprints.has('VIN:' + vin)) ||
              (name && puCode !== '000' && sheetFingerprints.has('NAME_PU:' + name + '|' + puCode)) ||
              (name && lgaCode !== '00' && contact && sheetFingerprints.has('NAME_LGA_CONTACT:' + name + '|' + lgaCode + '|' + contact));

            if (!matched) missingList.push(row);
          }
        }

        if (missingList.length === 0) {
          toast(`All ${localRows.length} local rows exist in the sheet (${sheetTotal} rows). Nothing to resync.`, "success", 5000);
          return;
        }

        const preview = missingList.slice(0, 5).map((r, i) =>
          `${i + 1}. ${r.name || '(no name)'} | VIN: ${r.vin || '—'} | PU: ${r.puCode || '—'}`
        ).join('\n');

        const confirmMsg =
          `Google Sheet has ${sheetTotal} records.\n` +
          `Local app has ${localRows.length} records.\n\n` +
          `${missingList.length} local rows are MISSING from the sheet.\n\n` +
          `First 5 missing:\n${preview}\n\n` +
          `Reset these ${missingList.length} rows to 'pending'?\n\n` +
          `(Deep duplicate detection updates existing rows instead of creating duplicates.)`;

        const confirmReset = await askConfirm(confirmMsg, {
          title: "Missing Records Found",
          confirmLabel: `Reset ${missingList.length} to Pending`,
          danger: false
        });
        if (!confirmReset) return;

        for (const row of missingList) {
          row.sync = 'pending';
          delete row.lastVerifiedRevision;
        }
        await dbBulkPut('rows', missingList);

        toast(`Reset ${missingList.length} rows to 'pending'. Click "Sync" to upload them.`, "success", 6000);
        R(true);
      } catch (e) {
        console.error(e);
        toast("Reconcile failed: " + e.message, "error", 5000);
      }
    }

    async function testSyncUrl() {
      const input = document.getElementById('st-syncUrl');
      const statusEl = document.getElementById('st-test-status');
      const btn = document.getElementById('btn-test-sync-url');
      const url = input ? input.value.trim() : '';
      const sheetId = document.getElementById('st-sheetId')?.value.trim() || DEFAULT_SHEET_ID;

      if (!url) {
        if (statusEl) {
          statusEl.style.color = '#fca5a5';
          statusEl.textContent = '✗ Failed (CORS or URL wrong)';
        }
        toast("Please set your Sync URL in Settings first.", "warning");
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Testing…';
      }
      if (statusEl) {
        statusEl.style.color = 'var(--mist)';
        statusEl.textContent = 'Testing connection…';
      }

      const showConnected = (status, caps = null) => {
        const modeTag = caps && caps.batchAddRows
          ? `v2 Batch Sync Ready${typeof caps.total === 'number' ? ` · ${caps.total} rows` : ''}`
          : 'v1 Legacy — deploy Code.gs for batch sync';
        if (statusEl) {
          statusEl.style.color = caps && caps.batchAddRows ? '#34d399' : '#fde68a';
          statusEl.textContent = `✓ Connected (HTTP ${status} · ${modeTag})`;
        }
        toast(`✓ Connected to Sync URL (${modeTag})`, caps && caps.batchAddRows ? "success" : "warning", 4000);
      };

      const showFailed = (msg) => {
        if (statusEl) {
          statusEl.style.color = '#f87171';
          statusEl.textContent = msg;
        }
        toast(msg, "error", 4500);
      };

      try {
        if (window.location.protocol !== 'file:') {
          const proxyResp = await fetch('/api/test-sync-url', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ syncUrl: url })
          });
          if (proxyResp.status !== 404 && proxyResp.status !== 405) {
            const data = await proxyResp.json().catch(() => ({}));
            if (proxyResp.ok && data.ok) {
              const caps = await fetchBackendCapabilities({ syncUrl: url, sheetId }, true);
              showConnected(data.status || 200, caps);
            } else {
              showFailed(data.error ? `✗ ${data.error}` : `✗ Failed (HTTP ${data.status || proxyResp.status})`);
            }
            return;
          }
        }

        const resp = await fetch(buildSyncUrlQuery(url, { action: 'count', sheetId }), {
          method: 'GET',
          mode: 'cors',
          redirect: 'follow'
        });
        if (resp.ok) {
          const caps = await fetchBackendCapabilities({ syncUrl: url, sheetId }, true);
          showConnected(resp.status, caps);
        } else {
          showFailed(`✗ Failed (CORS or URL wrong) [HTTP ${resp.status}]`);
        }
      } catch (err) {
        console.warn('Test Sync URL failed:', err?.message || err);
        showFailed('✗ Failed (CORS or URL wrong)');
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = 'Test Connection';
        }
      }
    }

    // ─────────────────────────────────────────────────────────────────
    // MULTI-FORMAT FILE DISPATCHER & NON-BLOCKING PROGRESS DOCK
    // ─────────────────────────────────────────────────────────────────
    let progressSeq = 0;
    const progressTimers = new Map();
    const progressRetryMap = new Map();

    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return '';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function addProgressRow(fileName, fileSize, onRetry = null, batchId = null) {
      const dock = document.getElementById('progress-dock');
      if (!dock) return null;

      const rowId = `prog_${++progressSeq}_${Date.now()}`;
      const rowBatchId = batchId || rowId;
      if (typeof onRetry === 'function') {
        progressRetryMap.set(rowId, onRetry);
      }

      const sizeStr = formatFileSize(fileSize);
      const rowEl = document.createElement('div');
      rowEl.className = 'progress-row';
      rowEl.id = rowId;
      rowEl.dataset.batchId = rowBatchId;
      rowEl.innerHTML = `
        <div class="progress-row-head">
          <div class="progress-file-info">
            <span aria-hidden="true" style="font-size:14px; flex-shrink:0;">📄</span>
            <span class="progress-file-name" title="${escapeHtml(fileName)}">${escapeHtml(fileName)}</span>
            ${sizeStr ? `<span class="progress-file-size">${escapeHtml(sizeStr)}</span>` : ''}
          </div>
          <div class="progress-row-actions">
            <span id="${rowId}-badge"></span>
            <button type="button" class="progress-retry-btn" id="${rowId}-retry" style="display:none;" onclick="event.stopPropagation(); retryProgressRow('${rowId}')">Retry</button>
            <button type="button" class="progress-close-btn" id="${rowId}-close" onclick="event.stopPropagation(); cancelProgressRow('${rowId}', '${escapeHtml(rowBatchId)}', event)" title="Terminate / Dismiss">×</button>
          </div>
        </div>
        <div class="progress-track">
          <div class="progress-bar" id="${rowId}-bar" style="width: 6%;"></div>
        </div>
        <div class="progress-status is-processing" id="${rowId}-status">Analyzing document...</div>
      `;

      dock.appendChild(rowEl);
      dock.scrollTop = dock.scrollHeight;
      return rowId;
    }

    function cancelProgressRow(rowId, batchId, evt) {
      if (evt && typeof evt.stopPropagation === 'function') evt.stopPropagation();
      const row = document.getElementById(rowId);
      if (!row) return;

      // If already finished/errored/cancelled, dismiss immediately
      if (row.classList.contains('is-done') || row.classList.contains('is-error') || row.classList.contains('is-cancelled')) {
        dismissProgressRow(rowId);
        return;
      }

      const targetBatchId = batchId || row.dataset.batchId || rowId;
      if (!S.cancelProcessing) S.cancelProcessing = {};
      S.cancelProcessing[targetBatchId] = true;

      const status = document.getElementById(`${rowId}-status`);
      const bar = document.getElementById(`${rowId}-bar`);
      const closeBtn = document.getElementById(`${rowId}-close`);
      row.classList.add('is-cancelled');
      if (status) {
        status.classList.remove('is-processing');
        status.textContent = 'Cancelling...';
      }
      if (bar) {
        bar.style.background = '#64748b';
      }
      if (closeBtn) closeBtn.disabled = true;

      const prevTimer = progressTimers.get(rowId);
      if (prevTimer) clearTimeout(prevTimer);
      const timerId = setTimeout(() => {
        dismissProgressRow(rowId);
      }, 3000);
      progressTimers.set(rowId, timerId);
    }

    function updateProgress(rowId, percent, statusText) {
      if (!rowId) return;
      const row = document.getElementById(rowId);
      if (row && row.classList.contains('is-cancelled')) return;
      const clamped = Math.max(0, Math.min(100, Math.round(percent)));
      const bar = document.getElementById(`${rowId}-bar`);
      const status = document.getElementById(`${rowId}-status`);
      if (bar) bar.style.width = `${clamped}%`;
      if (status && statusText !== undefined) {
        status.textContent = statusText;
      }
    }

    function completeProgress(rowId, success, message) {
      if (!rowId) return;
      const row = document.getElementById(rowId);
      if (row && row.classList.contains('is-cancelled')) return;
      const bar = document.getElementById(`${rowId}-bar`);
      const status = document.getElementById(`${rowId}-status`);
      const badge = document.getElementById(`${rowId}-badge`);
      const closeBtn = document.getElementById(`${rowId}-close`);
      const retryBtn = document.getElementById(`${rowId}-retry`);

      if (!row) return;

      if (closeBtn) closeBtn.disabled = false;
      if (status) {
        status.classList.remove('is-processing');
        status.textContent = message || (success ? 'Done' : 'Failed — check file');
      }

      if (success) {
        row.classList.remove('is-error');
        row.classList.add('is-done');
        if (bar) bar.style.width = '100%';
        if (badge) badge.innerHTML = '<span class="progress-badge-ok" title="Done">✓</span>';
        if (retryBtn) retryBtn.style.display = 'none';

        const prevTimer = progressTimers.get(rowId);
        if (prevTimer) clearTimeout(prevTimer);
        const timerId = setTimeout(() => {
          dismissProgressRow(rowId);
        }, 5000);
        progressTimers.set(rowId, timerId);
      } else {
        row.classList.remove('is-done');
        row.classList.add('is-error');
        if (badge) badge.innerHTML = '<span class="progress-badge-err" title="Failed">✗</span>';
        if (retryBtn && progressRetryMap.has(rowId)) {
          retryBtn.style.display = 'inline-flex';
        }
      }
    }

    function dismissProgressRow(rowId) {
      const timerId = progressTimers.get(rowId);
      if (timerId) {
        clearTimeout(timerId);
        progressTimers.delete(rowId);
      }
      progressRetryMap.delete(rowId);
      const row = document.getElementById(rowId);
      if (!row) return;
      row.classList.add('fade-out');
      setTimeout(() => {
        row.remove();
      }, 360);
    }

    function retryProgressRow(rowId) {
      const retryFn = progressRetryMap.get(rowId);
      dismissProgressRow(rowId);
      if (typeof retryFn === 'function') {
        retryFn();
      }
    }

    // Mutex queue for concurrent multi-file IndexedDB row inserts so S/N stays strictly monotonic
    let rowInsertQueue = Promise.resolve();
    function enqueueRowInsert(taskFn) {
      const next = rowInsertQueue.then(taskFn, taskFn);
      rowInsertQueue = next.catch(() => {});
      return next;
    }

    async function refreshAfterBackgroundExtract() {
      await updateHeaderStats();
      const rows = await dbAll('rows');
      const mainCount = rows.filter(isMainTableRow).length;
      const reviewCount = rows.filter(isReviewRow).length;

      // Update subnav badges live without disturbing active input focus
      const subBtns = document.querySelectorAll('.subnav-btn');

    function classifyFileKind(fileName) {
      const name = (fileName || '').toLowerCase();
      if (name.endsWith('.doc')) return 'unsupported-doc';
      if (name.endsWith('.pdf')) return 'pdf';
      if (/\.(jpg|jpeg|png)$/.test(name)) return 'image';
      if (name.endsWith('.csv')) return 'csv';
      if (name.endsWith('.xlsx') || name.endsWith('.xls')) return 'xlsx';
      if (name.endsWith('.docx')) return 'docx';
      return 'unknown';
    }

    function dispatchUploadedFiles(fileList, tab) {
      const files = Array.from(fileList || []);
      if (files.length === 0) return;

      let imgUploadIdx = 0;
      files.forEach(file => {
        const kind = classifyFileKind(file.name);
        if (kind === 'unsupported-doc') {
          toast(`${file.name}: Old .doc files are not supported. Save as .docx or PDF first.`, "error", 5000);
          return;
        }
        if (tab === 'locations' && kind === 'image') {
          toast("Images not supported for locations. Upload Excel, CSV, PDF, or DOCX.", "error", 5000);
          return;
        }
        if (kind === 'unknown') {
          toast(`Unrecognised file type: ${file.name}`, "error", 5000);
          return;
        }
        const imageIndex = kind === 'image' ? ++imgUploadIdx : 1;
        const batchMeta = {
          batchId: makeBatchId(),
          sourceFile: file.name,
          pageNumber: imageIndex || 1
        };
        const rowId = addProgressRow(file.name, file.size, () => parseFile(file, tab, kind, imageIndex), batchMeta.batchId);
        // Immediately yield to browser and process file in background worker loop
        setTimeout(() => {
          parseFile(file, tab, kind, imageIndex, rowId, batchMeta);
        }, 0);
      });
    }

    async function handleFile(evt, tab) {
      const files = Array.from(evt.target.files || []);
      evt.target.value = ''; // Reset so the same file(s) can be selected again
      if (tab === 'locations') {
        const hasImage = files.some(f => classifyFileKind(f.name) === 'image');
        if (hasImage) {
          toast("Images not supported for locations. Upload Excel, CSV, PDF, or DOCX.", "error", 5000);
        }
        const nonImages = files.filter(f => classifyFileKind(f.name) !== 'image');
        if (nonImages.length === 0) return;
        dispatchUploadedFiles(nonImages, tab);
        return;
      }
      dispatchUploadedFiles(files, tab);
    }

    async function parseFile(file, tab, kind, imageIndex = 1, existingRowId = null, existingBatchMeta = null) {
      if (tab === "cards") {
        const batchMeta = existingBatchMeta || {
          batchId: makeBatchId(),
          sourceFile: file.name,
          pageNumber: imageIndex || 1
        };
        const rowId = existingRowId || addProgressRow(file.name, file.size, () => parseFile(file, tab, kind, imageIndex), batchMeta.batchId);
        try {
          if (S.cancelProcessing?.[batchMeta.batchId]) {
            toast("Scanning cancelled. 0 cards saved, 1 not processed.", "info", 4000);
            return;
          }
          let importStats = null;
          if (kind === "pdf") {
            importStats = await processPvcPdfFile(file, rowId, batchMeta);
          } else if (kind === "image") {
            importStats = await processPvcImageFile(file, rowId, batchMeta);
          } else if (kind === "csv") {
            S.processingCount = (S.processingCount || 0) + 1;
            S.processing = true;
            try {
              updateProgress(rowId, 35, "Parsing CSV rows...");
              await new Promise(resolve => setTimeout(resolve, 0));
              importStats = await parseCardsCsv(file, batchMeta);
              if (!S.cancelProcessing?.[batchMeta.batchId]) {
                completeProgress(rowId, true, `Done — ${importStats?.total || 0} record${(importStats?.total || 0) === 1 ? '' : 's'} extracted`);
              }
            } finally {
              S.processingCount = Math.max(0, (S.processingCount || 1) - 1);
              S.processing = S.processingCount > 0;
            }
            await refreshAfterBackgroundExtract();
          } else if (kind === "xlsx") {
            S.processingCount = (S.processingCount || 0) + 1;
            S.processing = true;
            try {
              updateProgress(rowId, 35, "Parsing Excel workbook...");
              await new Promise(resolve => setTimeout(resolve, 0));
              importStats = await parseCardsExcel(file, batchMeta);
              if (!S.cancelProcessing?.[batchMeta.batchId]) {
                completeProgress(rowId, true, `Done — ${importStats?.total || 0} record${(importStats?.total || 0) === 1 ? '' : 's'} extracted`);
              }
            } finally {
              S.processingCount = Math.max(0, (S.processingCount || 1) - 1);
              S.processing = S.processingCount > 0;
            }
            await refreshAfterBackgroundExtract();
          } else if (kind === "docx") {
            S.processingCount = (S.processingCount || 0) + 1;
            S.processing = true;
            try {
              updateProgress(rowId, 35, "Parsing Word table...");
              await new Promise(resolve => setTimeout(resolve, 0));
              importStats = await parseCardsDocx(file, batchMeta);
              if (!S.cancelProcessing?.[batchMeta.batchId]) {
                completeProgress(rowId, true, `Done — ${importStats?.total || 0} record${(importStats?.total || 0) === 1 ? '' : 's'} extracted`);
              }
            } finally {
              S.processingCount = Math.max(0, (S.processingCount || 1) - 1);
              S.processing = S.processingCount > 0;
            }
            await refreshAfterBackgroundExtract();
          }
        } catch (err) {
          console.error("parseFile error (cards):", err);
          completeProgress(rowId, false, "Failed — check file");
        } finally {
          if (S.cancelProcessing) delete S.cancelProcessing[batchMeta.batchId];
        }
        return;
      }

      if (tab === "locations") {
        const locBatchId = existingBatchMeta?.batchId || makeBatchId();
        const rowId = existingRowId || addProgressRow(file.name, file.size, () => parseFile(file, tab, kind), locBatchId);
        try {
          updateProgress(rowId, 28, "Analyzing document...");
          await new Promise(resolve => setTimeout(resolve, 0));
          if (S.cancelProcessing?.[locBatchId]) {
            toast("Scanning cancelled. 0 cards saved, 1 not processed.", "info", 4000);
            return;
          }
          let items = [];
          let unreadablePages = [];
          let importDiagnostics = null;
          if (kind === "pdf") {
            const res = await parseLocationPdf(file);
            items = res.items;
            unreadablePages = res.unreadablePages;
          } else if (kind === "image") {
            toast("Images not supported for locations. Upload Excel, CSV, PDF, or DOCX.", "error", 5000);
            completeProgress(rowId, false, "Unsupported image");
            return;
          } else if (kind === "csv") {
            items = await parseLocationCsv(file);
          } else if (kind === "xlsx") {
            const locRes = await parseLocationExcel(file, true);
            items = locRes.items;
            importDiagnostics = locRes.diagnostics;
          } else if (kind === "docx") {
            items = await parseLocationDocx(file);
          }

          if (!items || items.length === 0) {
            completeProgress(rowId, false, "Failed — no locations found");
            S.msg = (kind === "pdf")
              ? "PDF text layer unreadable. Please use the 'Add Location Manually' button instead."
              : ("No valid location rows could be extracted from " + file.name);
            toast(S.msg, "warning", 6000);
            R();
            return;
          }

          const diagWarn = (importDiagnostics?.skippedSheets?.length || 0) + (importDiagnostics?.uninterpretableRows?.length || 0);
          completeProgress(rowId, true, `Done — ${items.length} location${items.length === 1 ? '' : 's'} parsed${diagWarn > 0 ? ` (${diagWarn} warning${diagWarn === 1 ? '' : 's'})` : ''}`);

          // Open Import Preview modal before writing to registry
          S.importPreview = {
            fileName: file.name,
            items: items,
            unreadablePages: unreadablePages,
            diagnostics: importDiagnostics,
            fileRef: file
          };
          openModal('loc-preview');
        } catch (err) {
          console.error("parseFile error (locations):", err);
          completeProgress(rowId, false, "Failed — check file");
          S.msg = `Error reading ${file.name}: ${err.message}`;
          toast(S.msg, "error", 5000);
          R();
        }
      }
    }

    // Helper: case-insensitive column matcher
    function getNormCol(obj, aliases) {
      if (!obj) return '';
      const keys = Object.keys(obj);
      for (const alias of aliases) {
        const cleanAlias = alias.toLowerCase().replace(/[^a-z0-9]/g, '');
        const foundKey = keys.find(k => k.toLowerCase().replace(/[^a-z0-9]/g, '') === cleanAlias);
        if (foundKey && obj[foundKey] !== undefined && String(obj[foundKey]).trim() !== '') {
          return String(obj[foundKey]).trim();
        }
      }
      return '';
    }

    // Read a single SheetJS cell preserving leading zeros and avoiding scientific notation on integers
    function readSheetCellText(cell) {
      if (!cell) return '';
      if (cell.t === 's' || cell.t === 'str') {
        return String(cell.v ?? '').replace(/\s+/g, ' ').trim();
      }
      if (cell.t === 'n') {
        const formatted = cell.w !== undefined ? String(cell.w).trim() : '';
        if (formatted && !/[eE][+-]?\d+/.test(formatted)) {
          // Formatted string looks sane (e.g., preserves leading zero "0803..." or plain digits)
          if (/^0\d+$/.test(formatted) || /^\d+(?:-\d+)+$/.test(formatted) || /^\d+$/.test(formatted)) {
            return formatted;
          }
        }
        if (typeof cell.v === 'number' && Number.isFinite(cell.v)) {
          if (Math.abs(cell.v - Math.round(cell.v)) < 1e-9 && Math.abs(cell.v) < 1e15) {
            return String(Math.round(cell.v));
          }
          return String(cell.v);
        }
      }
      return String(cell.w ?? cell.v ?? '').replace(/\s+/g, ' ').trim();
    }

    // Expand SheetJS sheet into a 2D array with true !merges expansion
    function expandMergedCellsAoa(sheet) {
      if (!sheet) return [];
      const ref = sheet['!ref'];
      if (!ref) {
        return XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      }
      const range = XLSX.utils.decode_range(ref);
      const rowCount = Math.max(0, range.e.r - range.s.r + 1);
      const colCount = Math.max(0, range.e.c - range.s.c + 1);
      if (rowCount === 0 || colCount === 0) return [];

      // Cap huge empty trailing ranges
      const effectiveRows = Math.min(rowCount, 100000);
      const effectiveCols = Math.min(colCount, 200);
      const aoa = new Array(effectiveRows);
      for (let r = 0; r < effectiveRows; r++) {
        const rowArr = new Array(effectiveCols).fill('');
        for (let c = 0; c < effectiveCols; c++) {
          const addr = XLSX.utils.encode_cell({ r: range.s.r + r, c: range.s.c + c });
          const cell = sheet[addr];
          if (cell) {
            rowArr[c] = readSheetCellText(cell);
          }
        }
        aoa[r] = rowArr;
      }

      const merges = Array.isArray(sheet['!merges']) ? sheet['!merges'] : [];
      for (const m of merges) {
        const sr = m.s.r - range.s.r;
        const sc = m.s.c - range.s.c;
        const er = Math.min(effectiveRows - 1, m.e.r - range.s.r);
        const ec = Math.min(effectiveCols - 1, m.e.c - range.s.c);
        if (sr < 0 || sc < 0 || sr >= effectiveRows || sc >= effectiveCols) continue;
        const val = aoa[sr]?.[sc] ?? '';
        if (!val) continue;
        for (let r = sr; r <= er; r++) {
          for (let c = sc; c <= ec; c++) {
            if (!aoa[r][c]) aoa[r][c] = val;
          }
        }
      }

      // Trim completely empty trailing rows
      while (aoa.length > 0 && !aoa[aoa.length - 1].some(c => String(c ?? '').trim() !== '')) {
        aoa.pop();
      }
      return aoa;
    }

    function isExcelDataLikeRow(rowCells) {
      if (!Array.isArray(rowCells) || rowCells.length === 0) return false;
      return rowCells.some(raw => {
        const c = String(raw ?? '').replace(/\s+/g, ' ').trim();
        if (!c) return false;
        const compact = c.replace(/[\s\-()]/g, '');
        // Phone numbers (080..., 23480..., +234...)
        if (/^(?:\+?234|0)?[789]\d{9}$/.test(compact)) return true;
        // VIN / Voter ID strings (long alphanumeric with many digits)
        if (/^[A-Z0-9]{15,22}$/i.test(compact) && (compact.match(/\d/g) || []).length >= 5) return true;
        // Full INEC delimitation code (08-15-01-001)
        if (/^\d{2}[-\/]\d{2}[-\/]\d{2}[-\/]\d{1,3}$/.test(c)) return true;
        return false;
      });
    }

    function isSummaryOrFooterRow(cells) {
      const joined = cells.map(c => String(c ?? '').trim()).filter(Boolean).join(' ').toUpperCase();
      if (!joined) return true;
      if (/^(GRAND\s*)?(TOTAL|SUBTOTAL|SUMMARY)\b/.test(joined) && !/^(?:\+?234|0)?[789]\d{9}/.test(joined)) {
        return true;
      }
      return false;
    }

    function validateContinuationCompatibility(aoa, schema, minStartRow = 0) {
      if (!schema || !schema.colMap || !Array.isArray(aoa) || aoa.length <= minStartRow) {
        return { compatible: false, reason: 'Empty sheet or missing reference schema' };
      }
      const colMap = schema.colMap;
      const mappedIndices = Object.values(colMap).filter(v => typeof v === 'number' && v >= 0);
      if (mappedIndices.length === 0) {
        return { compatible: false, reason: 'Reference schema has no mapped columns' };
      }

      const sampleRows = [];
      let maxCols = 0;
      for (let r = minStartRow; r < aoa.length && sampleRows.length < 15; r++) {
        const rowArr = aoa[r] || [];
        if (rowArr.some(c => String(c ?? '').trim() !== '')) {
          sampleRows.push(rowArr);
          maxCols = Math.max(maxCols, rowArr.length);
        }
      }
      if (sampleRows.length === 0) {
        return { compatible: false, reason: 'Continuation sheet has no non-empty rows' };
      }

      // Check column width covers primary mapped columns
      const coreIndices = [colMap.name, colMap.surname, colMap.contact, colMap.vin, colMap.lgaName, colMap.lgaCode, colMap.fullCode]
        .filter(idx => idx >= 0);
      const reachableCore = coreIndices.filter(idx => idx < maxCols);
      if (reachableCore.length === 0 || (coreIndices.length >= 3 && reachableCore.length < 2)) {
        return { compatible: false, reason: `Sheet width (${maxCols} cols) does not cover prior layout columns` };
      }

      const colValues = (idx) => (idx >= 0 && idx < maxCols)
        ? sampleRows.map(r => String(r[idx] ?? '').trim()).filter(Boolean)
        : [];

      // Validate strict data types on every populated mapped column
      if (colMap.fullCode >= 0 && colMap.fullCode < maxCols) {
        const vals = colValues(colMap.fullCode);
        if (vals.length > 0 && !vals.some(v => /^\d{1,2}[-\/]\d{1,2}/.test(v) || /^\d{1,3}$/.test(v))) {
          return { compatible: false, reason: 'Delimitation/Code column does not contain code values' };
        }
      }

      if (colMap.sn >= 0 && colMap.sn < maxCols) {
        const snVals = colValues(colMap.sn);
        if (snVals.length >= 2) {
          const nonSerialCount = snVals.filter(v => v.length > 8 || !/^\d+$/.test(v)).length;
          if (nonSerialCount > snVals.length * 0.5) {
            return { compatible: false, reason: 'Column structure mismatch in S/N column — layout differs from previous sheet' };
          }
        }
      }

      for (const nameIdx of [colMap.name, colMap.surname, colMap.firstName]) {
        if (nameIdx >= 0 && nameIdx < maxCols) {
          const vals = colValues(nameIdx);
          if (vals.length > 0 && vals.every(v => !/[A-Za-z]{2,}/.test(v) || /^[\d.,]+$/.test(v))) {
            return { compatible: false, reason: 'Name column contains non-name / numeric values' };
          }
        }
      }

      for (const codeIdx of [colMap.lgaCode, colMap.wardCode, colMap.puCode]) {
        if (codeIdx >= 0 && codeIdx < maxCols) {
          const vals = colValues(codeIdx);
          if (vals.length > 0 && vals.every(v => !/\d/.test(v))) {
            return { compatible: false, reason: 'Location code column contains text instead of numeric codes' };
          }
        }
      }

      if (colMap.contact >= 0 && colMap.contact < maxCols) {
        const contactVals = colValues(colMap.contact);
        if (contactVals.length >= 2) {
          const phoneLike = contactVals.filter(v => /\d{7,}/.test(v.replace(/\D/g, ''))).length;
          if (phoneLike === 0) {
            return { compatible: false, reason: 'Column alignment mismatch in Contact column' };
          }
        }
      }

      // Verify at least 1 row produces usable fields under schema
      let validYield = 0;
      for (const r of sampleRows) {
        const g = (idx) => (idx >= 0 && idx < r.length) ? String(r[idx] ?? '').trim() : '';
        if (g(colMap.name) || g(colMap.surname) || g(colMap.contact) || g(colMap.vin) || g(colMap.lgaName) || g(colMap.fullCode) || g(colMap.puName)) {
          validYield++;
        }
      }
      if (validYield === 0) {
        return { compatible: false, reason: 'No extractable fields matched previous sheet column positions' };
      }

      return { compatible: true, reason: '' };
    }

    // Shared Multi-Row Merged-Header Sheet Parser (Title + Multi-Row Header + Sub-Header + Data)
    function extractStructuredRowsFromSheet(sheet, fallbackSchema = null, sheetName = '') {
      const aoa = expandMergedCellsAoa(sheet);
      if (!Array.isArray(aoa) || aoa.length === 0) {
        return { rows: [], detectedStateName: '', detectedStateCode: '', schema: null, skippedReason: '', uninterpretableRows: [] };
      }

      // 1. Scan up to first 30 rows to locate primary header row
      const keywordPatterns = [
        { key: 'name', re: /\b(full\s*name|fullname|voter\s*name|surname|first\s*name|other\s*names?|member\s*name|beneficiary|name)\b/ },
        { key: 'lga', re: /\b(l\s*g\s*a|local\s*gov(ernment)?(\s*area)?)\b/ },
        { key: 'ward', re: /\b(ward|ra\s*\/\s*ward|registration\s*area|ra)\b/ },
        { key: 'pu', re: /\b(polling\s*unit|p\s*u|collation\s*cent(er|re))\b/ },
        { key: 'contact', re: /\b(contact|phone(\s*no|\s*number)?|mobile|gsm|tel(ephone)?)\b/ },
        { key: 'portfolio', re: /\b(portfolio|mda|role|position|designation|office|ministry)\b/ },
        { key: 'sn', re: /\b(s\s*\/\s*n|s\s*no|serial(\s*no|\s*number)?)\b/ },
        { key: 'vin', re: /\b(vin|voter(\s*id|\s*number|\s*identification)?|card\s*no|2nd\s*contact|second\s*contact)\b/ },
        { key: 'pvc', re: /\b(pvc|pvc\s*status|card\s*status)\b/ },
        { key: 'delim', re: /\b(delim(itation)?|code(\s*no)?)\b/ }
      ];

      let headerIdx = -1;
      let bestScore = -1;
      const maxScan = Math.min(30, aoa.length);

      for (let r = 0; r < maxScan; r++) {
        const rowCells = (aoa[r] || []).map(c => String(c ?? '').replace(/\s+/g, ' ').trim());
        if (!rowCells.some(Boolean)) continue;
        if (isExcelDataLikeRow(rowCells)) continue;

        const matchedKeywords = new Set();
        for (const rawCell of rowCells) {
          const cell = rawCell.toLowerCase();
          if (!cell || cell.length > 56) continue;
          const cellNoDots = cell.replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
          for (const { key, re } of keywordPatterns) {
            if (re.test(cell) || re.test(cellNoDots)) {
              matchedKeywords.add(key);
            }
          }
        }
        const score = matchedKeywords.size;
        if (score > bestScore) {
          bestScore = score;
          headerIdx = r;
        }
      }

      // Check if sheet actually has a genuine header (>= 2 distinct column keywords)
      if (bestScore < 2 || headerIdx === -1) {
        if (fallbackSchema && fallbackSchema.colMap) {
          const compat = validateContinuationCompatibility(aoa, fallbackSchema, 0);
          if (compat.compatible) {
            const contRes = extractRowsUsingSchema(aoa, 0, fallbackSchema.colMap, fallbackSchema.detectedStateName, fallbackSchema.detectedStateCode, sheetName);
            contRes.isContinuation = true;
            return contRes;
          }
          return {
            rows: [],
            detectedStateName: '',
            detectedStateCode: '',
            schema: null,
            skippedReason: `No recognizable header row found, and sheet did not match previous layout (${compat.reason})`,
            uninterpretableRows: []
          };
        }
        if (fallbackSchema && Array.isArray(fallbackSchema.simpleKeys) && fallbackSchema.simpleKeys.length > 0) {
          const mappedRows = [];
          for (let r = 0; r < aoa.length; r++) {
            const rowArr = aoa[r] || [];
            if (!rowArr.some(c => String(c ?? '').trim() !== '')) continue;
            if (isSummaryOrFooterRow(rowArr)) continue;
            const obj = {};
            fallbackSchema.simpleKeys.forEach((k, idx) => {
              obj[k] = rowArr[idx] !== undefined ? rowArr[idx] : '';
            });
            mappedRows.push(obj);
          }
          return {
            rows: mappedRows,
            detectedStateName: fallbackSchema.detectedStateName || '',
            detectedStateCode: fallbackSchema.detectedStateCode || '',
            schema: fallbackSchema,
            isContinuation: true,
            skippedReason: '',
            uninterpretableRows: []
          };
        }

        // Last-resort check via sheet_to_json only if usable header keys exist
        const simpleRows = XLSX.utils.sheet_to_json(sheet, { defval: '' });
        const simpleKeys = simpleRows.length > 0 ? Object.keys(simpleRows[0]) : null;
        const hasUsableSimpleKeys = Array.isArray(simpleKeys) && simpleKeys.filter(k => /name|lga|ward|pu|polling|contact|phone|vin|pvc|code/i.test(k)).length >= 2;
        if (!hasUsableSimpleKeys) {
          return {
            rows: [],
            detectedStateName: '',
            detectedStateCode: '',
            schema: null,
            skippedReason: 'No recognizable column headers found in worksheet',
            uninterpretableRows: []
          };
        }
        const firstRowText = (aoa[0] || []).map(c => String(c ?? '')).join(' ').toUpperCase();
        const isBorno = firstRowText.includes('BORNO');
        return {
          rows: simpleRows,
          detectedStateName: isBorno ? 'BORNO' : '',
          detectedStateCode: isBorno ? '08' : '',
          schema: {
            simpleKeys,
            detectedStateName: isBorno ? 'BORNO' : '',
            detectedStateCode: isBorno ? '08' : ''
          },
          skippedReason: '',
          uninterpretableRows: []
        };
      }

      // 2. Detect up to 2 sub-header rows (for 2-row or 3-row stacked/merged headers)
      const isSubHeaderRow = (rowArr) => {
        if (!Array.isArray(rowArr) || !rowArr.some(c => String(c ?? '').trim() !== '')) return false;
        if (isExcelDataLikeRow(rowArr)) return false;
        let subHits = 0;
        let nonEmpty = 0;
        for (const cell of rowArr) {
          const s = String(cell ?? '').replace(/\s+/g, ' ').trim().toUpperCase();
          if (!s) continue;
          nonEmpty++;
          if (/^(NAME|CODE(\s*NO\.?)?|NO\.?|ID|NUMBER|TITLE|FIRST|LAST|SURNAME|OTHER|PHONE|VIN|PVC)$/.test(s) || /\bCODE\b|\bNAME\b|\bNO\.?\b/.test(s)) {
            subHits++;
          }
        }
        return subHits >= 2 || (nonEmpty > 0 && nonEmpty <= 6 && subHits === nonEmpty);
      };

      const headerRow = aoa[headerIdx] || [];
      let subRow1 = null;
      let subRow2 = null;
      let dataStartIdx = headerIdx + 1;

      if (headerIdx + 1 < aoa.length && isSubHeaderRow(aoa[headerIdx + 1])) {
        subRow1 = aoa[headerIdx + 1];
        dataStartIdx = headerIdx + 2;
        if (headerIdx + 2 < aoa.length && isSubHeaderRow(aoa[headerIdx + 2])) {
          subRow2 = aoa[headerIdx + 2];
          dataStartIdx = headerIdx + 3;
        }
      }

      // 3. Combine header + sub-header labels without duplicating vertically merged values
      const colCount = Math.max(
        headerRow.length,
        subRow1 ? subRow1.length : 0,
        subRow2 ? subRow2.length : 0
      );
      const mergedHeaders = [];
      let lastTopLabel = '';
      for (let i = 0; i < colCount; i++) {
        let top = String(headerRow[i] ?? '').replace(/\s+/g, ' ').trim();
        const mid = subRow1 ? String(subRow1[i] ?? '').replace(/\s+/g, ' ').trim() : '';
        const bot = subRow2 ? String(subRow2[i] ?? '').replace(/\s+/g, ' ').trim() : '';

        if (top) {
          lastTopLabel = top;
        } else if ((subRow1 && mid) || (subRow2 && bot)) {
          top = lastTopLabel;
        }

        const parts = [];
        [top, mid, bot].forEach(p => {
          if (!p) return;
          const up = p.toUpperCase();
          if (parts.length === 0 || parts[parts.length - 1] !== up) {
            parts.push(up);
          }
        });
        mergedHeaders[i] = parts.join(' ').replace(/\s+/g, ' ').trim();
      }

      // 4. Map merged headers to canonical field indices
      const colMap = {
        sn: -1,
        name: -1,
        surname: -1,
        firstName: -1,
        otherNames: -1,
        portfolio: -1,
        stateName: -1,
        stateCode: -1,
        lgaName: -1,
        lgaCode: -1,
        wardName: -1,
        wardCode: -1,
        puName: -1,
        puCode: -1,
        fullCode: -1,
        contact: -1,
        vin: -1,
        pvc: -1
      };

      const assignIfUnset = (field, idx) => {
        if (colMap[field] === -1) colMap[field] = idx;
      };

      const genericCodeCols = [];

      for (let i = 0; i < mergedHeaders.length; i++) {
        const h = mergedHeaders[i];
        if (!h) continue;
        const hNoDots = h.replace(/\./g, ' ').replace(/\s+/g, ' ').trim();

        if (/^(S\s*\/\s*N|S\s*NO\.?|SERIAL(\s*NO\.?|\s*NUMBER)?)$/.test(hNoDots)) { assignIfUnset('sn', i); continue; }
        if (/STATE.*CODE|^STATE\s*CODE$|^STATECODE$/.test(hNoDots)) { assignIfUnset('stateCode', i); continue; }
        if (/STATE.*NAME|^STATE$|^STATENAME$/.test(hNoDots)) { assignIfUnset('stateName', i); continue; }
        if (/FULL\s*CODE|DELIM.*CODE|^DELIMITATION$/.test(hNoDots)) { assignIfUnset('fullCode', i); continue; }
        if (/^(L\s*G\s*A|LOCAL\s*GOV(ERNMENT)?(\s*AREA)?)\s*(CODE(\s*NO\.?)?|NO\.?)$|^LGACODE$/.test(hNoDots) || /L\s*G\s*A.*CODE/.test(hNoDots)) {
          assignIfUnset('lgaCode', i); continue;
        }
        if (/^(RA\s*\/\s*WARD|WARD|RA)\s*(CODE(\s*NO\.?)?|NO\.?)$|^WARDCODE$/.test(hNoDots) || /WARD.*CODE/.test(hNoDots)) {
          assignIfUnset('wardCode', i); continue;
        }
        if (/^(POLLING\s*UNIT|P\s*U)\s*(CODE(\s*NO\.?)?|NO\.?)$|^PUCODE$/.test(hNoDots) || /POLLING\s*UNIT.*CODE/.test(hNoDots)) {
          assignIfUnset('puCode', i); continue;
        }

        if (/POLLING\s*UNIT.*NAME|^NAME OF POLLING UNIT$|^POLLING\s*UNIT$|^P\s*U(\s*NAME)?$|^PUNAME$|COLLATION\s*CENT(ER|RE)/.test(hNoDots)) {
          assignIfUnset('puName', i); continue;
        }
        if (/WARD.*NAME|^RA\s*\/?\s*WARD$|^WARD$|^WARDNAME$|^REGISTRATION\s*AREA$/.test(hNoDots)) {
          assignIfUnset('wardName', i); continue;
        }
        if (/L\s*G\s*A.*NAME|^L\s*G\s*A$|^LGANAME$|^LOCAL\s*GOV(ERNMENT)?(\s*AREA)?$/.test(hNoDots)) {
          assignIfUnset('lgaName', i); continue;
        }
        if (/^SURNAME$|^LAST\s*NAME$|^FAMILY\s*NAME$/.test(hNoDots)) {
          assignIfUnset('surname', i); continue;
        }
        if (/^FIRST\s*NAME$|^GIVEN\s*NAME$/.test(hNoDots)) {
          assignIfUnset('firstName', i); continue;
        }
        if (/^OTHER\s*NAMES?$|^MIDDLE\s*NAME$/.test(hNoDots)) {
          assignIfUnset('otherNames', i); continue;
        }
        if (/FULL\s*NAME|^FULLNAME$|^NAME$|VOTER\s*NAME|MEMBER\s*NAME|BENEFICIARY(\s*NAME)?/.test(hNoDots)) {
          assignIfUnset('name', i); continue;
        }
        if (/PORTFOLIO|MDA|^ROLE$|^POSITION$|DESIGNATION|^OFFICE$|MINISTRY/.test(hNoDots)) {
          assignIfUnset('portfolio', i); continue;
        }
        if (/2ND\s*CONTACT|SECOND\s*CONTACT|ALTERNATE\s*PHONE/.test(hNoDots)) {
          assignIfUnset('vin', i); continue;
        }
        if (/CONTACT|PHONE|MOBILE|GSM|^TEL(EPHONE)?(\s*NO\.?|\s*NUMBER)?$/.test(hNoDots)) {
          assignIfUnset('contact', i); continue;
        }
        if (/^PVC(\s*STATUS|\s*NO)?$|^CARD\s*STATUS$/.test(hNoDots)) {
          assignIfUnset('pvc', i); continue;
        }
        if (/^VIN$|VOTER.*ID|VOTER.*NO|VOTER.*NUMBER/.test(hNoDots)) {
          assignIfUnset('vin', i); continue;
        }
        if (/^(CODE(\s*NO\.?)?|NO\.?)$/.test(hNoDots)) {
          genericCodeCols.push(i);
          continue;
        }
      }

      // Contextual disambiguation for generic CODE / CODE NO columns using left neighbor + value patterns
      const sampleRows = aoa.slice(dataStartIdx, Math.min(aoa.length, dataStartIdx + 12));
      const isColDelimPattern = (idx) => {
        const vals = sampleRows.map(r => String(r[idx] ?? '').trim()).filter(Boolean);
        return vals.length > 0 && vals.filter(v => /^\d{2}[-\/]\d{2}[-\/]\d{2}[-\/]\d{1,3}$/.test(v)).length >= Math.ceil(vals.length * 0.5);
      };
      const isColMostlyNumeric = (idx) => {
        const vals = sampleRows.map(r => String(r[idx] ?? '').trim()).filter(Boolean);
        return vals.length > 0 && vals.every(v => /^\d{1,4}$/.test(v));
      };

      for (const idx of genericCodeCols) {
        if (isColDelimPattern(idx) && colMap.fullCode === -1) {
          colMap.fullCode = idx;
          continue;
        }
        if (colMap.lgaName === idx - 1 && colMap.lgaCode === -1) {
          colMap.lgaCode = idx;
          continue;
        }
        if (colMap.wardName === idx - 1 && colMap.wardCode === -1) {
          colMap.wardCode = idx;
          continue;
        }
        if (colMap.puName === idx - 1 && colMap.puCode === -1) {
          colMap.puCode = idx;
          continue;
        }
        // Fallback by column position relative to named columns
        if (colMap.lgaCode === -1 && (colMap.lgaName === -1 || idx > colMap.lgaName) && (colMap.wardName === -1 || idx < colMap.wardName)) {
          colMap.lgaCode = idx;
        } else if (colMap.wardCode === -1 && (colMap.wardName === -1 || idx > colMap.wardName) && (colMap.puName === -1 || idx < colMap.puName)) {
          colMap.wardCode = idx;
        } else if (colMap.puCode === -1) {
          colMap.puCode = idx;
        } else if (colMap.lgaCode === -1) {
          colMap.lgaCode = idx;
        } else if (colMap.fullCode === -1) {
          colMap.fullCode = idx;
        }
      }

      // Disambiguate when LGA / WARD / PU columns actually contain numeric codes rather than names
      if (colMap.lgaCode === -1 && colMap.lgaName >= 0 && isColMostlyNumeric(colMap.lgaName)) {
        colMap.lgaCode = colMap.lgaName;
        colMap.lgaName = -1;
      }
      if (colMap.wardCode === -1 && colMap.wardName >= 0 && isColMostlyNumeric(colMap.wardName)) {
        colMap.wardCode = colMap.wardName;
        colMap.wardName = -1;
      }
      if (colMap.puCode === -1 && colMap.puName >= 0 && isColMostlyNumeric(colMap.puName)) {
        colMap.puCode = colMap.puName;
        colMap.puName = -1;
      }

      // 5. State detection ONLY from explicit title/preamble rows above headerIdx (never blind from sheet tab name)
      let detectedStateName = '';
      let detectedStateCode = '';
      for (let r = 0; r < headerIdx; r++) {
        const rowTxt = (aoa[r] || []).map(c => String(c ?? '')).join(' ').toUpperCase();
        if (rowTxt.includes('BORNO')) {
          detectedStateName = 'BORNO';
          detectedStateCode = '08';
          break;
        }
      }

      return extractRowsUsingSchema(aoa, dataStartIdx, colMap, detectedStateName, detectedStateCode, sheetName);
    }

    function extractRowsUsingSchema(aoa, dataStartIdx, colMap, detectedStateName, detectedStateCode, sheetName = '') {
      const padDelimPart = (raw, len) => {
        const digits = String(raw ?? '').replace(/\D/g, '');
        return digits ? digits.padStart(len, '0') : '';
      };

      const rows = [];
      const uninterpretableRows = [];

      for (let r = dataStartIdx; r < aoa.length; r++) {
        const rowArr = aoa[r] || [];
        const hasAnyContent = rowArr.some(c => String(c ?? '').trim() !== '');
        if (!hasAnyContent) continue;
        if (isSummaryOrFooterRow(rowArr)) continue;

        const getCell = (idx) => (idx >= 0 && idx < rowArr.length) ? String(rowArr[idx] ?? '').replace(/\s+/g, ' ').trim() : '';

        const snRaw = getCell(colMap.sn);
        const snDigits = snRaw.replace(/\D/g, '');
        const parsedSn = (snDigits && Number(snDigits) > 0 && Number(snDigits) < 1000000) ? Number(snDigits) : '';

        let name = getCell(colMap.name);
        if (!name && (colMap.surname >= 0 || colMap.firstName >= 0 || colMap.otherNames >= 0)) {
          name = [getCell(colMap.surname), getCell(colMap.firstName), getCell(colMap.otherNames)].filter(Boolean).join(' ').replace(/\s+/g, ' ').trim();
        }
        const portfolio = getCell(colMap.portfolio);
        let stateName = getCell(colMap.stateName) || detectedStateName;
        let stateCodeRaw = getCell(colMap.stateCode);
        let stateCode = stateCodeRaw ? padDelimPart(stateCodeRaw, 2) : detectedStateCode;
        const lgaName = getCell(colMap.lgaName);
        let lgaCodeRaw = getCell(colMap.lgaCode);
        let wardCodeRaw = getCell(colMap.wardCode);
        let puCodeRaw = getCell(colMap.puCode);
        const wardName = getCell(colMap.wardName);
        const puName = getCell(colMap.puName);
        const fullCode = getCell(colMap.fullCode);
        let contact = getCell(colMap.contact);
        const vin = getCell(colMap.vin);
        const pvc = getCell(colMap.pvc);

        // Skip repeated header row (on continuation sheets or page breaks)
        if (/^(NAME|FULL\s*NAME|VOTER\s*NAME|SURNAME)$/i.test(name) && (!lgaName || /^(L\.?G\.?A\.?(\s*NAME)?)$/i.test(lgaName))) {
          continue;
        }
        if (/^(PORTFOLIO|MDA)$/i.test(portfolio) && /^(WARD|RA)$/i.test(wardName)) {
          continue;
        }

        // Preserve any record with at least one substantive identity, contact, or location field
        const hasSubstantiveData = Boolean(
          name || contact || vin || pvc || lgaName || wardName || puName || lgaCodeRaw || wardCodeRaw || puCodeRaw || fullCode
        );
        if (!hasSubstantiveData) {
          const nonEmptyCells = rowArr.map(c => String(c ?? '').trim()).filter(Boolean);
          // Skip solitary row numbers like "12" with no other data
          if (nonEmptyCells.length > 1 || (nonEmptyCells.length === 1 && nonEmptyCells[0].length > 4 && !/^\d+$/.test(nonEmptyCells[0]))) {
            uninterpretableRows.push({
              sheetName: sheetName || 'Sheet',
              excelRow: r + 1,
              rawPreview: nonEmptyCells.slice(0, 6).join(' | '),
              reason: 'Row contained text outside all recognized columns'
            });
          }
          continue;
        }

        // Normalize Nigerian phone numbers missing leading 0 due to Excel numeric formatting
        if (contact) {
          contact = normContactStr(contact);
        }

        let lgaCode = '';
        let wardCode = '';
        let puCode = '';

        // Parse delimited fullCode OR combined code in lgaCodeRaw
        const delimCandidate = fullCode || (lgaCodeRaw && /[-/]/.test(lgaCodeRaw) ? lgaCodeRaw : '');
        if (delimCandidate) {
          const parsedDelim = normalizeAndParseDelimCode(delimCandidate);
          if (parsedDelim) {
            stateCode = stateCode || parsedDelim.stateCode;
            lgaCode = parsedDelim.lgaCode;
            wardCode = wardCodeRaw ? padDelimPart(wardCodeRaw, 2) : parsedDelim.wardCode;
            puCode = puCodeRaw ? padDelimPart(puCodeRaw, 3) : parsedDelim.puCode;
          }
        }
