    // ─────────────────────────────────────────────────────────────────
    // PARSERS: LOCATIONS (PDF, XLSX, CSV, DOCX, JPG/PNG — ALL ROWS, NO COLLAPSING)
    // ─────────────────────────────────────────────────────────────────
    function extractPdfPageLines(textContentItems) {
      const items = (textContentItems || [])
        .map(it => ({
          str: String(it.str || ''),
          x: it.transform ? Number(it.transform[4] || 0) : 0,
          y: it.transform ? Number(it.transform[5] || 0) : 0,
          w: Number(it.width || 0)
        }))
        .filter(it => it.str.trim().length > 0);
      if (items.length === 0) return '';

      // Group items into horizontal lines by Y coordinate (PDF Y increases upward)
      items.sort((a, b) => (b.y - a.y) || (a.x - b.x));
      const lines = [];
      let currentLine = [];
      let currentY = null;

      for (const it of items) {
        if (currentY === null || Math.abs(it.y - currentY) <= 4.5) {
          currentLine.push(it);
          if (currentY === null) currentY = it.y;
        } else {
          lines.push(currentLine);
          currentLine = [it];
          currentY = it.y;
        }
      }
      if (currentLine.length > 0) lines.push(currentLine);

      return lines.map(lineItems => {
        lineItems.sort((a, b) => a.x - b.x);
        let out = '';
        let prevEnd = null;
        for (const it of lineItems) {
          if (prevEnd !== null) {
            const gap = it.x - prevEnd;
            out += gap > 14 ? '\t' : ' ';
          }
          out += it.str.trim();
          prevEnd = it.x + (it.w || it.str.length * 4.5);
        }
        return out;
      }).join('\n');
    }

    async function parseLocationPdf(file) {
      if (!window.pdfjsLib) {
        return { items: [], unreadablePages: [] };
      }
      try {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = "";
        const unreadablePages = [];

        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          const pageText = extractPdfPageLines(textContent.items || []);

          if (pageText.trim().length < 20) {
            unreadablePages.push(i);
          } else {
            fullText += '\n' + pageText;
          }
        }

        const items = parseLocationTextTable(fullText);
        console.log(`parseLocationPdf: extracted ${items.length} rows`);
        return { items, unreadablePages };
      } catch (err) {
        console.warn("parseLocationPdf error:", err);
        return { items: [], unreadablePages: [] };
      }
    }

    function buildLocationEntry(raw) {
      let stateName = String(raw.stateName || '').trim().toUpperCase() || 'BORNO';
      let pState = String(raw.stateCode || '').trim();
      let pLga = String(raw.lgaCode || '').trim();
      let pWard = String(raw.wardCode || '').trim();
      let pPu = String(raw.puCode || '').trim();
      const fullCode = String(raw.fullCode || '').trim();

      if (fullCode && (fullCode.includes('/') || fullCode.includes('-'))) {
        const parts = fullCode.split(/[\/\-]/).map(p => p.trim());
        if (parts.length === 4) {
          pState = pState || parts[0];
          pLga = pLga || parts[1];
          pWard = pWard || parts[2];
          pPu = pPu || parts[3];
        }
      }

      if (!pState && stateName === 'BORNO') pState = '08';

      const stateCode = pad2(pState);
      const lgaCode = pad2(pLga);
      const wardCode = pad2(pWard);
      const puCode = pad3(pPu);
      const computedFull = fullCode || ((stateCode || lgaCode || wardCode || puCode)
        ? `${stateCode}/${lgaCode}/${wardCode}/${puCode}`
        : '');

      return {
        stateName,
        stateCode,
        lgaName: String(raw.lgaName || '').trim().toUpperCase(),
        lgaCode,
        wardName: String(raw.wardName || '').trim().toUpperCase(),
        wardCode,
        puName: String(raw.puName || '').trim().toUpperCase(),
        puCode,
        fullCode: computedFull
      };
    }

    function mapLocationHeaderColumns(rawHeaders, sampleRows = []) {
      const headers = rawHeaders.map(h => String(h || '').trim().toLowerCase().replace(/[^a-z0-9]/g, ''));

      const findColExactOrPartial = (aliases, excludeSet = new Set(), allowReverseIncludes = false) => {
        for (const a of aliases) {
          const cleanA = a.replace(/[^a-z0-9]/g, '');
          const idx = headers.findIndex((h, i) => !excludeSet.has(i) && h === cleanA);
          if (idx >= 0) return idx;
        }
        for (const a of aliases) {
          const cleanA = a.replace(/[^a-z0-9]/g, '');
          if (cleanA.length < 4) continue;
          const idx = headers.findIndex((h, i) => !excludeSet.has(i) && h && (h.includes(cleanA) || (allowReverseIncludes && cleanA.includes(h) && h.length >= 2)));
          if (idx >= 0) return idx;
        }
        return -1;
      };

      const used = new Set();
      const colStateCode = findColExactOrPartial(['statecode', 'state code', 'statecodeno'], used);
      if (colStateCode >= 0) used.add(colStateCode);

      const colStateName = findColExactOrPartial(['statename', 'state name', 'state'], used);
      if (colStateName >= 0) used.add(colStateName);

      let colLgaCode = findColExactOrPartial(['lgacode', 'lga code', 'lgacodeno'], used);
      if (colLgaCode >= 0) used.add(colLgaCode);

      const colLgaName = findColExactOrPartial(['lganame', 'lga name', 'localgovernment', 'local government', 'lga'], used);
      if (colLgaName >= 0) used.add(colLgaName);

      let colWardCode = findColExactOrPartial(['wardcode', 'ward code', 'racode', 'ra code', 'wardcodeno'], used);
      if (colWardCode >= 0) used.add(colWardCode);

      const colWardName = findColExactOrPartial(['wardname', 'ward name', 'raward', 'ward', 'ra'], used);
      if (colWardName >= 0) used.add(colWardName);

      let colPuCode = findColExactOrPartial(['pucode', 'pu code', 'pollingunitcode', 'polling unit code', 'pucodeno'], used);
      if (colPuCode >= 0) used.add(colPuCode);

      const colPuName = findColExactOrPartial(['puname', 'pu name', 'pollingunitname', 'polling unit name', 'pollingunit', 'polling unit', 'name of polling unit', 'collationcentre', 'pu'], used);
      if (colPuName >= 0) used.add(colPuName);

      let colFullCode = findColExactOrPartial(['fullcode', 'full code', 'delimcode', 'delim code', 'delimitation', 'delimitationcode'], used);
      if (colFullCode >= 0) used.add(colFullCode);

      // Contextually resolve any generic "code" / "code no" columns by left neighbor & sample values
      for (let i = 0; i < headers.length; i++) {
        if (used.has(i)) continue;
        if (headers[i] !== 'code' && headers[i] !== 'codeno') continue;
        const vals = sampleRows.slice(0, 8).map(r => String(r[i] ?? '').trim()).filter(Boolean);
        const isDelim = vals.length > 0 && vals.filter(v => /^\d{2}[-\/]\d{2}[-\/]\d{2}[-\/]\d{1,3}$/.test(v)).length >= Math.ceil(vals.length * 0.5);
        if (isDelim && colFullCode < 0) {
          colFullCode = i;
          used.add(i);
          continue;
        }
        if (colLgaName === i - 1 && colLgaCode < 0) {
          colLgaCode = i;
          used.add(i);
        } else if (colWardName === i - 1 && colWardCode < 0) {
          colWardCode = i;
          used.add(i);
        } else if (colPuName === i - 1 && colPuCode < 0) {
          colPuCode = i;
          used.add(i);
        } else if (colFullCode < 0) {
          colFullCode = i;
          used.add(i);
        }
      }

      // Disambiguate single generic columns (e.g. "LGA" containing numeric codes vs names)
      const isMostlyNumeric = (colIdx) => {
        if (colIdx < 0 || !sampleRows.length) return false;
        const vals = sampleRows.slice(0, 8).map(r => String(r[colIdx] || '').trim()).filter(Boolean);
        return vals.length > 0 && vals.every(v => /^\d{1,4}$/.test(v));
      };

      let finalLgaCode = colLgaCode, finalLgaName = colLgaName;
      if (finalLgaCode < 0 && finalLgaName >= 0 && isMostlyNumeric(finalLgaName)) {
        finalLgaCode = finalLgaName;
        finalLgaName = -1;
      }
      let finalWardCode = colWardCode, finalWardName = colWardName;
      if (finalWardCode < 0 && finalWardName >= 0 && isMostlyNumeric(finalWardName)) {
        finalWardCode = finalWardName;
        finalWardName = -1;
      }
      let finalPuCode = colPuCode, finalPuName = colPuName;
      if (finalPuCode < 0 && finalPuName >= 0 && isMostlyNumeric(finalPuName)) {
        finalPuCode = finalPuName;
        finalPuName = -1;
      }

      return {
        colStateCode,
        colStateName,
        colLgaCode: finalLgaCode,
        colLgaName: finalLgaName,
        colWardCode: finalWardCode,
        colWardName: finalWardName,
        colPuCode: finalPuCode,
        colPuName: finalPuName,
        colFullCode
      };
    }

    function extractLocationRowsWithSchema(aoa, fallbackCols = null, sheetName = '') {
      if (!Array.isArray(aoa) || aoa.length === 0) return { items: [], cols: null, isContinuation: false, skippedReason: '', uninterpretableRows: [] };

      // Scan up to 25 rows to locate header row (skipping data-like rows)
      let headerIdx = -1;
      for (let i = 0; i < Math.min(25, aoa.length); i++) {
        const cells = (aoa[i] || []).map(c => String(c ?? '').trim());
        if (!cells.some(Boolean) || isExcelDataLikeRow(cells)) continue;
        const rowStr = cells.join(' ').toLowerCase().replace(/\./g, ' ');
        if ((/\bl\s*g\s*a\b|local\s*gov/.test(rowStr)) && (/\bward\b|\bp\s*u\b|polling|\bra\b|delim/.test(rowStr))) {
          headerIdx = i;
          break;
        }
      }

      let cols = null;
      let dataStartIdx = 0;
      let isContinuation = false;

      if (headerIdx !== -1) {
        let headerCells = (aoa[headerIdx] || []).map(h => String(h || '').trim());
        dataStartIdx = headerIdx + 1;

        // Support optional 2-row merged headers (e.g., Row 1: LGA | (blank), Row 2: NAME | CODE NO)
        if (headerIdx + 1 < aoa.length) {
          const subRow = (aoa[headerIdx + 1] || []).map(c => String(c || '').trim());
          const subText = subRow.join(' ').toLowerCase();
          const looksLikeSubHeader = !isExcelDataLikeRow(subRow) &&
            subRow.some(c => /^(name|code(\s*no\.?)?|no\.?|id)$/i.test(c)) &&
            (subText.includes('name') || subText.includes('code'));
          if (looksLikeSubHeader) {
            const maxCols = Math.max(headerCells.length, subRow.length);
            const merged = [];
            let lastParent = '';
            for (let c = 0; c < maxCols; c++) {
              const p = String(headerCells[c] || '').trim();
              if (p) lastParent = p;
              const s = String(subRow[c] || '').trim();
              if (s && lastParent && s.toUpperCase() !== lastParent.toUpperCase()) {
                merged.push(`${lastParent} ${s}`);
              } else {
                merged.push(p || s);
              }
            }
            headerCells = merged;
            dataStartIdx = headerIdx + 2;
          }
        }

        const sampleData = aoa.slice(dataStartIdx, dataStartIdx + 10);
        cols = mapLocationHeaderColumns(headerCells, sampleData);
      } else if (fallbackCols) {
        // Validate continuation compatibility before reusing prior location column mapping
        const sampleRows = aoa.filter(r => r.some(c => String(c ?? '').trim() !== '')).slice(0, 10);
        const maxWidth = sampleRows.reduce((m, r) => Math.max(m, r.length), 0);
        const needCols = [fallbackCols.colLgaName, fallbackCols.colLgaCode, fallbackCols.colFullCode].filter(i => i >= 0);
        const reachable = needCols.some(i => i < maxWidth);
        const yieldsLocation = reachable && sampleRows.some(r =>
          needCols.some(idx => idx < r.length && String(r[idx] ?? '').trim() !== '')
        );
        if (!yieldsLocation) {
          return {
            items: [],
            cols: null,
            isContinuation: false,
            skippedReason: 'No location headers found and sheet layout did not match prior sheet',
            uninterpretableRows: []
          };
        }
        cols = fallbackCols;
        dataStartIdx = 0;
        isContinuation = true;
      } else {
        return { items: [], cols: null, isContinuation: false, skippedReason: 'No recognizable location headers found', uninterpretableRows: [] };
      }

      // Must at least have LGA column or fullCode column
      if (cols.colLgaCode < 0 && cols.colLgaName < 0 && cols.colFullCode < 0) {
        return { items: [], cols: null, isContinuation: false, skippedReason: 'Missing LGA or delimitation code column', uninterpretableRows: [] };
      }

      const items = [];
      const uninterpretableRows = [];
      for (let i = dataStartIdx; i < aoa.length; i++) {
        const row = aoa[i];
        if (!row || !row.some(c => String(c ?? '').trim() !== '')) continue;
        if (isSummaryOrFooterRow(row)) continue;

        const getVal = (idx) => (idx >= 0 && idx < row.length) ? String(row[idx] ?? '').trim() : '';
        const lgaName = getVal(cols.colLgaName).toUpperCase();
        const lgaCode = getVal(cols.colLgaCode);
        const wardName = getVal(cols.colWardName).toUpperCase();
        const wardCode = getVal(cols.colWardCode);
        const puName = getVal(cols.colPuName).toUpperCase();
        const puCode = getVal(cols.colPuCode);
        const stateName = getVal(cols.colStateName).toUpperCase() || 'BORNO';
        const stateCode = getVal(cols.colStateCode) || '08';
        const fullCode = getVal(cols.colFullCode);

        // Skip repeated header row on continuation sheets
        if (isContinuation && /^(L\.?G\.?A\.?(\s*NAME)?)$/i.test(lgaName) && (!wardName || /^(WARD|RA)$/i.test(wardName))) continue;

        // Skip only if LGA, Ward, PU, and fullCode are all empty
        if (!lgaName && !lgaCode && !wardName && !puName && !fullCode) {
          const nonEmpty = row.map(c => String(c ?? '').trim()).filter(Boolean);
          if (nonEmpty.length > 1) {
            uninterpretableRows.push({
              sheetName: sheetName || 'Sheet',
              excelRow: i + 1,
              rawPreview: nonEmpty.slice(0, 6).join(' | '),
              reason: 'Row lacked LGA, Ward, Polling Unit, and Code values'
            });
          }
          continue;
        }

        items.push(buildLocationEntry({
          stateName,
          stateCode,
          lgaName,
          lgaCode,
          wardName,
          wardCode,
          puName,
          puCode,
          fullCode
        }));
      }

      return { items, cols, isContinuation, skippedReason: '', uninterpretableRows };
    }

    function extractLocationRowsFromAoa(aoa) {
      return extractLocationRowsWithSchema(aoa, null).items;
    }

    // Parse a text-based table (rows separated by newlines, columns by multiple spaces, tabs, or pipes)
    function parseLocationTextTable(text) {
      if (!text || !text.trim()) return [];
      const lines = text.split(/\r?\n/).filter(l => l.trim());

      // Try to detect header line in first 15 lines
      let headerIdx = -1;
      for (let i = 0; i < Math.min(15, lines.length); i++) {
        const lower = lines[i].toLowerCase().replace(/\./g, '');
        if ((lower.includes('lga') || lower.includes('local gov')) && (lower.includes('ward') || lower.includes('polling') || lower.includes('pu') || lower.includes('ra'))) {
          headerIdx = i;
          break;
        }
      }

      if (headerIdx === -1) {
        // Fall back to the BORNO-style block parser
        return parseLocationText(text);
      }

      const splitCols = (line) => line.split(/\s{2,}|\t|\|/).map(c => c.trim());
      const aoa = lines.slice(headerIdx).map(splitCols).filter(cells => cells.length >= 2);
      const items = extractLocationRowsFromAoa(aoa);

      if (items.length === 0) {
        return parseLocationText(text);
      }
      return items;
    }

    function parseLocationText(rawText) {
      if (!rawText || !rawText.trim()) return [];
      const items = [];
      let defaultState = "";
      let defaultStateCode = "";

      const stateColonMatch = rawText.match(/\bState\s*:\s*([A-Za-z]+)\s*(?:\((\d{1,2})\))?/i);
      const statePrefixMatch = rawText.match(/\b([A-Za-z]+)\s+STATE\b/i);
      if (stateColonMatch) {
        defaultState = stateColonMatch[1].trim().toUpperCase();
        if (stateColonMatch[2]) defaultStateCode = stateColonMatch[2].trim();
      } else if (statePrefixMatch) {
        defaultState = statePrefixMatch[1].trim().toUpperCase();
      }
      if (!defaultStateCode && defaultState === 'BORNO') {
        defaultStateCode = '08';
      }

      // Regex to find LGA blocks (handles spaces, hyphens, slashes, dots in LGA names)
      const lgaRegex = /LGA[:\s]*([A-Z0-9\-\/.\s]+?)[\s]*CODE[:\s]*(\d{1,2})/gi;
      const lgaMatches = [];
      let match;
      while ((match = lgaRegex.exec(rawText)) !== null) {
        lgaMatches.push({
          name: match[1].replace(/\s+/g, ' ').trim().toUpperCase(),
          code: match[2].trim(),
          startIdx: match.index,
          lastIdx: lgaRegex.lastIndex
        });
      }

      // Extract everything between one LGA match and the next.
      const lgaBlocks = [];
      for (let i = 0; i < lgaMatches.length; i++) {
        const cur = lgaMatches[i];
        const nextStart = (i + 1 < lgaMatches.length) ? lgaMatches[i + 1].startIdx : rawText.length;
        const blockContent = rawText.substring(cur.lastIdx, nextStart);
        lgaBlocks.push({
          lgaName: cur.name,
          lgaCode: cur.code,
          content: blockContent
        });
      }

      // Inside each LGA block, extract ward/registration area rows.
      const wardRegex = /(\d{1,3})\s+([A-Z0-9'’\-\/&.\s]+?)\s+(\d{2})\s+([A-Z0-9'’\-\/&.\s]+)/g;

      for (const block of lgaBlocks) {
        const content = block.content;
        const rowHeaderRegex = /(?:^|\s)(\d{1,3})\s+([A-Z0-9'’\-\/&.\s]+?)\s+(\d{2})\s+/g;
        const starts = [];
        let sm;
        while ((sm = rowHeaderRegex.exec(content)) !== null) {
          starts.push({
            index: sm.index + (sm[0].startsWith(' ') ? 1 : 0)
          });
        }

        if (starts.length > 0) {
          for (let sIdx = 0; sIdx < starts.length; sIdx++) {
            const start = starts[sIdx].index;
            const end = (sIdx + 1 < starts.length) ? starts[sIdx + 1].index : content.length;
            const rowChunk = content.substring(start, end).trim();

            wardRegex.lastIndex = 0;
            const wMatch = wardRegex.exec(rowChunk);
            if (wMatch) {
              const wardName = wMatch[2].replace(/\s+/g, ' ').trim().toUpperCase();
              const wardCode = wMatch[3].trim();
              const puName = wMatch[4].replace(/\s+/g, ' ').trim().toUpperCase();
              items.push(buildLocationEntry({
                stateName: defaultState || 'BORNO',
                stateCode: defaultStateCode || '08',
                lgaName: block.lgaName,
                lgaCode: block.lgaCode,
                wardName: wardName,
                wardCode: wardCode,
                puName: puName,
                puCode: ''
              }));
            }
          }
        } else {
          wardRegex.lastIndex = 0;
          let wMatch;
          while ((wMatch = wardRegex.exec(content)) !== null) {
            const wardCode = wMatch[3].trim();
            items.push(buildLocationEntry({
              stateName: defaultState || 'BORNO',
              stateCode: defaultStateCode || '08',
              lgaName: block.lgaName,
              lgaCode: block.lgaCode,
              wardName: wMatch[2].replace(/\s+/g, ' ').trim().toUpperCase(),
              wardCode: wardCode,
              puName: wMatch[4].replace(/\s+/g, ' ').trim().toUpperCase(),
              puCode: ''
            }));
          }
        }
      }

      return items;
    }

    // Excel Parser (SheetJS — scans ALL sheets with merged-cell expansion & safe continuation validation)
    async function parseLocationExcel(file, returnDiagnostics = false) {
      const buffer = await file.arrayBuffer();
      const wb = XLSX.read(buffer, { type: 'array' });

      let allRows = [];
      let lastCols = null;
      const skippedSheets = [];
      const uninterpretableRows = [];
      let sheetsProcessed = 0;

      for (const sheetName of wb.SheetNames) {
        const sheet = wb.Sheets[sheetName];
        if (!sheet) continue;
        const aoa = expandMergedCellsAoa(sheet);
        if (!Array.isArray(aoa) || !aoa.some(r => r.some(c => String(c ?? '').trim() !== ''))) continue;

        const res = extractLocationRowsWithSchema(aoa, lastCols, sheetName);
        if (res.skippedReason) {
          skippedSheets.push({ sheetName, reason: res.skippedReason });
        }
        if (res.cols && !res.isContinuation) {
          lastCols = res.cols;
        }
        if (Array.isArray(res.uninterpretableRows) && res.uninterpretableRows.length > 0) {
          uninterpretableRows.push(...res.uninterpretableRows);
        }
        if (res.items.length > 0) {
          sheetsProcessed++;
          console.log(`Reading sheet "${sheetName}"${res.isContinuation ? ' [continuation]' : ''}: ${res.items.length} rows`);
          allRows = allRows.concat(res.items);
        }
      }

      console.log(`Total rows from all sheets: ${allRows.length}`);
      if (returnDiagnostics) {
        return {
          items: allRows,
          diagnostics: { fileName: file.name, sheetsProcessed, skippedSheets, uninterpretableRows }
        };
      }
      return allRows;
    }

    // CSV Parser (reuses SheetJS + extractLocationRowsFromAoa)
    async function parseLocationCsv(file) {
      const text = await file.text();
      const wb = XLSX.read(text, { type: 'string' });
      const sheet = wb.Sheets[wb.SheetNames[0]];
      const aoa = expandMergedCellsAoa(sheet);

      const items = extractLocationRowsFromAoa(aoa);
      console.log(`parseLocationCsv: extracted ${items.length} rows`);
      return items;
    }

    // DOCX Parser (JSZip -> word/document.xml tables, zero deduplication)
    async function parseLocationDocx(file) {
      const zip = await JSZip.loadAsync(file);
      const docXml = await zip.file("word/document.xml").async("text");
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(docXml, "application/xml");
      const tables = Array.from(xmlDoc.getElementsByTagName("w:tbl"));
      const trs = Array.from(xmlDoc.getElementsByTagName("w:tr"));

      const items = [];
      if (tables.length > 0) {
        for (const tbl of tables) {
          const tblTrs = Array.from(tbl.getElementsByTagName("w:tr"));
          if (tblTrs.length < 2) continue;
          const aoa = tblTrs.map(tr =>
            Array.from(tr.getElementsByTagName("w:tc")).map(tc =>
              Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim()
            )
          );
          const tblItems = extractLocationRowsFromAoa(aoa);
          if (tblItems.length > 0) items.push(...tblItems);
        }
      }

      if (items.length === 0 && trs.length > 1) {
        const aoa = trs.map(tr =>
          Array.from(tr.getElementsByTagName("w:tc")).map(tc =>
            Array.from(tc.getElementsByTagName("w:t")).map(t => t.textContent).join('').trim()
          )
        );
        items.push(...extractLocationRowsFromAoa(aoa));
      }

      if (items.length === 0) {
        const textOnly = docXml.replace(/<w:p[^>]*>/g, '\n').replace(/<[^>]+>/g, ' ');
        items.push(...parseLocationTextTable(textOnly));
      }

      console.log(`parseLocationDocx: extracted ${items.length} rows`);
      return items;
    }

    // ─────────────────────────────────────────────────────────────────
    // CARD IMAGE EDITOR (ROTATE, CROP, AUTO-ENHANCE, SAVE & RESCAN)
    // ─────────────────────────────────────────────────────────────────
    const cardEditorState = {
      rowId: null,
      workingCanvas: null,
      cropActive: false,
      cropRect: { x: 0, y: 0, w: 0, h: 0 }, // In display canvas CSS pixels
      dragMode: null, // 'move' | 'nw' | 'ne' | 'sw' | 'se' | null
      dragStartX: 0,
      dragStartY: 0,
      startRect: null,
      busy: false
    };

    function closeCardEditor() {
      const el = document.getElementById('card-editor-overlay');
      if (el) el.remove();
      cardEditorState.rowId = null;
      cardEditorState.workingCanvas = null;
      cardEditorState.cropActive = false;
      cardEditorState.dragMode = null;
      cardEditorState.busy = false;
    }

    function drawCardEditorCanvas() {
      const displayCanvas = document.getElementById('card-editor-canvas');
      const src = cardEditorState.workingCanvas;
      if (!displayCanvas || !src) return;
      displayCanvas.width = src.width;
      displayCanvas.height = src.height;
      const ctx = displayCanvas.getContext('2d');
      ctx.clearRect(0, 0, displayCanvas.width, displayCanvas.height);
      ctx.drawImage(src, 0, 0);
      if (cardEditorState.cropActive) {
        syncCardEditorCropBoxDom();
      }
    }

    function syncCardEditorCropBoxDom() {
      const box = document.getElementById('card-editor-crop-box');
      if (!box) return;
      const r = cardEditorState.cropRect;
      box.style.left = r.x + 'px';
      box.style.top = r.y + 'px';
      box.style.width = r.w + 'px';
      box.style.height = r.h + 'px';
    }

    function setCardEditorCropButtons(active) {
      const btnCrop = document.getElementById('ce-btn-crop');
      const btnConfirm = document.getElementById('ce-btn-confirm-crop');
      const btnCancelCrop = document.getElementById('ce-btn-cancel-crop');
      const overlay = document.getElementById('card-editor-crop-overlay');
      if (btnCrop) btnCrop.style.display = active ? 'none' : 'inline-flex';
      if (btnConfirm) btnConfirm.style.display = active ? 'inline-flex' : 'none';
      if (btnCancelCrop) btnCancelCrop.style.display = active ? 'inline-flex' : 'none';
      if (overlay) overlay.classList.toggle('is-active', active);
    }

    function rotateCardEditor(degrees) {
      if (cardEditorState.busy || !cardEditorState.workingCanvas) return;
      if (cardEditorState.cropActive) cancelCardEditorCropMode();
      cardEditorState.workingCanvas = rotateCanvas(cardEditorState.workingCanvas, degrees);
      drawCardEditorCanvas();
    }

    function enterCardEditorCropMode() {
      if (cardEditorState.busy || !cardEditorState.workingCanvas) return;
      const displayCanvas = document.getElementById('card-editor-canvas');
      if (!displayCanvas) return;
      cardEditorState.cropActive = true;
      setCardEditorCropButtons(true);

      const rect = displayCanvas.getBoundingClientRect();
      const dispW = rect.width || displayCanvas.clientWidth || displayCanvas.width || 300;
      const dispH = rect.height || displayCanvas.clientHeight || displayCanvas.height || 200;
      const padX = Math.round(dispW * 0.1);
      const padY = Math.round(dispH * 0.1);
      cardEditorState.cropRect = {
        x: padX,
        y: padY,
        w: Math.max(24, dispW - padX * 2),
        h: Math.max(24, dispH - padY * 2)
      };
      syncCardEditorCropBoxDom();
    }

    function cancelCardEditorCropMode() {
      cardEditorState.cropActive = false;
      cardEditorState.dragMode = null;
      setCardEditorCropButtons(false);
    }

    function confirmCardEditorCrop() {
      if (!cardEditorState.cropActive || !cardEditorState.workingCanvas) return;
      const displayCanvas = document.getElementById('card-editor-canvas');
      if (!displayCanvas) return;
      const rect = displayCanvas.getBoundingClientRect();
      const dispW = rect.width || displayCanvas.clientWidth || displayCanvas.width;
      const dispH = rect.height || displayCanvas.clientHeight || displayCanvas.height;
      const src = cardEditorState.workingCanvas;
      const scaleX = src.width / Math.max(1, dispW);
      const scaleY = src.height / Math.max(1, dispH);

      const cr = cardEditorState.cropRect;
      const sx = Math.max(0, Math.min(src.width - 10, Math.round(cr.x * scaleX)));
      const sy = Math.max(0, Math.min(src.height - 10, Math.round(cr.y * scaleY)));
      const sw = Math.max(10, Math.min(src.width - sx, Math.round(cr.w * scaleX)));
      const sh = Math.max(10, Math.min(src.height - sy, Math.round(cr.h * scaleY)));

      const cropped = document.createElement('canvas');
      cropped.width = sw;
      cropped.height = sh;
      cropped.getContext('2d').drawImage(src, sx, sy, sw, sh, 0, 0, sw, sh);
      cardEditorState.workingCanvas = cropped;
      cancelCardEditorCropMode();
      drawCardEditorCanvas();
    }

    function autoEnhanceCardEditor() {
      if (cardEditorState.busy || !cardEditorState.workingCanvas) return;
      const src = cardEditorState.workingCanvas;
      const ctx = src.getContext('2d');
      const imgData = ctx.getImageData(0, 0, src.width, src.height);
      const d = imgData.data;
      const contrastFactor = 1.3;      // +30% contrast
      const brightnessOffset = 255 * 0.15; // +15% brightness
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const enhanced = Math.max(0, Math.min(255, (gray - 128) * contrastFactor + 128 + brightnessOffset));
        d[i] = enhanced;
        d[i + 1] = enhanced;
        d[i + 2] = enhanced;
      }
      ctx.putImageData(imgData, 0, 0);
      drawCardEditorCanvas();
      toast("Auto-enhanced image contrast and brightness.", "info", 2000);
    }

    async function saveAndRescanCardEditor() {
      if (cardEditorState.busy || !cardEditorState.workingCanvas) return;
      if (cardEditorState.cropActive) {
        confirmCardEditorCrop();
      }

      const rowId = cardEditorState.rowId;
      const editedCanvas = cardEditorState.workingCanvas;
      cardEditorState.busy = true;

      const saveBtn = document.getElementById('ce-btn-save');
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.textContent = 'Saving & Rescanning...';
      }

      try {
        const blob = await new Promise((resolve) => {
          editedCanvas.toBlob((b) => resolve(b || null), 'image/jpeg', 0.85);
        });
        if (!blob) throw new Error('Failed to encode edited image');

        const row = await dbGet('rows', rowId);
        if (!row) throw new Error('Record not found');

        await dbPut('images', { rowId: row.id, blob });
        closeCardEditor();

        toast("Rescanning edited card image...", "info", 2500);
        const extracted = await extractCardData(editedCanvas);
        const normExt = normalizeExtractedFieldsForRow(extracted);
        const registry = await dbAll('registry');
        const updated = applyExtractedFieldsToRowObj(row, normExt, registry);
        updated.updatedAt = new Date().toISOString();
        await dbPut('rows', updated);

        toast("Card rotated/cropped and rescanned.", "success", 4000);
        await updateHeaderStats();
        await R(true);
      } catch (err) {
        console.error('Card editor save & rescan failed:', err);
        cardEditorState.busy = false;
        if (saveBtn) {
          saveBtn.disabled = false;
          saveBtn.textContent = '💾 Save & Rescan';
        }
        toast("Save & rescan failed: " + (err?.message || err), "error", 4500);
      }
    }

    function bindCardEditorCropEvents() {
      const overlay = document.getElementById('card-editor-crop-overlay');
      const box = document.getElementById('card-editor-crop-box');
      const displayCanvas = document.getElementById('card-editor-canvas');
      if (!overlay || !box || !displayCanvas) return;

      const getPoint = (ev) => {
        const t = ev.touches && ev.touches[0] ? ev.touches[0] : (ev.changedTouches && ev.changedTouches[0] ? ev.changedTouches[0] : ev);
        return { x: t.clientX, y: t.clientY };
      };

      const startDrag = (mode, ev) => {
        if (!cardEditorState.cropActive) return;
        ev.preventDefault();
        ev.stopPropagation();
        const pt = getPoint(ev);
        cardEditorState.dragMode = mode;
        cardEditorState.dragStartX = pt.x;
        cardEditorState.dragStartY = pt.y;
        cardEditorState.startRect = { ...cardEditorState.cropRect };
      };

      box.addEventListener('mousedown', (ev) => {
        if (ev.target && ev.target.dataset && ev.target.dataset.handle) return;
        startDrag('move', ev);
      });
      box.addEventListener('touchstart', (ev) => {
        if (ev.target && ev.target.dataset && ev.target.dataset.handle) return;
        startDrag('move', ev);
      }, { passive: false });

      box.querySelectorAll('.card-editor-crop-handle').forEach(h => {
        const mode = h.dataset.handle;
        h.addEventListener('mousedown', (ev) => startDrag(mode, ev));
        h.addEventListener('touchstart', (ev) => startDrag(mode, ev), { passive: false });
      });

      const onMove = (ev) => {
        if (!cardEditorState.dragMode || !cardEditorState.cropActive) return;
        ev.preventDefault();
        const pt = getPoint(ev);
        const dx = pt.x - cardEditorState.dragStartX;
        const dy = pt.y - cardEditorState.dragStartY;
        const sr = cardEditorState.startRect;
        const rect = displayCanvas.getBoundingClientRect();
        const maxW = rect.width || displayCanvas.clientWidth || displayCanvas.width;
        const maxH = rect.height || displayCanvas.clientHeight || displayCanvas.height;
        const minSize = 24;

        let { x, y, w, h } = sr;
        const m = cardEditorState.dragMode;

        if (m === 'move') {
          x = Math.max(0, Math.min(maxW - w, sr.x + dx));
          y = Math.max(0, Math.min(maxH - h, sr.y + dy));
        } else {
          if (m.includes('w')) {
            const newX = Math.max(0, Math.min(sr.x + sr.w - minSize, sr.x + dx));
            w = sr.w + (sr.x - newX);
            x = newX;
          }
          if (m.includes('e')) {
            w = Math.max(minSize, Math.min(maxW - sr.x, sr.w + dx));
          }
          if (m.includes('n')) {
            const newY = Math.max(0, Math.min(sr.y + sr.h - minSize, sr.y + dy));
            h = sr.h + (sr.y - newY);
            y = newY;
          }
          if (m.includes('s')) {
            h = Math.max(minSize, Math.min(maxH - sr.y, sr.h + dy));
          }
        }

        cardEditorState.cropRect = { x, y, w, h };
        syncCardEditorCropBoxDom();
      };

      const onEnd = () => {
        cardEditorState.dragMode = null;
      };

      overlay.addEventListener('mousemove', onMove);
      overlay.addEventListener('touchmove', onMove, { passive: false });
      document.addEventListener('mouseup', onEnd);
      document.addEventListener('touchend', onEnd);
    }

    async function saveFixLgaGroup(groupKey) {
      const lgaEl = document.getElementById('fix-grp-lga');
      const wardEl = document.getElementById('fix-grp-ward');
      const puEl = document.getElementById('fix-grp-pu');
      const selLgaCode = normLocCode(lgaEl ? lgaEl.value : '', 2);
      if (!selLgaCode) {
        toast("Please select the correct LGA from the registry.", "warning");
        return;
      }
      const selWardCode = normLocCode(wardEl ? wardEl.value : '', 2);
      const selPuCode = normLocCode(puEl ? puEl.value : '', 3);

      const registry = await dbAll('registry');
      const rows = await dbAll('rows');

      const matchedPu = (selWardCode && selPuCode) ? registry.find(r =>
        normLocCode(r.lgaCode, 2) === selLgaCode &&
        normLocCode(r.wardCode, 2) === selWardCode &&
        normLocCode(r.puCode, 3) === selPuCode
      ) : null;
      const matchedWard = (!matchedPu && selWardCode) ? registry.find(r =>
        normLocCode(r.lgaCode, 2) === selLgaCode &&
        normLocCode(r.wardCode, 2) === selWardCode
      ) : null;
      const matchedLga = (!matchedPu && !matchedWard) ? registry.find(r =>
        normLocCode(r.lgaCode, 2) === selLgaCode
      ) : null;

      const regRef = matchedPu || matchedWard || matchedLga;
      if (!regRef) {
        toast("Selected LGA not found in registry.", "error");
        return;
      }

      const targetRows = rows.filter(r => {
        const raw = String(r.lgaCode || '').trim();
        const k = raw ? raw.padStart(2, '0') : '__BLANK__';
        return k === groupKey;
      });

      for (const r of targetRows) {
        const wasDup = Boolean(r.duplicateOf) || (Array.isArray(r.flags) && r.flags.includes('possible duplicate'));
        r.stateName = regRef.stateName || r.stateName || '';
        r.stateCode = normLocCode(regRef.stateCode || r.stateCode || '08', 2);
        r.lgaCode = normLocCode(regRef.lgaCode, 2);
        r.lga = regRef.lgaName || '';
        r.wardCode = (matchedPu || matchedWard) ? normLocCode(regRef.wardCode, 2) : '';
        r.ward = (matchedPu || matchedWard) ? (regRef.wardName || '') : '';
        r.puCode = matchedPu ? normLocCode(regRef.puCode, 3) : '';
        r.pu = matchedPu ? (regRef.puName || '') : '';
        r.flags = computeRowFlags(r, registry);
        if (wasDup && !r.flags.includes('possible duplicate')) {
          r.flags.push('possible duplicate');
        }
        await dbPut('rows', r);
      }

      closeFixLgaGroupModal();
      toast(`Updated ${targetRows.length} row(s) to ${regRef.lgaName || selLgaCode}.`, "success", 3500);
      await R();
      await openInspectLgaCodesModal();
    }

    function updateExportOptionsUI() {
      const selected = document.querySelector('input[name="expFormat"]:checked')?.value;
      ['pdf', 'excel', 'csv', 'print'].forEach(f => {
        const btn = document.getElementById(`exp-lbl-${f}`);
        if (btn) {
          if (f === selected) {
            btn.style.background = 'var(--teal)';
            btn.style.color = '#fff';
            btn.style.borderColor = 'var(--bright)';
          } else {
            btn.style.background = 'transparent';
            btn.style.color = 'var(--mist)';
            btn.style.borderColor = 'var(--mist)';
          }
        }
      });
      const pdfOpts = document.getElementById('pdf-extra-options');
      if (pdfOpts) pdfOpts.style.display = (selected === 'pdf') ? 'flex' : 'none';
      const dlBtn = document.getElementById('btn-do-download');
      if (dlBtn) dlBtn.innerText = (selected === 'print') ? 'Print' : 'Download';
    }

    async function resetSettingsToDefaults() {
      await dbPut('settings', { key: 'syncUrl', value: DEFAULT_SYNC_URL });
      await dbPut('settings', { key: 'sheetId', value: DEFAULT_SHEET_ID });
      await dbPut('settings', { key: 'folderId', value: DEFAULT_FOLDER_ID });

      const syncEl = document.getElementById('st-syncUrl');
      const sheetEl = document.getElementById('st-sheetId');
      const folderEl = document.getElementById('st-folderId');
      if (syncEl) syncEl.value = DEFAULT_SYNC_URL;
      if (sheetEl) sheetEl.value = DEFAULT_SHEET_ID;
      if (folderEl) folderEl.value = DEFAULT_FOLDER_ID;
      const statusEl = document.getElementById('st-test-status');
      if (statusEl) statusEl.textContent = '';

      toast("Restored team defaults.", "success", 3000);
    }

    async function resetLocationsToDefault() {
      const ok = await askConfirm("Reset locations to the built-in Borno registry? This will delete any custom locations you uploaded.", {
        title: "Reset Locations to Default",
        confirmLabel: "Reset Registry",
        danger: true
      });
      if (!ok) return;

      await dbClear('registry');
      for (const item of HARDCODED_REGISTRY) {
        await dbPut('registry', item.fullCode ? item : { ...item, fullCode: buildFullCode(item) });
      }
      S.locSelection.clear();
      S.locFilterState = '';
      S.locFilterLga = '';
      S.locFilterWard = '';

      if (HARDCODED_REGISTRY.length > 0) {
        toast("Registry reset to built-in Borno data.", "success");
      } else {
        toast("Built-in Borno registry is empty — please upload the BORNO Excel file manually.", "warning", 5000);
      }
      await R();
    }

    async function updateKeyStatusChips() {
      const today = new Date().toISOString().slice(0, 10);
      const settings = await getSyncSettings();
      const keys = [
        { id: 1, key: settings.geminiApiKey1, exhausted: (await dbGet('settings', 'geminiKey1Exhausted'))?.value || '' },
        { id: 2, key: settings.geminiApiKey2, exhausted: (await dbGet('settings', 'geminiKey2Exhausted'))?.value || '' },
        { id: 3, key: settings.geminiApiKey3, exhausted: (await dbGet('settings', 'geminiKey3Exhausted'))?.value || '' }
      ];
      keys.forEach(k => {
        const el = document.getElementById(`st-key${k.id}-status`);
        if (!el) return;
        if (!k.key) {
          el.textContent = '🟡 Empty';
          el.style.background = 'rgba(245,158,11,0.2)';
          el.style.color = 'var(--amber)';
        } else if (k.exhausted === today) {
          el.textContent = '🔴 Exhausted';
          el.style.background = 'rgba(239,68,68,0.2)';
          el.style.color = '#fca5a5';
        } else {
          el.textContent = '🟢 Active';
          el.style.background = 'rgba(16,185,129,0.2)';
          el.style.color = '#a7f3d0';
        }
      });
    }

    async function saveSettingsForm(e) {
      if (e && typeof e.preventDefault === 'function') e.preventDefault();
      const syncUrl = document.getElementById('st-syncUrl').value.trim();
      const sheetId = document.getElementById('st-sheetId').value.trim();
      const folderId = document.getElementById('st-folderId').value.trim();

      const prev1 = (await dbGet('settings', 'geminiApiKey1'))?.value || '';
      const prev2 = (await dbGet('settings', 'geminiApiKey2'))?.value || '';
      const prev3 = (await dbGet('settings', 'geminiApiKey3'))?.value || '';
      const k1 = (document.getElementById('st-geminiApiKey1')?.value || '').trim();
      const k2 = (document.getElementById('st-geminiApiKey2')?.value || '').trim();
      const k3 = (document.getElementById('st-geminiApiKey3')?.value || '').trim();

      await dbPut('settings', { key: 'syncUrl', value: syncUrl });
      await dbPut('settings', { key: 'sheetId', value: sheetId });
      await dbPut('settings', { key: 'folderId', value: folderId });
      await dbPut('settings', { key: 'geminiApiKey1', value: k1 });
      await dbPut('settings', { key: 'geminiApiKey2', value: k2 });
      await dbPut('settings', { key: 'geminiApiKey3', value: k3 });

      const newMode =
        document.getElementById('st-viewmode-mobile')?.checked ? 'mobile' :
        document.getElementById('st-viewmode-tablet')?.checked ? 'tablet' :
        document.getElementById('st-viewmode-desktop')?.checked ? 'desktop' : 'auto';
      await dbPut('settings', { key: 'viewMode', value: newMode });

      const effectiveMode = await getEffectiveViewMode();
      applyViewModeClass(effectiveMode);

      if (k1 !== prev1) await dbPut('settings', { key: 'geminiKey1Exhausted', value: '' });
      if (k2 !== prev2) await dbPut('settings', { key: 'geminiKey2Exhausted', value: '' });
      if (k3 !== prev3) await dbPut('settings', { key: 'geminiKey3Exhausted', value: '' });

      await refreshActiveKeyStateFromDb();
      await updateHeaderStats();
      toast("Settings saved!", "success");
      closeModal();
      R(true);
    }

    function handlePasteLocationSubmit() {
      const text = document.getElementById('paste-loc-textarea').value;
      if (!text.trim()) {
        toast("Please paste text first.", "warning");
        return;
      }
      const items = parseLocationTextTable(text);
      if (items.length === 0) {
        toast("Could not extract any LGA/Ward blocks. Check text formatting.", "error");
        return;
      }
      S.importPreview = {
        fileName: "Pasted text",
        items: items,
        unreadablePages: []
      };
      openModal('loc-preview');
    }

    async function handleManualLocationSubmit(e) {
      e.preventDefault();
      const stateName = document.getElementById('mloc-state').value.trim();
      const stateCode = document.getElementById('mloc-stateCode').value.trim();
      const lgaName = document.getElementById('mloc-lga').value.trim().toUpperCase();
      const lgaCode = document.getElementById('mloc-lgaCode').value.trim();
      const wardName = document.getElementById('mloc-ward').value.trim().toUpperCase();
      const wardCode = document.getElementById('mloc-wardCode').value.trim();
      const puName = document.getElementById('mloc-pu').value.trim().toUpperCase();
      const puCode = document.getElementById('mloc-puCode').value.trim() || wardCode;

      const registry = await dbAll('registry');
      
      // Check if this LGA already exists in registry
      const existingLga = registry.find(r => 
        (lgaCode && String(r.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0')) ||
        (lgaName && r.lgaName && r.lgaName.toUpperCase() === lgaName)
      );

      // Check if exact ward + PU already exists under this LGA to avoid duplicate
      const alreadyExists = registry.find(r => 
        ((lgaCode && String(r.lgaCode).padStart(2, '0') === String(lgaCode).padStart(2, '0')) ||
         (lgaName && r.lgaName && r.lgaName.toUpperCase() === lgaName)) &&
        String(r.wardCode).padStart(2, '0') === String(wardCode).padStart(2, '0') &&
        (r.wardName && r.wardName.toUpperCase() === wardName) &&
        (puCode ? String(r.puCode).padStart(3, '0') === String(puCode).padStart(3, '0') : true)
      );

      if (alreadyExists) {
        toast("This Ward/PU already exists under this LGA in the registry.", "warning");
        closeModal();
        return;
      }

      // If LGA exists, append new Ward/PU under existing LGA metadata, otherwise create new LGA entry
      const item = {
        stateName: (stateName || (existingLga ? existingLga.stateName : '')).toUpperCase(),
        stateCode: stateCode || (existingLga ? existingLga.stateCode : ''),
        lgaName: existingLga ? existingLga.lgaName : lgaName,
        lgaCode: existingLga ? existingLga.lgaCode : lgaCode,
        wardName: wardName,
        wardCode: wardCode,
        puName: puName,
        puCode: puCode
      };
      item.fullCode = buildFullCode(item);

      await dbPut('registry', item);
      toast("Location saved to registry!", "success");
      closeModal();
      // Immediately refresh the State / LGA / Ward / PU dropdowns on Cards tab (Manual Form)
      await R();
    }

    function askLocationImportMode(newCount, existingCount) {
      return new Promise((resolve) => {
        const existing = document.getElementById('loc-import-mode-overlay');
        if (existing) existing.remove();

        const overlay = document.createElement('div');
        overlay.id = 'loc-import-mode-overlay';
        overlay.className = 'overlay-backdrop';
        overlay.style.zIndex = '2750';
        overlay.innerHTML = `
          <div class="card modal-box" style="max-width: 480px;">
            <h3 style="font-size: 19px; margin-bottom: 10px;">Save ${newCount} Registry Rows</h3>
            <p style="font-size: 14px; color: var(--tx); line-height: 1.5; margin-bottom: 18px;">
              ${newCount} rows will be added to the registry.${existingCount > 0 ? ` You currently have <b>${existingCount}</b> existing registry entries.` : ''}
            </p>
            <div style="display:flex; justify-content:flex-end; gap:10px; flex-wrap:wrap;">
              <button type="button" class="btn alt sm" id="imp-mode-cancel">Cancel</button>
              ${existingCount > 0 ? `<button type="button" class="btn alt sm" id="imp-mode-merge">Merge with Existing</button>` : ''}
              <button type="button" class="btn sm" id="imp-mode-replace">${existingCount > 0 ? 'Replace Entire Registry' : `Save ${newCount} Rows`}</button>
            </div>
          </div>
        `;
        const finish = (choice) => {
          overlay.remove();
          resolve(choice); // 'replace' | 'merge' | null
        };
        overlay.addEventListener('click', (e) => { if (e.target === overlay) finish(null); });
        document.body.appendChild(overlay);
        overlay.querySelector('#imp-mode-cancel').onclick = () => finish(null);
        const mergeBtn = overlay.querySelector('#imp-mode-merge');
        if (mergeBtn) mergeBtn.onclick = () => finish('merge');
        overlay.querySelector('#imp-mode-replace').onclick = () => finish('replace');
      });
    }

    async function confirmLocationImport() {
      if (!S.importPreview || !S.importPreview.items) return;

      const items = S.importPreview.items;
      console.log(`confirmLocationImport: saving ${items.length} items`);

      const existing = await dbAll('registry');
      let clearFirst = false;
      if (existing.length > 0) {
        const mode = await askLocationImportMode(items.length, existing.length);
        if (!mode) return;
        clearFirst = (mode === 'replace');
      }

      if (clearFirst) {
        await dbClear('registry');
        S.locSelection.clear();
      }

      toast(`Saving ${items.length} location rows...`, "info", 2500);
      const { saved, failed } = await dbBulkPut('registry', items);

      console.log(`Saved ${saved} of ${items.length} (${failed} failed)`);
      toast(`Registry updated: ${saved} rows saved`, "success", 5000);

      S.importPreview = null;
      closeModal();
      await R();
    }

    function skipUnreadablePages() {
      if (S.importPreview) {
        S.importPreview.unreadablePages = [];
        renderModals();
      }
    }

    function downloadErrorReport() {
      const diag = S.importPreview?.diagnostics;
      const lines = [
        `MOBILIZE LOCATION IMPORT REPORT`,
        `File: ${S.importPreview?.fileName || ''}`,
        `Date: ${new Date().toLocaleString()}`,
        `Extracted Items: ${S.importPreview?.items?.length || 0}`,
        `Unreadable Pages: ${S.importPreview?.unreadablePages?.join(', ') || 'None'}`
      ];
      if (diag?.skippedSheets?.length) {
        lines.push('', 'Skipped Sheets:');
        diag.skippedSheets.forEach(s => lines.push(`- ${s.sheetName}: ${s.reason}`));
      }
      if (diag?.uninterpretableRows?.length) {
        lines.push('', 'Uninterpretable Rows:');
        diag.uninterpretableRows.forEach(r => lines.push(`- ${r.sheetName} Row ${r.excelRow}: ${r.rawPreview} (${r.reason})`));
      }
      const report = lines.join('\n') + '\n';
      const blob = new Blob([report], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `error_report_${Date.now()}.txt`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function downloadCardDiagnosticsReport() {
      const diag = S.lastImportDiagnostics;
      if (!diag) return;
      const lines = [
        `MOBILIZE WORKBOOK IMPORT DIAGNOSTICS`,
        `File: ${diag.fileName || ''}`,
        `Date: ${new Date().toLocaleString()}`,
        `Sheets Processed: ${diag.sheetsProcessed || 0}`,
        `Records Saved: ${diag.totalSaved || 0}`
      ];
      if (diag.skippedSheets?.length) {
        lines.push('', `Skipped Worksheets (${diag.skippedSheets.length}):`);
        diag.skippedSheets.forEach(s => lines.push(`- ${s.sheetName}: ${s.reason}`));
      }
      if (diag.uninterpretableRows?.length) {
        lines.push('', `Uninterpretable Rows (${diag.uninterpretableRows.length}):`);
        diag.uninterpretableRows.forEach(r => lines.push(`- ${r.sheetName} Row ${r.excelRow}: ${r.rawPreview} [${r.reason}]`));
      }
      const blob = new Blob([lines.join('\n') + '\n'], { type: 'text/plain;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `import_diagnostics_${Date.now()}.txt`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // ─────────────────────────────────────────────────────────────────
    // EXPORT ENGINE (PDF, EXCEL, CSV, PRINT)
    // ─────────────────────────────────────────────────────────────────
    async function executeExport(e) {
      e.preventDefault();
      const format = document.querySelector('input[name="expFormat"]:checked')?.value || 'pdf';
      const scope = document.querySelector('input[name="expRecords"]:checked')?.value || 'all';
      const includeImages = document.getElementById('exp-include-images')?.checked;

      let rows = await dbAll('rows');
      if (scope === 'filtered') {
        if (S.cardView === 'review') {
          rows = rows.filter(isReviewRow);
        } else {
          rows = rows.filter(isMainTableRow);
          if (S.tableFilter === 'pending') rows = rows.filter(r => r.sync === 'pending' || !r.sync);
          else if (S.tableFilter === 'synced') rows = rows.filter(r => r.sync === 'synced');
          else if (S.tableFilter === 'lga' && S.filterLga) rows = rows.filter(r => String(r.lgaCode || '').padStart(2, '0') === String(S.filterLga).padStart(2, '0'));
        }

        if (S.tableSearch.trim()) {
          const q = S.tableSearch.toLowerCase().trim();
          rows = rows.filter(r => 
            (r.name && r.name.toLowerCase().includes(q)) ||
            (r.contact && r.contact.includes(q)) ||
            ((r.vin || r.contact2) && (r.vin || r.contact2).toLowerCase().includes(q)) ||
            (r.lga && r.lga.toLowerCase().includes(q))
          );
        }
      }

      closeModal();

      if (format === 'print') {
        window.print();
        return;
      }

      if (format === 'csv') {
        exportCSV(rows);
      } else if (format === 'excel') {
        exportExcel(rows);
      } else if (format === 'pdf') {
        await exportPDF(rows, includeImages);
      }
    }

    // 11 Exact Columns (+ optional PVC column when populated):
    // S/N · NAME · PORTFOLIO/MDA · L.G.A · Code · WARD · Code · POLLING UNIT · Code · CONTACT NO · VIN [· PVC]
    function exportCSV(rows) {
      const includePvc = rows.some(r => String(r.pvc || '').trim() !== '');
      const headers = ["S/N", "NAME", "PORTFOLIO/MDA", "L.G.A", "Code", "WARD", "Code", "POLLING UNIT", "Code", "CONTACT NO", "VIN"];
      if (includePvc) headers.push("PVC");
      const lines = [headers.map(h => `"${h}"`).join(",")];

      rows.forEach((r, idx) => {
        const vinVal = r.vin || r.contact2 || '';
        const rowData = [
          r.sn || (idx + 1),
          r.name || '',
          r.portfolio || '',
          r.lga || '',
          r.lgaCode || '',
          r.ward || '',
          r.wardCode || '',
          r.pu || '',
          r.puCode || '',
          r.contact ? `\t${r.contact}` : '', // Tab prefix ensures phone leading zero preserved in CSV
          vinVal ? `\t${vinVal}` : ''
        ];
        if (includePvc) rowData.push(r.pvc || '');
        lines.push(rowData.map(v => `"${String(v).replace(/"/g, '""')}"`).join(","));
      });

      // UTF-8 BOM
      const csvContent = "\uFEFF" + lines.join("\r\n");
      const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `mobilized_records_${Date.now()}.csv`;
      a.click();
    }

    function exportExcel(rows) {
      if (!window.XLSX) {
        toast("SheetJS library not loaded.", "error");
        return;
      }
      const includePvc = rows.some(r => String(r.pvc || '').trim() !== '');
      const headers = ["S/N", "NAME", "PORTFOLIO/MDA", "L.G.A", "Code", "WARD", "Code", "POLLING UNIT", "Code", "CONTACT NO", "VIN"];
      if (includePvc) headers.push("PVC");
      const data = [headers];

      rows.forEach((r, idx) => {
        const rowArr = [
          String(r.sn || (idx + 1)),
          r.name || '',
          r.portfolio || '',
          r.lga || '',
          String(r.lgaCode || ''),
          r.ward || '',
          String(r.wardCode || ''),
          r.pu || '',
          String(r.puCode || ''),
          String(r.contact || ''),
          String(r.vin || r.contact2 || '')
        ];
        if (includePvc) rowArr.push(String(r.pvc || ''));
        data.push(rowArr);
      });

      const ws = XLSX.utils.aoa_to_sheet(data);

      // Force type "s" (string) on all codes, contact, and VIN cells to protect leading zeros
      for (let R = 1; R < data.length; ++R) {
        [4, 6, 8, 9, 10].forEach(C => {
          const cellRef = XLSX.utils.encode_cell({ c: C, r: R });
          if (ws[cellRef]) {
            ws[cellRef].t = 's';
          }
        });
      }

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Mobilized Records");
      XLSX.writeFile(wb, `mobilized_records_${Date.now()}.xlsx`);
    }

    async function exportPDF(rows, includeImages) {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        toast("jsPDF library not loaded.", "error");
        return;
      }
      toast("Generating PDF...", "info", 3000);

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'pt', 'a4');

      const title = `MOBILIZED RECORDS — ${S.tableFilter.toUpperCase()} — ${new Date().toLocaleDateString()}`;
      doc.setFont("helvetica", "bold");
      doc.setFontSize(14);
      doc.setTextColor(12, 112, 117);
      doc.text(title, 40, 36);

      const includePvc = rows.some(r => String(r.pvc || '').trim() !== '');
      const headRow = ["S/N", "NAME", "PORTFOLIO", "L.G.A", "Code", "WARD", "Code", "POLLING UNIT", "Code", "CONTACT NO", "VIN"];
      if (includePvc) headRow.push("PVC");
      const headers = [headRow];

      const body = rows.map((r, idx) => {
        const arr = [
          r.sn || (idx + 1),
          r.name || '',
          r.portfolio || '',
          r.lga || '',
          r.lgaCode || '',
          r.ward || '',
          r.wardCode || '',
          r.pu || '',
          r.puCode || '',
          r.contact || '',
          r.vin || r.contact2 || ''
        ];
        if (includePvc) arr.push(r.pvc || '');
        return arr;
      });

      doc.autoTable({
        head: headers,
        body: body,
        startY: 50,
        theme: 'grid',
        styles: { fontSize: 8.5, cellPadding: 4, font: 'helvetica' },
        headStyles: { fillColor: [12, 112, 117], textColor: [255, 255, 255], fontStyle: 'bold' },
        alternateRowStyles: { fillColor: [240, 248, 250] },
        margin: { left: 40, right: 40 }
      });

      doc.save(`mobilized_records_${Date.now()}.pdf`);
      toast("PDF downloaded!", "success");
    }

    // Utility HTML Escaper
    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Global multi-file drag-and-drop support (non-blocking)
    window.addEventListener('dragover', (e) => {
      if (e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files')) {
        e.preventDefault();
      }
    });
    window.addEventListener('drop', (e) => {
      if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files.length > 0) {
        e.preventDefault();
        const targetTab = (S.tab === 'locations') ? 'locations' : 'cards';
        dispatchUploadedFiles(e.dataTransfer.files, targetTab);
      }
    });

    // Initialize application on window load
    window.addEventListener('DOMContentLoaded', async () => {
      await initSettingsAndRegistry();
      await R();
    });
  </script>

    (function setupPwaInstall() {
      let deferredInstallPrompt = null;
      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isIOS = /iphone|ipad|ipod/i.test(window.navigator.userAgent || '');

      function updateInstallBtn() {
        const btn = document.getElementById('btn-pwa-install');
        if (!btn) return;
        if (isStandalone) {
          btn.style.display = 'none';
          return;
        }
        if (deferredInstallPrompt || isIOS) {
          btn.style.display = 'inline-flex';
        } else {
          btn.style.display = 'none';
        }
      }

      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstallPrompt = e;
        updateInstallBtn();
      });

      window.addEventListener('appinstalled', () => {
        deferredInstallPrompt = null;
        const btn = document.getElementById('btn-pwa-install');
        if (btn) btn.style.display = 'none';
        if (typeof toast === 'function') toast('App installed to home screen!', 'success');
      });

      window.triggerPwaInstall = async function() {
        if (deferredInstallPrompt) {
          deferredInstallPrompt.prompt();
          try {
            const { outcome } = await deferredInstallPrompt.userChoice;
            if (outcome === 'accepted') {
              deferredInstallPrompt = null;
              updateInstallBtn();
            }
          } catch {}
          return;
        }
        if (isIOS) {
          const existing = document.getElementById('ios-pwa-guide-overlay');
          if (existing) existing.remove();
          const overlay = document.createElement('div');
          overlay.id = 'ios-pwa-guide-overlay';
          overlay.className = 'overlay-backdrop';
          overlay.style.zIndex = '2800';
          overlay.innerHTML = `
            <div class="card modal-box" style="max-width: 420px;">
              <h3 style="font-size: 19px; margin-bottom: 10px;">Install on iPhone / iPad</h3>
              <p style="font-size: 14px; color: var(--tx); line-height: 1.6; margin-bottom: 16px;">
                1. Tap the <b>Share</b> button in your Safari toolbar.<br>
                2. Scroll down and tap <b>Add to Home Screen</b>.
              </p>
              <div style="display:flex; justify-content:flex-end;">
                <button type="button" class="btn sm" onclick="document.getElementById('ios-pwa-guide-overlay')?.remove()">Got it</button>
              </div>
            </div>
          `;
          overlay.addEventListener('click', (ev) => { if (ev.target === overlay) overlay.remove(); });
          document.body.appendChild(overlay);
        }
      };

      updateInstallBtn();
    })();
  </script>
